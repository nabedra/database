schema = "nabedra.modules/1"
fallback = "misc"

[nightly]
core_hours = 10

[[nightly.pool]]
name = "cache"
share = 60
modules = ["cache"]

[[nightly.pool]]
name = "events"
share = 40
modules = ["events"]

[[module]]
name = "cache"
level = "L2"
register = "registers/cache.md"
paths = ["server/src/cache/**", "server/src/cache.rs"]
hot_paths = ["server/src/cache/store/**"]

[[module]]
name = "events"
level = "L2"
register = "registers/events.md"
paths = ["server/events/**"]
hot_paths = []

[[module]]
name = "testing"
level = "L1"
paths = ["scripts/testing/**"]
hot_paths = []
