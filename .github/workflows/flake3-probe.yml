name: FLAKE3 probe
on:
  push:
    branches: [nabedra/hd-flake3]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: never
jobs:
  d11:
    name: FLAKE3 D11 after
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: oltp-1.94.1-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: oltp-1.94.1-
      - run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: Build native RF1 server
        run: cargo build --manifest-path server/Cargo.toml --locked --no-default-features --features oltp --bin nabedra-db
      - name: Repeat the RF1 D11 fixture with and without a delayed create
        run: |
          mkdir -p flake3
          fixture=server/tests/oltp_direct_acceptance.py
          delayed=server/tests/flake3_delayed_create.py
          python3 - "$fixture" "$delayed" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          start = source.index('def d11_index(')
          point = source.index('            index_id = uid()\n', start)
          Path(sys.argv[2]).write_text(source[:point] + '            time.sleep(3.0)\n' + source[point:])
          PY
          failed=0
          for round in delayed-create 1 2 3 4 5; do
            script="$fixture"
            if [ "$round" = delayed-create ]; then script="$delayed"; fi
            rc=0
            timeout 240s python3 "$script" --binary "$PWD/server/target/debug/nabedra-db" \
              --suite d11 --output "flake3/d11-$round" > "flake3/d11-$round.log" 2>&1 || rc=$?
            printf 'round=%s exit=%s\n' "$round" "$rc"
            cat "flake3/d11-$round.log"
            if [ "$rc" != 0 ]; then failed=$((failed + 1)); fi
          done
          echo "$failed/6 rounds failed"
          test "$failed" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flake3-d11-after
          path: flake3
          retention-days: 14
