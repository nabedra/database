name: nabedra evidence

on:
  workflow_run:
    workflows: [nabedra build]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed nabedra build run ID
        required: true
        type: string

permissions: {}

jobs:
  ingest:
    if: >-
      github.repository == 'zPy52/nabedra-database' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["workflow_dispatch", "schedule"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: nabedra-evidence-${{ inputs.run_id || github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      actions: read # Downloading even a public run's artifacts requires this scope.
      contents: write
      pull-requests: write
      attestations: read
    env:
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and ingest records
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 scripts/testing/ingest_evidence.py --run "$RUN_ID" --repo "$GITHUB_REPOSITORY"
      - name: Publish the evidence pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          records=docs/testing/evidence/records
          if [[ ! -d "$records" ]]; then exit 0; fi
          git add -- "$records"
          if git diff --cached --quiet -- "$records"; then
            echo "No new evidence records"
            exit 0
          fi
          git add -- docs/testing/coverage-matrix.md docs/testing/coverage-matrix.json

          base=$(git rev-parse HEAD)
          branch="evidence/$RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m "[skip ci] [evidence] run $RUN_ID"
          head=$(git rev-parse HEAD)

          check_paths() {
            # Disable rename detection so a rename out of scope still exposes the old path.
            git diff --exit-code --name-only --no-ext-diff --no-renames "$base...$1" -- . \
              ':(exclude,glob)docs/testing/evidence/records/**' \
              ':(exclude,literal)docs/testing/coverage-matrix.md' \
              ':(exclude,literal)docs/testing/coverage-matrix.json'
          }
          check_paths "$head"

          gh auth setup-git --hostname github.com
          ref="refs/heads/$branch"
          previous=$(git ls-remote origin "$ref")
          previous=${previous%%$'\t'*}
          if [[ -n "$previous" ]]; then
            git fetch --no-tags origin "$previous"
            check_paths "$previous"
          fi
          git push --force-with-lease="$ref:$previous" origin "HEAD:$ref"

          lookup_pr() {
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$branch" \
              --json number,isCrossRepository --jq '.[] | select(.isCrossRepository == false) | .number'
          }
          pr=$(lookup_pr)
          if [[ -z "$pr" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "[evidence] run $RUN_ID" --body-file - <<EOF
          Imports the attested evidence and regenerates the coverage matrix.

          Guarantees: none
          Evidence: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID
          Not run: PR gate skipped for the evidence-only commit
          Reviewers: automated evidence path check
          EOF
            pr=$(lookup_pr)
          fi
          [[ "$pr" =~ ^[1-9][0-9]*$ ]]
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --merge --match-head-commit "$head"
