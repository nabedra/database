# Heavy builds and verification on free standard runners.
# How agents run it: .agents/skills/code-review/references/gh-actions.md. Where builds run:
# .agents/skills/nabedra-builds/SKILL.md. The workflow uses no secrets and only reads the repository.
#
# Nothing starts on push or commit. A run starts in one of two ways:
# - A deliberate dispatch, pinned to a pushed commit:
#     gh workflow run nabedra-build.yml --ref <branch> -f sha=<40-char sha> -f request_id=<id> [-f jobs=direct ...]
#   Job definitions come from the --ref branch head; the code under test is `sha`. Every dispatch has its own
#   concurrency group, so no push, commit or other dispatch can cancel it.
# - The pull-request merge gate (base jobs and the non-blocking quarantine job on the merge commit). Only a newer
#   head of the same pull request cancels a gate run. `[skip ci]` in the head commit skips it for docs-only PRs.
#
# Builds. The `build` job compiles the debug OLTP server and every OLTP test executable once and shares them as
# one artifact. Jobs that test that build download it instead of compiling. Release, image and Events jobs keep
# their own builds. Quarantined tests and scenarios (.github/quarantine.tsv) stay out of the blocking jobs and
# run in the `quarantine` job, which never fails the run.
#
# Caches (plans/fast-builds.md, BLD1). Each Cargo job restores a dependency cache keyed by toolchain
# and manifests, and saves it right after its build step, before any test runs, so a failing test
# still leaves a cache. It saves only on a key miss and only from dispatches on main: a run can restore
# only from its own branch and the default branch, so copies saved on task branches would just fill the
# 10 GB. After a merge that changes a manifest or the toolchain, dispatch the base jobs on main.
# The saved copy is a hard-linked clone of the target with the workspace crates cleaned out, because
# their outputs are stale on the next commit. Docker jobs follow the same rule for `type=gha` layers.
name: nabedra build
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} @ {1}', inputs.request_id, inputs.sha) || github.event.pull_request.title }}

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit to test (pushed). Job definitions come from the --ref branch head.
        required: true
        type: string
      request_id:
        description: Unique ID shown in the run name, e.g. <task>-<short sha>-<hhmmss>
        required: true
        type: string
      base:
        description: Base jobs (kv, features, OLTP lib and integration, Events) and the quarantine job
        type: boolean
        default: true
      jobs:
        description: "Comma-separated opt-in jobs: direct, acceptance, campaign, docker, memory, bench, perf, g7"
        type: string
        default: ""
      scenarios:
        description: "Comma-separated OLTP acceptance scenarios to run on the shared build, e.g. O26,O21"
        type: string
        default: ""
      tests:
        description: Space-separated exact OLTP library test paths to run on the shared build
        type: string
        default: ""
      repeat:
        description: Repetitions of each `tests` entry
        type: number
        default: 1
      modes:
        description: "direct_oltp modes for direct, scenarios and tests: on,off | on | off"
        type: string
        default: "on,off"

concurrency:
  group: nabedra-build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# An explicit `bash` runs steps with `-eo pipefail`, so a failing `cargo test | tee` fails the step.
defaults:
  run:
    shell: bash

env:
  # Must match rust-toolchain.toml; every Toolchain step checks that they agree.
  RUST_TOOLCHAIN: "1.94.1"
  # The code under test: the dispatched commit, or the pull request's merge commit.
  TESTED_SHA: ${{ inputs.sha || github.sha }}
  SAVE_CACHE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "4"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # Checks the inputs and the revision, and writes what this run tests to its summary.
  revision:
    name: tested revision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      modes: ${{ steps.plan.outputs.modes }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Check the inputs and plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SHA_INPUT: ${{ inputs.sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          BASE: ${{ github.event_name == 'pull_request' || inputs.base }}
          JOBS: ${{ inputs.jobs }}
          SCENARIOS: ${{ inputs.scenarios }}
          TESTS: ${{ inputs.tests }}
          REPEAT: ${{ inputs.repeat }}
          MODES: ${{ inputs.modes || 'on,off' }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          head=$(git rev-parse HEAD)
          if [ "$EVENT" = workflow_dispatch ]; then
            [[ "$SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || fail "sha must be a full 40-character commit, got '$SHA_INPUT'"
            [ "$head" = "$SHA_INPUT" ] || fail "checked out $head, expected $SHA_INPUT"
            [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,80}$ ]] || fail "request_id must be 1-80 of [A-Za-z0-9._-]"
            [[ "$REPEAT" =~ ^[0-9]+$ ]] && [ "$REPEAT" -ge 1 ] && [ "$REPEAT" -le 200 ] || fail "repeat must be 1-200"
          fi
          known=",direct,acceptance,campaign,docker,memory,bench,perf,g7,"
          for job in ${JOBS//,/ }; do [[ "$known" == *",$job,"* ]] || fail "unknown job '$job' (known: ${known:1:-1})"; done
          modes=()
          for mode in ${MODES//,/ }; do [[ "$mode" == on || "$mode" == off ]] || fail "mode must be on or off"; modes+=("\"$mode\""); done
          [ "${#modes[@]}" -gt 0 ] || fail "modes is empty"
          include=()
          for scenario in ${SCENARIOS//,/ }; do
            [[ "$scenario" =~ ^O(0[1-9]|1[0-9]|2[0-9])$ ]] || fail "scenario must be O01-O29, got '$scenario'"
            for mode in "${modes[@]}"; do include+=("{\"scenario\":\"$scenario\",\"mode\":$mode}"); done
          done
          [ "${#include[@]}" -gt 0 ] || include=('{"scenario":"none","mode":"on"}')
          for name in $TESTS; do [[ "$name" =~ ^[a-z_][a-z0-9_]*(::[a-z_][a-z0-9_]*)+$ ]] || fail "test '$name' must be a full path"; done
          build=false
          if [ "$BASE" = true ] || [ -n "$SCENARIOS$TESTS" ] || [[ ",$JOBS," == *,direct,* || ",$JOBS," == *,acceptance,* ]]; then build=true; fi
          python3 scripts/ci_quarantine.py check
          {
            echo "build=$build"
            echo "modes=[$(IFS=,; echo "${modes[*]}")]"
            echo "scenarios={\"include\":[$(IFS=,; echo "${include[*]}")]}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Tested revision: \`$head\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Event | $EVENT |"
            echo "| Request | ${REQUEST_ID:-pull request} |"
            echo "| Workflow | \`$WORKFLOW_REF\` at \`$WORKFLOW_SHA\` |"
            echo "| Base jobs | $BASE |"
            echo "| Opt-in jobs | ${JOBS:-none} |"
            echo "| Scenarios | ${SCENARIOS:-none} (modes ${MODES}) |"
            echo "| Tests | ${TESTS:-none} (x${REPEAT:-1}) |"
            echo
            python3 scripts/ci_quarantine.py report
          } >> "$GITHUB_STEP_SUMMARY"

  # One debug OLTP build for every job that tests it: the server, the library test executable and
  # the integration test executables, packed with their paths so they land where they were built.
  build:
    name: OLTP debug build (server and test executables)
    needs: revision
    if: needs.revision.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: oltp-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: oltp-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: Build
        working-directory: server
        run: |
          set -o pipefail
          cargo test --locked --no-default-features --features oltp --lib --tests --no-run --timings \
            --message-format=json-render-diagnostics > ../build.json
          cargo build --locked --no-default-features --features oltp --bin nabedra-db
          cd ..
          # kind, name, workspace-relative path of every test executable, then the server.
          jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null)
                 | [(if (.target.kind | index("lib")) then "lib" else .target.kind[0] end), .target.name, .executable] | @tsv' build.json \
            | sed "s#\t$GITHUB_WORKSPACE/#\t#" > bins.tsv
          printf 'server\tnabedra-db\tserver/target/debug/nabedra-db\n' >> bins.tsv
          test "$(awk -F'\t' '$1 == "lib"' bins.tsv | wc -l)" = 1
          cat bins.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: oltp-build-timings
          path: server/target/cargo-timings/cargo-timing.html
          retention-days: 14
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/target ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --manifest-path server/Cargo.toml -p nabedra-database -p nabedra-kv
          rm -rf ~/cargo-cache/target/cargo-timings && du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Pack
        run: |
          printf 'source=%s\n' "$TESTED_SHA" > bins-source.txt
          tar -I 'zstd -T0 -3' -cf oltp-bins.tar.zst bins.tsv bins-source.txt $(cut -f3 bins.tsv)
          ls -la oltp-bins.tar.zst
          echo "OLTP build artifact: $(du -h oltp-bins.tar.zst | cut -f1), $(wc -l < bins.tsv) executables" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: oltp-bins
          path: oltp-bins.tar.zst
          compression-level: 0
          retention-days: 3
  kv:
    name: nabedra-kv
    needs: revision
    if: github.event_name == 'pull_request' || inputs.base || contains(format(',{0},', inputs.jobs), ',g7,')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: kv-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: kv-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: Build
        working-directory: server
        run: |
          cargo clippy --locked -p nabedra-kv --all-targets -- -D warnings
          cargo test --locked -p nabedra-kv --no-run
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/target ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --manifest-path server/Cargo.toml -p nabedra-database -p nabedra-kv
          rm -rf ~/cargo-cache/target/cargo-timings && du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Test
        working-directory: server
        run: cargo test --locked --no-fail-fast -p nabedra-kv 2>&1 | tee ../kv-test.log
      # GATEfix G7: memory of a freshly opened store (journal zero fill) at the base commit and
      # at the head, each test binary in its own systemd scope on the runner's disk. Opt-in.
      - name: G7 store memory, base vs head
        if: contains(format(',{0},', inputs.jobs), ',g7,')
        env:
          G7_BASE: 1ea46224549b565ee3e559b39319970661ea5bc0
        run: |
          git fetch --no-tags --depth=1 origin "$G7_BASE"
          git worktree add --detach ../g7-base "$G7_BASE"
          cp server/kv/tests/g7_memory.rs ../g7-base/server/kv/tests/
          mkdir -p "$RUNNER_TEMP/g7"
          for side in base head; do
            manifest=server/Cargo.toml; [ "$side" = base ] && manifest=../g7-base/server/Cargo.toml
            exe=$(CARGO_TARGET_DIR="$PWD/server/target/g7-$side" cargo test --locked --manifest-path "$manifest" \
              -p nabedra-kv --test g7_memory --no-run --message-format=json \
              | jq -r 'select(.executable != null and .target.name == "g7_memory") | .executable')
            for run in 1 2 3; do
              sudo systemd-run --scope --quiet -p MemoryAccounting=yes --uid="$(id -u)" --gid="$(id -g)" \
                --setenv=G7_DIR="$RUNNER_TEMP/g7" "$exe" --ignored --nocapture --exact g7_measure_store_memory_after_open \
                | sed -n "s/^g7_memory /g7_memory $side run $run /p" | tee -a g7-memory.log
            done
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv-test-log
          path: |
            kv-test.log
            g7-memory.log
          if-no-files-found: ignore
          retention-days: 14

  features:
    name: feature builds (O02, NS26)
    needs: revision
    if: github.event_name == 'pull_request' || inputs.base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: features-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: features-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: No RocksDB or C toolchain crates
        run: python scripts/check_engine_features.py --dependencies-only
      - name: Check every engine build
        working-directory: server
        run: |
          set -eux
          cargo check --locked --bin nabedra-db
          cargo check --locked --bin nabedra-db --no-default-features --features oltp
          cargo check --locked --bin nabedra-db --no-default-features --features oltp-backup-s3
          cargo check --locked --bin nabedra-db --no-default-features --features cache
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/target ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --manifest-path server/Cargo.toml -p nabedra-database -p nabedra-kv
          rm -rf ~/cargo-cache/target/cargo-timings && du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  oltp:
    name: OLTP library and integration tests
    needs: [revision, build]
    if: github.event_name == 'pull_request' || inputs.base
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Library suite
        id: lib
        working-directory: server
        run: |
          set -o pipefail
          "$NABEDRA_TEST_EXE" --test-threads 4 $QUARANTINE_SKIPS 2>&1 | tee ../oltp-lib.log
      - name: Integration tests
        if: ${{ !cancelled() }}
        working-directory: server
        run: |
          status=0
          for name in oltp_multiplex oltp_worker_queue worker_pool executor protocol; do
            exe=$(awk -F'\t' -v n="$name" '$1 == "test" && $2 == n {print $3}' ../bins.tsv)
            [ -n "$exe" ] || { echo "::error::integration test $name was not built"; status=1; continue; }
            echo "     Running $name ($exe)" | tee -a ../oltp-integration.log
            "$GITHUB_WORKSPACE/$exe" 2>&1 | tee -a ../oltp-integration.log || status=1
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oltp-test-logs
          path: oltp-*.log
          retention-days: 14

  events:
    name: Events tests
    needs: revision
    if: github.event_name == 'pull_request' || inputs.base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: events-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/events/Cargo.lock', 'server/events/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: events-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/events/target; fi
      - name: Build tests
        working-directory: server/events
        run: cargo test --locked --no-run
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/events/target ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --manifest-path server/events/Cargo.toml -p nabedra-events -p nabedra-kv
          rm -rf ~/cargo-cache/target/cargo-timings && du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Test
        working-directory: server/events
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee ../../events-test.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-test-log
          path: events-test.log
          retention-days: 14

  campaign:
    name: crash campaign (release, long)
    needs: revision
    if: contains(format(',{0},', inputs.jobs), ',campaign,')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: campaign-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: campaign-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: Build release tests
        id: build
        working-directory: server
        run: |
          cargo test --locked --release -p nabedra-kv --test campaign --test store_model --test store_crash --test store_gc --no-run
          cargo test --locked --release --no-default-features --features oltp --test kv_crash --no-run
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/target ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --release --manifest-path server/Cargo.toml -p nabedra-database -p nabedra-kv
          rm -rf ~/cargo-cache/target/cargo-timings && du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: kv campaign, long modes (NS01, NS04, NS05, NS07, NS09, NS11, NS17)
        working-directory: server
        run: |
          set -o pipefail
          # NS01 at 1e6 steps (~2.5 h) runs in its own job, campaign-ns01.
          cargo test --locked --no-fail-fast --release -p nabedra-kv --test campaign -- --ignored --nocapture --test-threads 2 \
            --skip ns01_ns10_differential_1e6_with_cuts_and_faults 2>&1 | tee ../campaign.log
      - name: kv store long models (NS01 1e6, NS05 seeds, relocation crash points)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: server
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast --release -p nabedra-kv --test store_model --test store_crash --test store_gc -- --ignored --nocapture 2>&1 | tee ../store-long.log
      - name: SIGKILL and cold start (NS16, D09, R04, O11)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: server
        run: |
          set -o pipefail
          cargo test --locked --release --no-default-features --features oltp --test kv_crash -- --nocapture 2>&1 | tee ../kv-crash.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-logs
          path: |
            campaign.log
            store-long.log
            kv-crash.log
          retention-days: 14

  campaign-ns01:
    name: crash campaign NS01 1e6 (release, long)
    needs: revision
    if: contains(format(',{0},', inputs.jobs), ',campaign,')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: campaign-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: campaign-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: NS01 differential, 1e6 steps with cuts and faults
        working-directory: server
        run: |
          set -o pipefail
          cargo test --locked --release -p nabedra-kv --test campaign -- --ignored --nocapture --exact \
            ns01_ns10_differential_1e6_with_cuts_and_faults 2>&1 | tee ../campaign-ns01.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-ns01-log
          path: campaign-ns01.log
          retention-days: 14

  docker-oltp:
    name: OLTP image
    needs: revision
    if: contains(format(',{0},', inputs.jobs), ',docker,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: docker/setup-buildx-action@v3
      - name: Start clock
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            NABEDRA_ENGINE=oltp
            BUILD_JOBS=4
          tags: nabedra-oltp:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=oltp-image
          cache-to: ${{ env.SAVE_CACHE == 'true' && 'type=gha,mode=max,scope=oltp-image' || '' }}
      - name: Build time and size
        run: |
          echo "build_seconds=$(( $(date +%s) - BUILD_START ))"
          docker image ls nabedra-oltp:ci
      - name: Runtime libraries (only libc, libm, libgcc_s)
        run: |
          libraries=$(docker run --rm --entrypoint ldd nabedra-oltp:ci /usr/local/bin/nabedra-db)
          echo "$libraries"
          unexpected=$(echo "$libraries" | grep -vE '^\s*(linux-vdso\.so\.1|libc\.so\.6|libm\.so\.6|libgcc_s\.so\.1|/lib64/ld-linux-x86-64\.so\.2)[ (]' || true)
          if [ -n "$unexpected" ]; then echo "unexpected runtime libraries: $unexpected" >&2; exit 1; fi
      - name: Export Cargo timings
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            NABEDRA_ENGINE=oltp
            BUILD_JOBS=4
          target: timings
          outputs: type=local,dest=image-timings
          provenance: false
          cache-from: type=gha,scope=oltp-image
      - uses: actions/upload-artifact@v4
        with:
          name: oltp-image-timings
          path: image-timings
          retention-days: 14

  docker-events:
    name: Events image and acceptance
    needs: revision
    if: contains(format(',{0},', inputs.jobs), ',docker,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: docker/setup-buildx-action@v3
      - name: Start clock
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/events/deploy/Dockerfile
          build-args: BUILD_JOBS=4
          tags: nabedra-events:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=events-image
          cache-to: ${{ env.SAVE_CACHE == 'true' && 'type=gha,mode=max,scope=events-image' || '' }}
      - name: Build time, size and runtime libraries
        run: |
          echo "build_seconds=$(( $(date +%s) - BUILD_START ))"
          docker image ls nabedra-events:ci
          docker run --rm --entrypoint ldd nabedra-events:ci /usr/local/bin/nabedra-events
      - name: Acceptance (NS27)
        run: |
          docker pull python:3.11-slim-bookworm
          mkdir -p events-acceptance
          python server/events/tests/acceptance.py --image nabedra-events:ci --cpus 2 --memory-mib 1536 \
            --fault-image python:3.11-slim-bookworm --output events-acceptance/result.json --logs events-acceptance/logs
      - name: Acceptance summary
        if: always()
        run: |
          python -c 'import json, sys; cases = json.load(open(sys.argv[1]))["cases"]; passed = sum(c["pass"] for c in cases.values()); print(f"events acceptance: {passed}/{len(cases)} cases passed"); [print(name, case) for name, case in cases.items()]' events-acceptance/result.json || true
      - name: Export Cargo timings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/events/deploy/Dockerfile
          build-args: BUILD_JOBS=4
          target: timings
          outputs: type=local,dest=image-timings
          provenance: false
          cache-from: type=gha,scope=events-image
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-acceptance
          path: |
            events-acceptance
            image-timings
          retention-days: 14

  acceptance:
    name: Linux OLTP acceptance
    needs: [revision, build]
    if: contains(format(',{0},', inputs.jobs), ',acceptance,')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Acceptance (no AWS, no comparative benchmarks)
        run: |
          # Exit 1 = a scenario failed; exit 2 = some scenarios did not run (listed in results.json, never counted as passed).
          rc=0; python scripts/acceptance_oltp.py --test-binary "$NABEDRA_TEST_EXE" --server-binary "$NABEDRA_BIN" \
            --category compatibility --category queries --category transactions \
            --category recovery --category growth $KEEP_SCENARIOS --output artifacts/oltp-acceptance || rc=$?
          python scripts/ci_acceptance_summary.py artifacts/oltp-acceptance/results.json >> "$GITHUB_STEP_SUMMARY" || true
          [ "$rc" = 0 ] || [ "$rc" = 2 ]
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oltp-acceptance
          path: artifacts/oltp-acceptance
          retention-days: 14

  # T9: direct point path scenarios D01-D12 on real processes, and the existing suites, one matrix leg
  # per direct_oltp mode. D01-D12 and the Python unit tests run in the on leg, the library suite in the
  # off leg (the oltp job runs it with direct_oltp on).
  direct:
    name: direct point path and suites, direct_oltp ${{ matrix.mode }} (T9)
    needs: [revision, build]
    if: contains(format(',{0},', inputs.jobs), ',direct,')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.revision.outputs.modes) }}
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Build the TypeScript ORM
        id: build
        run: |
          (cd orm/typescript && npm ci --no-audit --no-fund && npm run build)
          python -m pip install --quiet "httpx>=0.27,<1"
          mkdir -p artifacts
      - name: D01-D12 and U01 on real processes
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'on' }}
        run: |
          set -o pipefail
          python server/tests/oltp_direct_acceptance.py --binary "$NABEDRA_BIN" --test-executable "$NABEDRA_TEST_EXE" \
            --output artifacts/direct 2>&1 | tee artifacts/direct.log
      - name: ORM suites, direct_oltp ${{ matrix.mode }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          status=0
          if [ "$MODE" = on ]; then
            (cd orm/python && PYTHONPATH=src python -m unittest discover -s tests) 2>&1 | tee artifacts/orm-python-unit.log || status=1
          fi
          binary="$NABEDRA_BIN"; [ "$MODE" = off ] && binary="$GITHUB_WORKSPACE/server/tests/direct_off_server.sh"
          (cd orm/typescript && NABEDRA_TEST_SERVER_BINARY="$binary" npm test) 2>&1 | tee "artifacts/orm-typescript-$MODE.log" || status=1
          python server/tests/oltp_process.py --binary "$binary" 2>&1 | tee "artifacts/orm-python-process-$MODE.log" || status=1
          exit $status
      - name: OLTP library suite, direct_oltp off
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'off' }}
        working-directory: server
        run: |
          set -o pipefail
          NABEDRA_TEST_DIRECT_OLTP=off "$NABEDRA_TEST_EXE" --test-threads 4 $QUARANTINE_SKIPS 2>&1 | tee ../artifacts/oltp-lib-direct-off.log
      - name: OLTP acceptance, direct_oltp ${{ matrix.mode }} (no AWS, no benchmarks)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          rc=0
          NABEDRA_TEST_DIRECT_OLTP=$MODE python scripts/acceptance_oltp.py --test-binary "$NABEDRA_TEST_EXE" \
            --server-binary "$NABEDRA_BIN" --category compatibility --category queries --category transactions \
            --category recovery --category growth $KEEP_SCENARIOS --output "artifacts/acceptance-$MODE" > "artifacts/acceptance-$MODE.log" 2>&1 || rc=$?
          tail -40 "artifacts/acceptance-$MODE.log"
          python scripts/ci_acceptance_summary.py "artifacts/acceptance-$MODE/results.json" >> "$GITHUB_STEP_SUMMARY" || true
          # Exit 1 = a scenario failed; exit 2 = some scenarios did not run (listed in results.json, not counted as passed).
          [ "$rc" = 0 ] || [ "$rc" = 2 ]
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-evidence-${{ matrix.mode }}
          path: artifacts
          retention-days: 14

  # Selected OLTP acceptance scenarios on the shared build, one job per scenario and mode.
  scenarios:
    name: acceptance ${{ matrix.scenario }}, direct_oltp ${{ matrix.mode }}
    needs: [revision, build]
    if: github.event_name == 'workflow_dispatch' && inputs.scenarios != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.revision.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.scenario }}
        env:
          SCENARIO: ${{ matrix.scenario }}
          MODE: ${{ matrix.mode }}
        run: |
          rc=0
          NABEDRA_TEST_DIRECT_OLTP=$MODE python scripts/acceptance_oltp.py --test-binary "$NABEDRA_TEST_EXE" \
            --server-binary "$NABEDRA_BIN" --scenario "$SCENARIO" --output "artifacts/$SCENARIO-$MODE" || rc=$?
          python scripts/ci_acceptance_summary.py "artifacts/$SCENARIO-$MODE/results.json" >> "$GITHUB_STEP_SUMMARY" || true
          # Exit 2 = the scenario did not execute every assertion: shown as not-run, never as passed.
          if [ "$rc" = 2 ]; then echo "::warning::$SCENARIO direct_oltp=$MODE: not-run (see results.json)"; exit 0; fi
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-${{ matrix.scenario }}-${{ matrix.mode }}
          path: artifacts
          retention-days: 14

  # Exact library tests repeated on the shared build (flake probes, focused reruns).
  tests:
    name: library tests x${{ inputs.repeat }}, direct_oltp ${{ matrix.mode }}
    needs: [revision, build]
    if: github.event_name == 'workflow_dispatch' && inputs.tests != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.revision.outputs.modes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Repeat
        working-directory: server
        env:
          TESTS: ${{ inputs.tests }}
          REPEAT: ${{ inputs.repeat }}
          MODE: ${{ matrix.mode }}
        run: python3 ../scripts/ci_repeat_tests.py --mode "$MODE" --repeat "$REPEAT" --log ../tests.log $TESTS >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.mode }}
          path: tests.log
          retention-days: 14

  # Quarantined tests and scenarios (.github/quarantine.tsv), run repeatedly so their owners see
  # current pass counts. Never fails the run: results go to the summary as warnings.
  quarantine:
    name: quarantined tests and scenarios (non-blocking)
    needs: [revision, build]
    if: github.event_name == 'pull_request' || inputs.base
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Quarantined tests, 5 runs each
        working-directory: server
        run: |
          tests=$(python3 ../scripts/ci_quarantine.py tests)
          if [ -z "$tests" ]; then echo "No quarantined tests." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python3 ../scripts/ci_repeat_tests.py --mode on --repeat 5 --log ../quarantine-tests.log --report-only $tests >> "$GITHUB_STEP_SUMMARY"
      - name: Quarantined scenarios, both modes
        if: ${{ !cancelled() }}
        run: |
          for scenario in $(python3 scripts/ci_quarantine.py scenarios); do
            for mode in on off; do
              NABEDRA_TEST_DIRECT_OLTP=$mode python scripts/acceptance_oltp.py --test-binary "$NABEDRA_TEST_EXE" \
                --server-binary "$NABEDRA_BIN" --scenario "$scenario" --output "artifacts/$scenario-$mode" || true
              python scripts/ci_acceptance_summary.py "artifacts/$scenario-$mode/results.json" >> "$GITHUB_STEP_SUMMARY" || true
            done
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-evidence
          path: |
            quarantine-tests.log
            artifacts
          if-no-files-found: ignore
          retention-days: 14

  # FLAKE1 (G7 follow-up): worker anon memory under point-update load on a real RF3 cluster
  # (server/tests/oltp_worker_memory.py), for THP always/madvise x MALLOC_ARENA_MAX unset/2, plus
  # a heaptrack profile of every worker. Opt-in: dispatch with jobs=memory.
  memory:
    name: worker memory under load, THP and malloc arenas, heaptrack (FLAKE1)
    needs: revision
    if: contains(format(',{0},', inputs.jobs), ',memory,')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build release nabedra-db (oltp, line tables for heaptrack)
        working-directory: server
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build --locked --release --no-default-features --features oltp --bin nabedra-db
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq heaptrack gdb > /dev/null
          sudo sysctl -w kernel.yama.ptrace_scope=0
          python -m pip install --quiet "httpx>=0.27,<1"
          nproc; free -m; ldd --version | sed -n 1p
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag
      - name: Memory matrix (THP x MALLOC_ARENA_MAX)
        run: |
          set -o pipefail
          mkdir -p artifacts
          bin="$PWD/server/target/release/nabedra-db"
          status=0
          for thp in always madvise; do
            echo "$thp" | sudo tee /sys/kernel/mm/transparent_hugepage/enabled > /dev/null
            for arena in default 2; do
              label="thp-$thp-arena-$arena"
              if [ "$arena" = default ]; then unset MALLOC_ARENA_MAX; else export MALLOC_ARENA_MAX=$arena; fi
              python server/tests/oltp_worker_memory.py --binary "$bin" --output "artifacts/$label" --label "$label" \
                2>&1 | tee "artifacts/$label.log" | grep -v '^{' || status=1
              rm -rf "artifacts/$label/cluster"
            done
          done
          unset MALLOC_ARENA_MAX
          exit $status
      - name: Heaptrack profile (THP always, default arenas)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          echo always | sudo tee /sys/kernel/mm/transparent_hugepage/enabled > /dev/null
          bin="$PWD/server/target/release/nabedra-db"
          python server/tests/oltp_worker_memory.py --binary "$bin" --output artifacts/heaptrack --label heaptrack \
            --heaptrack 2>&1 | tee artifacts/heaptrack.log | grep -v '^{'
          grep -h '"leader"' artifacts/heaptrack/memory.json || true
          for profile in artifacts/heaptrack/heaptrack.w*; do
            name=$(basename "$profile" | sed -E 's/\.(gz|zst)$//')
            heaptrack_print -f "$profile" --print-peaks 1 --print-allocators 1 --print-temporary 1 --print-leaks 0 \
              -n 25 > "artifacts/heaptrack/$name.txt" 2>&1 || true
            echo "===== $profile"; { awk '/^PEAK MEMORY CONSUMERS/{p=1} p' "artifacts/heaptrack/$name.txt" | grep -E 'peak memory consumed over|/server/(src|kv)/' | head -120; } || true
            tail -6 "artifacts/heaptrack/$name.txt" || true
          done
          rm -rf artifacts/heaptrack/cluster
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-evidence
          path: artifacts
          retention-days: 14

  # NS11/T10: the release OLTP server for the comparative benchmark, built in the same
  # Debian bookworm base as the Dockerfile's build stage (glibc of the benchmark images),
  # plus the NS18 engine microbench in release. Opt-in: dispatch with
  # jobs=bench. The comparative benchmark itself runs on the controlled host.
  bench:
    name: release benchmark binary and NS18 microbench (NS11)
    needs: revision
    if: contains(format(',{0},', inputs.jobs), ',bench,')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: rust:1.94.1-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Build release nabedra-db (oltp)
        working-directory: server
        run: |
          start=$(date +%s)
          cargo build --locked --release --no-default-features --features oltp --bin nabedra-db
          echo "build_seconds=$(( $(date +%s) - start ))" | tee ../bench-build.txt
          mkdir -p ../bench-bin
          cp target/release/nabedra-db "../bench-bin/nabedra-db-${TESTED_SHA::7}"
          cd ../bench-bin
          sha256sum nabedra-db-* | tee -a ../bench-build.txt
          ./nabedra-db-* --version | tee -a ../bench-build.txt
          ldd nabedra-db-* | tee -a ../bench-build.txt
          { ldd --version || true; } | sed -n 1p | tee -a ../bench-build.txt
          cp ../bench-build.txt .
      - uses: actions/upload-artifact@v4
        with:
          name: bench-binary
          path: bench-bin
          retention-days: 14
      - name: NS18 microbench (release, ignored tests)
        working-directory: server
        run: |
          set -o pipefail
          nproc; free -m; df -h .
          cargo test --locked --release -p nabedra-kv --test store_bench -- --ignored --nocapture --test-threads 1 2>&1 | tee ../ns18-bench.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns18-bench-log
          path: ns18-bench.log
          retention-days: 14

  # PERF1: CPU profile of the RF3 direct path. Opt-in with jobs=perf: builds a release binary with
  # frame pointers (for perf call graphs; the bench job's binary stays the comparison build), runs
  # the benchmark driver on this runner with the NS11 caps, records per-stage timings from
  # /v1/runtime/stats and samples every worker with perf at idle (serial pair) and at 50 updates/s.
  perf:
    name: direct path CPU profile and stage timings (PERF1)
    needs: revision
    if: contains(format(',{0},', inputs.jobs), ',perf,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Release nabedra-db with frame pointers (bookworm)
        run: |
          mkdir -p perf-bin
          docker run --rm -v "$PWD:/w" -w /w/server -e CARGO_BUILD_JOBS=4 -e CARGO_TERM_COLOR=never \
            -e RUSTFLAGS="-C force-frame-pointers=yes" "rust:${RUST_TOOLCHAIN}-bookworm" \
            sh -ec 'cargo build --locked --release --no-default-features --features oltp --bin nabedra-db && cp target/release/nabedra-db /w/perf-bin/nabedra-db-fp'
          sudo chown -R "$(id -u):$(id -g)" perf-bin server/target || true
          ls -la perf-bin
      - name: Benchmark image and perf
        run: |
          printf 'FROM python:3.11-slim-bookworm\nENV TOKIO_WORKER_THREADS=2\n' | docker build -t nabedra-perf-ci:1 -
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version; nproc; free -m
      - name: Serial pair with stage timings and an idle profile
        run: |
          cd scripts
          python3.11 benchmark_oltp_nabedra.py --image nabedra-perf-ci:1 --binary "$GITHUB_WORKSPACE/perf-bin/nabedra-db-fp" --direct-oltp on \
            --output "$GITHUB_WORKSPACE/perf-out/serial" --rates 0.2 --seconds 5 --warmup-seconds 5 --repetitions 10 \
            --clients 1 --rows 2000 --seed 20261118 --timeout 10 --perf-record 30 --perf-delay 20 --perf-frequency 999 --perf-call-graph fp
      - name: 50 updates/s with perf
        run: |
          cd scripts
          python3.11 benchmark_oltp_nabedra.py --image nabedra-perf-ci:1 --binary "$GITHUB_WORKSPACE/perf-bin/nabedra-db-fp" --direct-oltp on \
            --output "$GITHUB_WORKSPACE/perf-out/rate50" --rates 50 --seconds 60 --warmup-seconds 5 --repetitions 1 \
            --clients 32 --rows 5000 --seed 20261118 --timeout 10 --perf-record 25 --perf-delay 25 --perf-frequency 999 --perf-call-graph fp
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/perf-out" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-profile
          path: perf-out
          retention-days: 14
