# Heavy builds and verification on free standard runners.
# How agents run it: .agents/skills/code-review/references/gh-actions.md. Where builds run:
# .agents/skills/nabedra-builds/SKILL.md. Opt-in S3 checks use OIDC on dispatches.
#
# Manually dispatch a run pinned to a pushed commit.
# Job definitions come from the selected ref. The sha input selects the code under test.
#
# Opt-in jobs (`-f jobs=a,b`; unknown names fail the run). Selecting a job may imply others; the
# `revision` job resolves the list and writes it to the run summary:
#   direct      D01-D12, ORM suites, library suite off, acceptance, one leg per mode; implies rep1, growth, o02
#   acceptance  Linux OLTP acceptance in the default mode; implies growth, o02
#   o02         O01 ORM parity and O02 engine identity with an OLAP server and the engine matrix, per mode (+ T02)
#   growth      O16 and O26 on the shared build, O21 and O28 on one opt-level-1 build, per mode
#   rep1        REP1-REP5 process suites: scale, rollback, restart, replacement check, abandon, wipe, data trust
#   rep4-mixed  builds the pre-execution worker and tests mixed-version enrollment
#   o22         adds O22 to `scenarios` (focused O22, per mode)
#   blackhole   AZ1/AZ2 RF3 packet-drop failover fixture (O06/O18)
#   migrate     MIG1/MIG2 RocksDB-era RF3 archive export and restore
#   live3, live3-fixture  LIVE3 Linux release binaries per engine; the library test executable
#   campaign, docker, memory, bench, perf, g7, gc1, perf1, snap1  long, image and measurement jobs
#   ab, insn    paired docs/testing/perf specs (ab_specs, default all) and Callgrind counts of ab_base
#               (default: sha, an A/A run) against sha
#   engine-tests, check-tests  Cache, OLAP and nabedra-check tests, also in the base jobs
#   clippy      the phase 7 runtime seam bans (server/clippy.toml) for every product feature set, also a base job
#   features    engine feature checks and the OLTP S3 loopback fixture, also a base job
#   quarantine  non-blocking test and scenario reruns, available by manual dispatch
#   fuzz, mutants  libFuzzer targets or mutation tests on the diff from main's merge base
#
# Builds. The `build` job compiles the debug OLTP server and every OLTP test executable once and shares them as
# one artifact. Jobs that test that build download it instead of compiling. `growth-build` makes the one
# opt-level-1 build O21 and O28 need. Release, image and Events jobs keep their own builds. Quarantined tests
# and scenarios (.github/quarantine.tsv) stay out of the blocking jobs and run in the `quarantine` job, which
# never fails the run.
#
# Caches (plans/fast-builds.md, BLD1). Each Cargo job restores a dependency cache keyed by toolchain
# and manifests, and saves it right after its build step, before any test runs, so a failing test
# still leaves a cache. It saves only on a key miss and only from dispatches on main: a run can restore
# only from its own branch and the default branch, so copies saved on task branches would just fill the
# 10 GB. After a merge that changes a manifest or the toolchain, dispatch the base jobs on main.
# The saved copy is a hard-linked clone of the target with the workspace crates cleaned out, because
# their outputs are stale on the next commit. Docker jobs follow the same rule for `type=gha` layers.
name: nabedra build
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} @ {1}', inputs.request_id, inputs.sha) || github.event.pull_request.title }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit to test (pushed). Job definitions come from the --ref branch head.
        required: true
        type: string
      request_id:
        description: Unique ID shown in the run name, e.g. <task>-<short sha>-<hhmmss>
        required: true
        type: string
      base:
        description: Base jobs (kv, features, clippy, Cache, OLAP, nabedra-check, OLTP, Events)
        type: boolean
        default: true
      jobs:
        description: "Comma-separated opt-in jobs: direct, acceptance, o02, growth, rep1, rep4-mixed, o22, blackhole, migrate, live3, live3-fixture, campaign, docker, memory, bench, perf, g7, gc1, perf1, snap1, ab, insn, engine-tests, check-tests, features, clippy, quarantine, fuzz, mutants"
        type: string
        default: ""
      ab_base:
        description: "Full base commit for jobs=ab and insn; empty compares sha with itself (A/A)"
        type: string
        default: ""
      ab_specs:
        description: "Comma-separated docs/testing/perf specs for jobs=ab, e.g. kv/store (default: all)"
        type: string
        default: ""
      ab_drivers:
        description: "jobs=ab drivers and fixtures: harness (the workflow ref's, both sides) or side (each side's own tree)"
        type: string
        default: harness
      checks:
        description: Comma-separated check IDs from docs/testing/checks
        type: string
        default: ""
      fuzz_seconds:
        description: Seconds to fuzz each target
        type: number
        default: 300
      scenarios:
        description: "Comma-separated OLTP acceptance scenarios to run on the shared build, e.g. O26,O21"
        type: string
        default: ""
      tests:
        description: Space-separated exact OLTP library test paths to run on the shared build
        type: string
        default: ""
      repeat:
        description: Repetitions of each `tests` entry
        type: number
        default: 1
      modes:
        description: "direct_oltp modes for direct, scenarios and tests: on,off | on | off"
        type: string
        default: "on,off"

concurrency:
  group: nabedra-build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# An explicit `bash` runs steps with `-eo pipefail`, so a failing `cargo test | tee` fails the step.
defaults:
  run:
    shell: bash

env:
  # Must match rust-toolchain.toml; every Toolchain step checks that they agree.
  RUST_TOOLCHAIN: "1.94.1"
  RUST_NIGHTLY: "nightly-2026-11-20"
  # The code under test: the dispatched commit, or the pull request's merge commit.
  TESTED_SHA: ${{ inputs.sha || github.sha }}
  SAVE_CACHE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "4"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # Checks the inputs and the revision, and writes what this run tests to its summary.
  revision:
    name: tested revision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      build_lib_only: ${{ steps.plan.outputs.build_lib_only }}
      pr_jobs: ${{ steps.plan.outputs.pr_jobs }}
      engine_suites: ${{ steps.plan.outputs.engine_suites }}
      # The resolved opt-in jobs, comma-delimited on both sides (",direct,rep1,"), for contains().
      jobs: ${{ steps.plan.outputs.jobs }}
      modes: ${{ steps.plan.outputs.modes }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      has_scenarios: ${{ steps.plan.outputs.has_scenarios }}
      growth: ${{ steps.plan.outputs.growth }}
      has_growth: ${{ steps.plan.outputs.has_growth }}
      checks: ${{ steps.checks.outputs.matrix }}
      fuzz: ${{ steps.fuzz.outputs.matrix }}
      ab_base: ${{ steps.ab.outputs.base }}
      ab_matrix: ${{ steps.ab.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Check the inputs and plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SHA_INPUT: ${{ inputs.sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          BASE: ${{ inputs.base || false }}
          JOBS: ${{ inputs.jobs }}
          SCENARIOS: ${{ inputs.scenarios }}
          TESTS: ${{ inputs.tests }}
          REPEAT: ${{ inputs.repeat }}
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds }}
          MODES: ${{ inputs.modes || 'on,off' }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          head=$(git rev-parse HEAD)
          if [ "$EVENT" = workflow_dispatch ]; then
            [[ "$SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || fail "sha must be a full 40-character commit, got '$SHA_INPUT'"
            [ "$head" = "$SHA_INPUT" ] || fail "checked out $head, expected $SHA_INPUT"
            [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,80}$ ]] || fail "request_id must be 1-80 of [A-Za-z0-9._-]"
            [[ "$REPEAT" =~ ^[0-9]+$ ]] && [ "$REPEAT" -ge 1 ] && [ "$REPEAT" -le 200 ] || fail "repeat must be 1-200"
            [[ "$FUZZ_SECONDS" =~ ^[0-9]+$ ]] && [ "$FUZZ_SECONDS" -ge 1 ] || fail "fuzz_seconds must be a positive integer"
          fi
          known=",direct,acceptance,o02,growth,rep1,rep4-mixed,o22,blackhole,migrate,live3,live3-fixture,campaign,docker,memory,bench,perf,g7,gc1,perf1,snap1,ab,insn,engine-tests,check-tests,features,clippy,quarantine,fuzz,mutants,"
          selected=","
          add() { [[ "$selected" == *",$1,"* ]] || selected+="$1,"; }
          has() { [[ "$selected" == *",$1,"* ]]; }
          for job in ${JOBS//,/ }; do [[ "$known" == *",$job,"* ]] || fail "unknown job '$job' (known: ${known:1:-1})"; add "$job"; done
          # direct carries the checks hardening's [ci direct] ran (REP1 suites, growth scenarios); direct and
          # acceptance leave O02 and the growth category to their own jobs, which have the inputs they need.
          if has direct; then add rep1; add growth; add o02; fi
          if has acceptance; then add growth; add o02; fi
          modes=()
          for mode in ${MODES//,/ }; do [[ "$mode" == on || "$mode" == off ]] || fail "mode must be on or off"; modes+=("$mode"); done
          [ "${#modes[@]}" -gt 0 ] || fail "modes is empty"
          scenario_list=" "
          for scenario in ${SCENARIOS//,/ } $(has o22 && echo O22); do
            [[ "$scenario" =~ ^O(0[1-9]|1[0-9]|2[0-9])$ ]] || fail "scenario must be O01-O29, got '$scenario'"
            [[ "$scenario_list" == *" $scenario "* ]] || scenario_list+="$scenario "
          done
          include=()
          for scenario in $scenario_list; do
            for mode in "${modes[@]}"; do include+=("{\"scenario\":\"$scenario\",\"mode\":\"$mode\"}"); done
          done
          has_scenarios=false; [ "${#include[@]}" -gt 0 ] && has_scenarios=true
          [ "${#include[@]}" -gt 0 ] || include=('{"scenario":"none","mode":"on"}')
          for name in $TESTS; do [[ "$name" =~ ^[a-z_][a-z0-9_]*(::[a-z_][a-z0-9_]*)+$ ]] || fail "test '$name' must be a full path"; done
          python3 scripts/ci_quarantine.py check
          # Growth scenarios: O16 and O26 run every mode in one job on the shared build; O21 and O28 run one
          # job per mode on the opt-level-1 build. Quarantined scenarios run in the quarantine job instead.
          quarantined=" $(python3 scripts/ci_quarantine.py scenarios | tr '\n' ' ') "
          growth=()
          if has growth; then
            for scenario in O16 O26; do
              [[ "$quarantined" == *" $scenario "* ]] || growth+=("{\"scenario\":\"$scenario\",\"modes\":\"${modes[*]}\",\"label\":\"$(IFS=-; echo "${modes[*]}")\",\"opt1\":false,\"timeout\":600}")
            done
            for scenario in O21 O28; do
              [[ "$quarantined" == *" $scenario "* ]] && continue
              for mode in "${modes[@]}"; do growth+=("{\"scenario\":\"$scenario\",\"modes\":\"$mode\",\"label\":\"$mode\",\"opt1\":true,\"timeout\":3600}"); done
            done
          fi
          has_growth=false; [ "${#growth[@]}" -gt 0 ] && has_growth=true
          [ "${#growth[@]}" -gt 0 ] || growth=('{"scenario":"none","modes":"on","label":"on","opt1":false,"timeout":600}')
          pr_jobs=","
          if [ "$EVENT" = pull_request ]; then
            pr_jobs=$(python3 scripts/testing/ci/plan_pr_jobs.py)
          fi
          pr_has() { [[ "$pr_jobs" == *",$1,"* ]]; }
          build=false
          for job in direct acceptance o02 growth rep1 rep4-mixed blackhole live3-fixture quarantine; do
            has "$job" && build=true
          done
          if [ "$BASE" = true ] || pr_has oltp || [ "$has_scenarios" = true ]; then build=true; fi
          build_lib_only=false
          if [ "$build" = false ] && [ -n "$TESTS" ]; then
            build_lib_only=true
            build=true
          fi
          engine_suites=()
          if [ "$BASE" = true ] || has engine-tests || pr_has cache; then
            engine_suites+=('{"suite":"Cache library","engine":"cache","shard":1}')
          fi
          if [ "$BASE" = true ] || has engine-tests || pr_has olap; then
            engine_suites+=('{"suite":"OLAP shard 1 of 2","engine":"olap","shard":1}')
            engine_suites+=('{"suite":"OLAP shard 2 of 2","engine":"olap","shard":2}')
          fi
          quoted=$(printf '"%s",' "${modes[@]}")
          {
            echo "build=$build"
            echo "build_lib_only=$build_lib_only"
            echo "pr_jobs=$pr_jobs"
            echo "engine_suites=[$(IFS=,; echo "${engine_suites[*]}")]"
            echo "jobs=$selected"
            echo "modes=[${quoted%,}]"
            echo "scenarios={\"include\":[$(IFS=,; echo "${include[*]}")]}"
            echo "has_scenarios=$has_scenarios"
            echo "growth={\"include\":[$(IFS=,; echo "${growth[*]}")]}"
            echo "has_growth=$has_growth"
          } >> "$GITHUB_OUTPUT"
          resolved=$(echo "$selected" | sed 's/^,//; s/,$//')
          shown=$(echo $scenario_list | tr ' ' ',')
          {
            echo "### Tested revision: \`$head\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Event | $EVENT |"
            echo "| Request | ${REQUEST_ID:-pull request} |"
            echo "| Workflow | \`$WORKFLOW_REF\` at \`$WORKFLOW_SHA\` |"
            echo "| Base jobs (dispatch) | $BASE |"
            if [ "$EVENT" = pull_request ]; then
              pr_selected=${pr_jobs#,}; pr_selected=${pr_selected%,}
              echo "| Automatic PR suites | ${pr_selected:-none} |"
            fi
            echo "| Opt-in jobs | ${JOBS:-none} (resolved: ${resolved:-none}) |"
            echo "| Scenarios | ${shown:-none} (modes ${MODES}) |"
            echo "| Tests | ${TESTS:-none} (x${REPEAT:-1}) |"
            echo
            python3 scripts/ci_quarantine.py report
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve the A/B base and specs
        id: ab
        if: contains(steps.plan.outputs.jobs, ',ab,') || contains(steps.plan.outputs.jobs, ',insn,')
        env:
          AB_BASE: ${{ inputs.ab_base }}
          AB_SPECS: ${{ inputs.ab_specs }}
        run: |
          base=${AB_BASE:-$TESTED_SHA}
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ab_base must be a full 40-character commit, got '$base'"; exit 1; }
          # spec:target, one leg each; ab_specs selects a subset (default all).
          all="cache/get-hit:cache events/publish:events olap/streaming:olap olap/streaming-sparse:olap"
          all+=" oltp/point-update:oltp oltp/queued-update:oltp kv/store:kv sim/oltp-seeds:sim"
          for spec in ${AB_SPECS//,/ }; do [[ " $all " == *" $spec:"* ]] || { echo "::error::unknown ab spec '$spec'"; exit 1; }; done
          legs=()
          for entry in $all; do
            spec=${entry%%:*}
            [ -z "$AB_SPECS" ] || [[ ",$AB_SPECS," == *",$spec,"* ]] || continue
            legs+=("{\"spec\":\"$spec\",\"name\":\"${spec//\//-}\",\"target\":\"${entry##*:}\"}")
          done
          { echo "base=$base"; echo "matrix={\"include\":[$(IFS=,; echo "${legs[*]}")]}"; } >> "$GITHUB_OUTPUT"
          printf '\nA/B base: `%s`, head: `%s`, harness: `%s`, specs: %s\n' "$base" "$TESTED_SHA" "$GITHUB_SHA" "${AB_SPECS:-all}" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate registered checks and plan their jobs
        id: checks
        if: github.event_name == 'workflow_dispatch' && inputs.checks != ''
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          matrix=$(python3 scripts/testing/ci/plan_checks.py)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf '\nRegistered checks: %s\n' "$(jq -r 'map(.id) | join(", ")' <<< "$matrix")" >> "$GITHUB_STEP_SUMMARY"
      - name: Discover fuzz targets
        id: fuzz
        if: contains(steps.plan.outputs.jobs, ',fuzz,')
        run: |
          matrix=$(python3 scripts/testing/ci/plan_fuzz.py)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '[]' ]; then
            echo "Fuzz not-run: this revision has no server/fuzz targets." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  pr-lint:
    name: PR body lint (non-blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The changed files decide whether the Design: line is required.
          fetch-depth: 0
          persist-credentials: false
      - name: Lint the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f scripts/testing/pr_lint.py ]; then
            echo "PR body lint not-run: pr_lint.py is absent." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/testing/pr_lint.py --base "$BASE" --head "$HEAD"

  select:
    name: Select checks for the diff (non-blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Show the checks the diff selects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f scripts/testing/matrix.py ]; then
            echo "Check selection not-run: matrix.py is absent." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/testing/matrix.py select --base "$BASE" --head "$HEAD" | tee -a "$GITHUB_STEP_SUMMARY"

  checks:
    name: Check ${{ matrix.id }}
    needs: revision
    # Scheduled work reaches this job through nabedra-nightly's workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' && needs.revision.outputs.checks != '' && needs.revision.outputs.checks != '[]'
    runs-on: ubuntu-24.04
    # The check's timeout_s plus setup, capped at six hours (scripts/testing/ci/plan_checks.py).
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      # Together the nightly check and fuzz matrices use at most eight runners.
      max-parallel: ${{ needs.revision.outputs.fuzz != '' && needs.revision.outputs.fuzz != '[]' && 6 || 8 }}
      matrix:
        include: ${{ fromJSON(needs.revision.outputs.checks) }}
    env:
      ID: ${{ matrix.id }}
      NABEDRA_REQUEST_ID: ${{ inputs.request_id }}
      NABEDRA_TEST_S3_BUCKET: ${{ contains(matrix.tools, 's3') && vars.NABEDRA_TEST_S3_ROLE_ARN != '' && vars.NABEDRA_TEST_S3_BUCKET || '' }}
      NABEDRA_TEST_S3_REGION: ${{ vars.NABEDRA_TEST_S3_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TESTED_SHA }}
          # Replay checks resolve historical commits from the tested revision.
          fetch-depth: 0
          persist-credentials: false
      # The runner scripts need 3.11 or later, and OLAP fixtures invoke python3.11 by name.
      # The job builds nothing itself: a check whose command needs a binary builds it (gh-actions.md).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the Rust nightly
        if: contains(matrix.tools, 'rust-nightly')
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal
          # The runner's preflight and check commands can explicitly say `cargo +nightly`.
          # Route that spelling to the same pinned toolchain as plain `cargo`.
          mkdir -p "$RUNNER_TEMP/pinned-cargo"
          cat > "$RUNNER_TEMP/pinned-cargo/cargo" <<'SH'
          #!/usr/bin/env bash
          if [ "${1:-}" = +nightly ]; then shift; fi
          exec "$NABEDRA_REAL_CARGO" "$@"
          SH
          chmod +x "$RUNNER_TEMP/pinned-cargo/cargo"
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_NIGHTLY"
            echo "NABEDRA_REAL_CARGO=$(command -v cargo)"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pinned-cargo" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: contains(matrix.tools, 'node')
        with:
          node-version: "22"
      - name: Install the Python ORM
        if: contains(matrix.tools, 'python-orm')
        run: python3 -m pip install './orm/python[gateway]'
      - name: Verify Docker
        if: contains(matrix.tools, 'docker') || contains(matrix.tools, 'kind')
        run: docker info
      - name: Install kind
        if: contains(matrix.tools, 'kind')
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o kind
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum --check
          install -Dm755 kind "$RUNNER_TEMP/kind-bin/kind"
          echo "$RUNNER_TEMP/kind-bin" >> "$GITHUB_PATH"
      - name: Install Valkey
        if: contains(matrix.tools, 'valkey')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valkey-server
          sudo systemctl stop valkey-server
      # Kind T checks: the pinned TLC and Apalache image (specs/tools). Its tag hashes the Dockerfile and
      # versions.toml, and the saved image follows the cache rule above (saved from main dispatches).
      - name: Restore the pinned TLC image
        id: tlc-cache
        if: contains(matrix.tools, 'tlc')
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tlc-image.tar
          key: tlc-image-${{ hashFiles('specs/tools/Dockerfile', 'specs/tools/versions.toml') }}
      - name: Load or build the pinned TLC image
        if: contains(matrix.tools, 'tlc')
        env:
          CACHE_HIT: ${{ steps.tlc-cache.outputs.cache-hit }}
        run: |
          if [ -f "$RUNNER_TEMP/tlc-image.tar" ]; then docker load -i "$RUNNER_TEMP/tlc-image.tar"; fi
          tag=$(specs/tools/tlc --tla-ensure)
          echo "TLC image: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CACHE_HIT" != true ] && [ "$SAVE_CACHE" = true ]; then
            docker save -o "$RUNNER_TEMP/tlc-image.tar" "$tag"
          fi
      - name: Save the pinned TLC image
        if: contains(matrix.tools, 'tlc') && steps.tlc-cache.outputs.cache-hit != 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tlc-image.tar
          key: tlc-image-${{ hashFiles('specs/tools/Dockerfile', 'specs/tools/versions.toml') }}
      - name: Assume the test bucket role
        if: contains(matrix.tools, 's3') && env.NABEDRA_TEST_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.NABEDRA_TEST_S3_ROLE_ARN }}
          aws-region: ${{ env.NABEDRA_TEST_S3_REGION }}
          role-session-name: nabedra-${{ github.run_id }}-${{ github.run_attempt }}
      # --strict fails the job on not-run (exit 2), so a green job always means an executed pass.
      - name: Run the check
        run: |
          status=0
          python3 scripts/testing/run_check.py "$ID" --evidence-dir evidence/ --strict || status=$?
          for record in evidence/*/*/*.json; do
            [ -f "$record" ] || continue
            jq -r '"Check `\(.check)`: **\(.result)** (executed \(.assertions.executed), failed \(.assertions.failed))" +
              (if (.assertions.not_run | length) > 0 then ", not run: " + ([.assertions.not_run[] | "\(.id): \(.reason)"] | join("; ")) else "" end)' \
              "$record" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$status" -eq 2 ]; then echo "::error::check $ID did not run (not-run never counts as a pass)"; fi
          exit "$status"
      - name: Upload check evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.id }}
          path: |
            evidence/
            target/testing-logs/
            target/tla/
          retention-days: 14
      - name: Attest the evidence records
        if: ${{ !cancelled() && hashFiles('evidence/**/*.json') != '' }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: evidence/**/*.json

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: revision
    if: needs.revision.outputs.fuzz != '' && needs.revision.outputs.fuzz != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.revision.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Install the nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal
          cargo +"$RUST_NIGHTLY" install --locked --version 0.13.2 cargo-fuzz
      - name: Fuzz the target
        working-directory: server
        env:
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds }}
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_FEATURES: ${{ matrix.features }}
        run: |
          features=()
          if [ -n "$FUZZ_FEATURES" ]; then features=(--no-default-features --features "$FUZZ_FEATURES"); fi
          cargo +"$RUST_NIGHTLY" fuzz run "$FUZZ_TARGET" "${features[@]}" -- "-max_total_time=$FUZZ_SECONDS"
      - name: Upload fuzz crashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: server/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  mutants:
    name: Mutation tests on the diff
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',mutants,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install cargo-mutants
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/sourcefrog/cargo-mutants/releases/download/v27.1.0/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz \
            -o cargo-mutants.tar.gz
          echo "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e  cargo-mutants.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mutants-bin"
          tar -xzf cargo-mutants.tar.gz -C "$RUNNER_TEMP/mutants-bin" cargo-mutants
          echo "$RUNNER_TEMP/mutants-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The baseline runs the default-feature OLAP tests, whose fixtures invoke python3.11 by name.
          python-version: "3.11"
      - name: Test mutants from the merge base
        working-directory: server
        run: |
          git fetch --no-tags origin main
          base=$(git merge-base HEAD FETCH_HEAD)
          git diff --relative "$base" HEAD -- '*.rs' > "$RUNNER_TEMP/mutants.diff"
          RUST_TEST_THREADS=4 cargo mutants --in-diff "$RUNNER_TEMP/mutants.diff"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-diff
          path: server/mutants.out/
          if-no-files-found: ignore
          retention-days: 14

  # One debug OLTP build for every job that tests it: the server, the library test executable and
  # the integration test executables, packed with their paths so they land where they were built.
  build:
    name: OLTP debug build (server and test executables)
    needs: revision
    if: needs.revision.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: oltp-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: oltp-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: Build
        working-directory: server
        env:
          LIB_ONLY: ${{ needs.revision.outputs.build_lib_only }}
        run: |
          set -o pipefail
          targets=(--lib)
          if [ "$LIB_ONLY" != true ]; then targets+=(--tests); fi
          cargo test --locked --no-default-features --features oltp "${targets[@]}" --no-run --timings \
            --message-format=json-render-diagnostics > ../build.json
          # Every OLTP crate's unit tests (phase 8 split), so none silently stops running.
          cargo test --locked -p nabedra-protocol -p nabedra-resources -p nabedra-oltp-types -p nabedra-transport \
            -p nabedra-oltp-storage -p nabedra-oltp-replication --lib --no-run \
            --message-format=json-render-diagnostics >> ../build.json
          cargo build --locked --no-default-features --features oltp --bin nabedra-db
          cd ..
          # kind, name, workspace-relative path of every test executable, then the server.
          jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null)
                 | [(if .target.name == "nabedra_protocol" then "protocol"
                     elif .target.name == "nabedra_resources" then "resources"
                     elif .target.name == "nabedra_oltp_types" then "oltp-types"
                     elif .target.name == "nabedra_transport" then "transport"
                     elif .target.name == "nabedra_oltp_storage" then "storage"
                     elif .target.name == "nabedra_oltp_replication" then "replication"
                     elif (.target.kind | index("lib")) then "lib"
                     else .target.kind[0] end), .target.name, .executable] | @tsv' build.json \
            | sed "s#\t$GITHUB_WORKSPACE/#\t#" > bins.tsv
          printf 'server\tnabedra-db\tserver/target/debug/nabedra-db\n' >> bins.tsv
          for kind in lib protocol resources oltp-types transport storage replication; do
            test "$(awk -F'\t' -v k="$kind" '$1 == k' bins.tsv | wc -l)" = 1 || { echo "::error::expected one $kind test executable"; exit 1; }
          done
          cat bins.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: oltp-build-timings
          path: server/target/cargo-timings/cargo-timing.html
          retention-days: 14
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/target ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --manifest-path server/Cargo.toml -p nabedra-database -p nabedra-kv
          rm -rf ~/cargo-cache/target/cargo-timings && du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Pack
        run: |
          printf 'source=%s\n' "$TESTED_SHA" > bins-source.txt
          tar -I 'zstd -T0 -3' -cf oltp-bins.tar.zst bins.tsv bins-source.txt $(cut -f3 bins.tsv)
          ls -la oltp-bins.tar.zst
          echo "OLTP build artifact: $(du -h oltp-bins.tar.zst | cut -f1), $(wc -l < bins.tsv) executables" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: oltp-bins
          path: oltp-bins.tar.zst
          compression-level: 0
          retention-days: 3
      # LIVE3: the library test executable for the queue inspection fixture, with its checksum and source.
      - name: Package the LIVE3 queue inspection executable
        if: contains(needs.revision.outputs.jobs, ',live3-fixture,')
        run: |
          mkdir live3-test
          cp "$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)" live3-test/oltp-test
          cd live3-test
          sha256sum oltp-test > SHA256SUMS
          printf 'source=%s\n' "$TESTED_SHA" > build.txt
      - if: contains(needs.revision.outputs.jobs, ',live3-fixture,')
        uses: actions/upload-artifact@v4
        with:
          name: live3-oltp-test
          path: live3-test
          retention-days: 7

  kv:
    name: nabedra-kv
    needs: revision
    if: inputs.base || contains(needs.revision.outputs.pr_jobs, ',kv,') || contains(needs.revision.outputs.jobs, ',g7,')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: kv-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: kv-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: Build
        working-directory: server
        run: |
          # -D warnings includes server/clippy.toml's runtime seam bans (phase 7).
          cargo clippy --locked -p nabedra-kv --all-targets -- -D warnings
          cargo test --locked -p nabedra-kv --no-run
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/target ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --manifest-path server/Cargo.toml -p nabedra-database -p nabedra-kv
          rm -rf ~/cargo-cache/target/cargo-timings && du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Test
        working-directory: server
        run: cargo test --locked --no-fail-fast -p nabedra-kv 2>&1 | tee ../kv-test.log
      # GATEfix G7: memory of a freshly opened store (journal zero fill) at the base commit and
      # at the head, each test binary in its own systemd scope on the runner's disk. Opt-in.
      - name: G7 store memory, base vs head
        if: contains(needs.revision.outputs.jobs, ',g7,')
        env:
          G7_BASE: 1ea46224549b565ee3e559b39319970661ea5bc0
        run: |
          git fetch --no-tags --depth=1 origin "$G7_BASE"
          git worktree add --detach ../g7-base "$G7_BASE"
          cp server/kv/tests/g7_memory.rs ../g7-base/server/kv/tests/
          mkdir -p "$RUNNER_TEMP/g7"
          for side in base head; do
            manifest=server/Cargo.toml; [ "$side" = base ] && manifest=../g7-base/server/Cargo.toml
            exe=$(CARGO_TARGET_DIR="$PWD/server/target/g7-$side" cargo test --locked --manifest-path "$manifest" \
              -p nabedra-kv --test g7_memory --no-run --message-format=json \
              | jq -r 'select(.executable != null and .target.name == "g7_memory") | .executable')
            for run in 1 2 3; do
              sudo systemd-run --scope --quiet -p MemoryAccounting=yes --uid="$(id -u)" --gid="$(id -g)" \
                --setenv=G7_DIR="$RUNNER_TEMP/g7" "$exe" --ignored --nocapture --exact g7_measure_store_memory_after_open \
                | sed -n "s/^g7_memory /g7_memory $side run $run /p" | tee -a g7-memory.log
            done
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv-test-log
          path: |
            kv-test.log
            g7-memory.log
          if-no-files-found: ignore
          retention-days: 14

  # Phase 7 runtime seam bans (server/clippy.toml): no direct clock, task or id call outside
  # nabedra-rt, for every product feature set. `-p` with `--no-deps` lints only the named
  # package, so the dev-only crates (nabedra-check, nabedra-sim, nabedra-sim-oltp) are never
  # linted against the bans, and no simulation crate joins a product build's feature set.
  # nabedra-kv is linted with -D warnings in the kv job.
  clippy:
    name: clippy runtime seam bans (phase 7)
    needs: revision
    if: inputs.base || contains(needs.revision.outputs.pr_jobs, ',clippy,') || contains(needs.revision.outputs.jobs, ',clippy,')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: clippy-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: |
            clippy-${{ env.RUST_TOOLCHAIN }}-
            features-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: Clippy with -D clippy::disallowed_methods
        working-directory: server
        run: |
          set -eux
          lint() { cargo clippy --locked --no-deps "$@" -- -D clippy::disallowed_methods; }
          lint -p nabedra-database --all-targets
          lint -p nabedra-database --all-targets --no-default-features --features olap
          lint -p nabedra-database --all-targets --no-default-features --features oltp
          lint -p nabedra-database --all-targets --no-default-features --features oltp-backup-s3
          lint -p nabedra-database --all-targets --no-default-features --features cache
          lint -p nabedra-database --all-targets --no-default-features --features cache,test-hooks
          lint -p nabedra-rt --all-targets
          for crate in protocol resources oltp-types transport oltp-storage; do
            if [ -f "$crate/Cargo.toml" ]; then
              lint -p "nabedra-$crate" --all-targets
            fi
          done
          lint -p nabedra-oltp-replication --all-targets --features s3
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/target ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --manifest-path server/Cargo.toml -p nabedra-database -p nabedra-kv -p nabedra-rt
          rm -rf ~/cargo-cache/target/cargo-timings && du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  features:
    name: feature builds (O02, NS26)
    needs: revision
    if: inputs.base || contains(needs.revision.outputs.pr_jobs, ',features,') || contains(needs.revision.outputs.jobs, ',o02,') || contains(needs.revision.outputs.jobs, ',features,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: features-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: features-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: Check production dependencies and feature flags (O02, NS26)
        run: python scripts/check_engine_features.py --dependencies-only
      - name: Check every engine build
        working-directory: server
        run: |
          set -eux
          cargo check --locked --bin nabedra-db
          cargo check --locked --bin nabedra-db --no-default-features --features oltp
          cargo check --locked --bin nabedra-db --no-default-features --features oltp-backup-s3
          cargo check --locked --bin nabedra-db --no-default-features --features cache
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/target ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --manifest-path server/Cargo.toml -p nabedra-database -p nabedra-kv
          rm -rf ~/cargo-cache/target/cargo-timings && du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: OLTP backup S3 loopback fixture
        working-directory: server
        run: |
          set -o pipefail
          cargo test --locked -p nabedra-oltp-replication --features s3 --lib \
            oltp_backup_repository::tests::o19_s3_conditional_put_reconciles_only_verified_exact_bytes \
            -- --exact | tee "$RUNNER_TEMP/oltp-s3-fixture.log"
          grep -F "test result: ok. 1 passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/oltp-s3-fixture.log"
      # Inputs for the o02 job: the same-commit engine matrix (installed binaries, compile guards) and an
      # OLAP server for O01's ORM parity and O02's cross-engine worker check. Built after the cache is saved.
      - name: Build installed engine variants and check feature guards (O02)
        if: contains(needs.revision.outputs.jobs, ',o02,')
        run: python scripts/check_engine_features.py --acceptance-evidence o02-engine-features.json
      - name: OLAP server for O02
        if: contains(needs.revision.outputs.jobs, ',o02,')
        run: |
          cargo build --locked --manifest-path server/Cargo.toml --no-default-features --features olap --bin nabedra-db
          mkdir -p o02-inputs && cp server/target/debug/nabedra-db o02-inputs/nabedra-db-olap && cp o02-engine-features.json o02-inputs/
          o02-inputs/nabedra-db-olap --version
          printf 'source=%s\n' "$TESTED_SHA" > o02-inputs/source.txt
          tar -cf o02-inputs.tar o02-inputs
      - name: OLAP publication fault regressions (T02)
        if: contains(needs.revision.outputs.jobs, ',o02,')
        run: |
          set -o pipefail
          cargo test --locked --manifest-path server/Cargo.toml --no-default-features --features olap --test commit 2>&1 | tee t02-commit.log
      - if: contains(needs.revision.outputs.jobs, ',o02,')
        uses: actions/upload-artifact@v4
        with:
          name: o02-inputs
          path: o02-inputs.tar
          retention-days: 3
      - if: always() && contains(needs.revision.outputs.jobs, ',o02,')
        uses: actions/upload-artifact@v4
        with:
          name: o02-engine-features
          path: |
            o02-engine-features.json
            t02-commit.log
          if-no-files-found: ignore
          retention-days: 14

  engine-tests:
    name: ${{ matrix.suite }} tests
    needs: revision
    if: needs.revision.outputs.engine_suites != '' && needs.revision.outputs.engine_suites != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.revision.outputs.engine_suites) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN"
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: test-${{ matrix.engine }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml', 'server/check/Cargo.toml') }}
          restore-keys: test-${{ matrix.engine }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: Build tests
        working-directory: server
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          if [ "$ENGINE" = cache ]; then
            cargo test --locked --no-default-features --features cache --lib --no-run
          else
            cargo test --locked --lib --tests --no-run
          fi
      - name: Stage Cargo cache without workspace crates
        if: matrix.shard == 1 && env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/target ~/cargo-cache/target
          packages=(-p nabedra-database -p nabedra-kv)
          if [ -f server/check/Cargo.toml ]; then packages+=(-p nabedra-check); fi
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --manifest-path server/Cargo.toml "${packages[@]}"
          du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: matrix.shard == 1 && env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Read the quarantine
        run: python3 scripts/ci_quarantine.py tests > "$RUNNER_TEMP/quarantined-tests"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.engine == 'olap'
        with:
          # The OLAP HTTP store and shared-worker fixtures invoke python3.11 by name.
          python-version: "3.11"
      - name: Cache library tests
        if: matrix.engine == 'cache'
        working-directory: server
        run: |
          skips=()
          while IFS= read -r test; do skips+=(--skip "$test"); done < "$RUNNER_TEMP/quarantined-tests"
          cargo test --locked --no-default-features --features cache --lib -- --test-threads 4 --exact "${skips[@]}" 2>&1 | tee ../cache-test.log
      - name: OLAP library, integration and streaming tests
        if: matrix.engine == 'olap'
        working-directory: server
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 ../scripts/testing/ci/shard_tests.py --shard "$SHARD" --shards 2 --test-threads 4 \
            --exclude-file "$RUNNER_TEMP/quarantined-tests" -- --locked --lib --tests 2>&1 | tee ../olap-test.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-tests-${{ matrix.engine }}-${{ matrix.shard }}
          path: ${{ matrix.engine }}-test.log
          if-no-files-found: ignore
          retention-days: 14

  check-tests:
    name: Shared Rust crate tests
    needs: revision
    if: inputs.base || contains(needs.revision.outputs.pr_jobs, ',check-tests,') || contains(needs.revision.outputs.jobs, ',check-tests,')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Test
        working-directory: server
        run: |
          if [ ! -f check/Cargo.toml ]; then
            echo "nabedra-check tests not-run: this revision predates the crate." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          packages=(-p nabedra-check)
          if [ -f protocol/Cargo.toml ]; then
            packages+=(-p nabedra-protocol)
          fi
          if [ -f resources/Cargo.toml ]; then
            packages+=(-p nabedra-resources)
          fi
          if [ -f oltp-types/Cargo.toml ]; then
            packages+=(-p nabedra-oltp-types)
          fi
          RUST_TEST_THREADS=4 cargo test --locked "${packages[@]}" --no-fail-fast 2>&1 | tee ../check-test.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nabedra-check-tests
          path: check-test.log
          if-no-files-found: ignore
          retention-days: 14

  oltp:
    name: OLTP library and integration tests
    needs: [revision, build]
    if: inputs.base || contains(needs.revision.outputs.pr_jobs, ',oltp,')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          transport=$(awk -F'\t' '$1 == "transport" {print $3}' bins.tsv)
          [[ -n "$transport" && -x "$GITHUB_WORKSPACE/$transport" ]]
          echo "NABEDRA_TRANSPORT_TEST_EXE=$GITHUB_WORKSPACE/$transport" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_STORAGE_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "storage" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_REPLICATION_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "replication" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Library suite
        id: lib
        working-directory: server
        run: |
          set -o pipefail
          "$NABEDRA_TEST_EXE" --test-threads 4 $QUARANTINE_SKIPS 2>&1 | tee ../oltp-lib.log
      - name: Storage library suite
        if: ${{ !cancelled() }}
        working-directory: server
        run: |
          set -o pipefail
          NABEDRA_TEST_DIRECT_OLTP=on "$NABEDRA_OLTP_STORAGE_TEST_EXE" --test-threads 4 $QUARANTINE_SKIPS 2>&1 | tee ../oltp-storage.log
      - name: Replication library suite
        if: ${{ !cancelled() }}
        working-directory: server
        run: |
          set -o pipefail
          NABEDRA_TEST_DIRECT_OLTP=on "$NABEDRA_OLTP_REPLICATION_TEST_EXE" --test-threads 4 $QUARANTINE_SKIPS 2>&1 | tee ../oltp-replication.log
      - name: Transport library suite
        if: ${{ !cancelled() }}
        working-directory: server
        run: |
          set -o pipefail
          "$NABEDRA_TRANSPORT_TEST_EXE" --test-threads=1 2>&1 | tee ../oltp-transport.log
      - name: Protocol, resources and OLTP types library suites
        if: ${{ !cancelled() }}
        working-directory: server
        run: |
          set -o pipefail
          status=0
          for kind in protocol resources oltp-types; do
            exe=$(awk -F'\t' -v k="$kind" '$1 == k {print $3}' ../bins.tsv)
            [ -n "$exe" ] || { echo "::error::the $kind test executable was not built"; status=1; continue; }
            echo "     Running $kind ($exe)" | tee -a ../oltp-shared-crates.log
            NABEDRA_TEST_DIRECT_OLTP=on "$GITHUB_WORKSPACE/$exe" --test-threads 4 2>&1 | tee -a ../oltp-shared-crates.log || status=1
          done
          exit "$status"
      - name: Integration tests
        if: ${{ !cancelled() }}
        working-directory: server
        run: |
          set -o pipefail
          status=0
          for name in oltp_multiplex oltp_worker_queue worker_pool executor protocol; do
            exe=$(awk -F'\t' -v n="$name" '$1 == "test" && $2 == n {print $3}' ../bins.tsv)
            [ -n "$exe" ] || { echo "::error::integration test $name was not built"; status=1; continue; }
            echo "     Running $name ($exe)" | tee -a ../oltp-integration.log
            "$GITHUB_WORKSPACE/$exe" 2>&1 | tee -a ../oltp-integration.log || status=1
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oltp-test-logs
          path: oltp-*.log
          retention-days: 14

  events:
    name: Events tests
    needs: revision
    if: inputs.base || contains(needs.revision.outputs.pr_jobs, ',events,')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: events-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/events/Cargo.lock', 'server/events/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: events-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/events/target; fi
      - name: Build tests
        working-directory: server/events
        run: cargo test --locked --no-run
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/events/target ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --manifest-path server/events/Cargo.toml -p nabedra-events -p nabedra-kv
          rm -rf ~/cargo-cache/target/cargo-timings && du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Test
        working-directory: server/events
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee ../../events-test.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-test-log
          path: events-test.log
          retention-days: 14

  campaign:
    name: crash campaign (release, long)
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',campaign,')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: campaign-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: campaign-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: Build release tests
        id: build
        working-directory: server
        run: |
          cargo test --locked --release -p nabedra-kv --test campaign --test store_model --test store_crash --test store_gc --no-run
          cargo test --locked --release --no-default-features --features oltp --test kv_crash --no-run
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/target ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --release --manifest-path server/Cargo.toml -p nabedra-database -p nabedra-kv
          rm -rf ~/cargo-cache/target/cargo-timings && du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: kv campaign, long modes (NS01, NS04, NS05, NS07, NS09, NS11, NS17)
        working-directory: server
        run: |
          set -o pipefail
          # NS01 at 1e6 steps (~2.5 h) runs in its own job, campaign-ns01.
          cargo test --locked --no-fail-fast --release -p nabedra-kv --test campaign -- --ignored --nocapture --test-threads 2 \
            --skip ns01_ns10_differential_1e6_with_cuts_and_faults 2>&1 | tee ../campaign.log
      - name: kv store long models (NS01 1e6, NS05 seeds, relocation crash points)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: server
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast --release -p nabedra-kv --test store_model --test store_crash --test store_gc -- --ignored --nocapture 2>&1 | tee ../store-long.log
      - name: SIGKILL and cold start (NS16, D09, R04, O11)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: server
        run: |
          set -o pipefail
          cargo test --locked --release --no-default-features --features oltp --test kv_crash -- --nocapture 2>&1 | tee ../kv-crash.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-logs
          path: |
            campaign.log
            store-long.log
            kv-crash.log
          retention-days: 14

  campaign-ns01:
    name: crash campaign NS01 1e6 (release, long)
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',campaign,')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: campaign-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: campaign-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - name: NS01 differential, 1e6 steps with cuts and faults
        working-directory: server
        run: |
          set -o pipefail
          cargo test --locked --release -p nabedra-kv --test campaign -- --ignored --nocapture --exact \
            ns01_ns10_differential_1e6_with_cuts_and_faults 2>&1 | tee ../campaign-ns01.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-ns01-log
          path: campaign-ns01.log
          retention-days: 14

  docker-oltp:
    name: OLTP image
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',docker,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: docker/setup-buildx-action@v3
      - name: Start clock
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            NABEDRA_ENGINE=oltp
            BUILD_JOBS=4
          tags: nabedra-oltp:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=oltp-image
          cache-to: ${{ env.SAVE_CACHE == 'true' && 'type=gha,mode=max,scope=oltp-image' || '' }}
      - name: Build time and size
        run: |
          echo "build_seconds=$(( $(date +%s) - BUILD_START ))"
          docker image ls nabedra-oltp:ci
      - name: Runtime libraries (only libc, libm, libgcc_s)
        run: |
          libraries=$(docker run --rm --entrypoint ldd nabedra-oltp:ci /usr/local/bin/nabedra-db)
          echo "$libraries"
          unexpected=$(echo "$libraries" | grep -vE '^\s*(linux-vdso\.so\.1|libc\.so\.6|libm\.so\.6|libgcc_s\.so\.1|/lib64/ld-linux-x86-64\.so\.2)[ (]' || true)
          if [ -n "$unexpected" ]; then echo "unexpected runtime libraries: $unexpected" >&2; exit 1; fi
      - name: Export Cargo timings
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            NABEDRA_ENGINE=oltp
            BUILD_JOBS=4
          target: timings
          outputs: type=local,dest=image-timings
          provenance: false
          cache-from: type=gha,scope=oltp-image
      - uses: actions/upload-artifact@v4
        with:
          name: oltp-image-timings
          path: image-timings
          retention-days: 14

  docker-events:
    name: Events image and acceptance
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',docker,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: docker/setup-buildx-action@v3
      - name: Start clock
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/events/deploy/Dockerfile
          build-args: BUILD_JOBS=4
          tags: nabedra-events:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=events-image
          cache-to: ${{ env.SAVE_CACHE == 'true' && 'type=gha,mode=max,scope=events-image' || '' }}
      - name: Build time, size and runtime libraries
        run: |
          echo "build_seconds=$(( $(date +%s) - BUILD_START ))"
          docker image ls nabedra-events:ci
          docker run --rm --entrypoint ldd nabedra-events:ci /usr/local/bin/nabedra-events
      - name: Acceptance (NS27)
        run: |
          docker pull python:3.11-slim-bookworm
          mkdir -p events-acceptance
          python server/events/tests/acceptance.py --image nabedra-events:ci --cpus 2 --memory-mib 1536 \
            --fault-image python:3.11-slim-bookworm --output events-acceptance/result.json --logs events-acceptance/logs
      - name: Events kind suite (non-blocking until verified)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && hashFiles('scripts/testing/kind/suite_events.py') != '' }}
        continue-on-error: true
        timeout-minutes: 45
        run: |
          mkdir -p events-acceptance
          python -m scripts.testing.kind.install --output "$RUNNER_TEMP/bin/kind"
          NABEDRA_KIND="$RUNNER_TEMP/bin/kind" python -m scripts.testing.kind.suite_events \
            --image nabedra-events:ci --history events-acceptance/kind-events.jsonl
      - name: Acceptance summary
        if: always()
        run: |
          python -c 'import json, sys; cases = json.load(open(sys.argv[1]))["cases"]; passed = sum(c["pass"] for c in cases.values()); print(f"events acceptance: {passed}/{len(cases)} cases passed"); [print(name, case) for name, case in cases.items()]' events-acceptance/result.json || true
      - name: Export Cargo timings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/events/deploy/Dockerfile
          build-args: BUILD_JOBS=4
          target: timings
          outputs: type=local,dest=image-timings
          provenance: false
          cache-from: type=gha,scope=events-image
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-acceptance
          path: |
            events-acceptance
            image-timings
          retention-days: 14

  acceptance:
    name: Linux OLTP acceptance
    needs: [revision, build]
    if: contains(needs.revision.outputs.jobs, ',acceptance,')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          transport=$(awk -F'\t' '$1 == "transport" {print $3}' bins.tsv)
          [[ -n "$transport" && -x "$GITHUB_WORKSPACE/$transport" ]]
          echo "NABEDRA_TRANSPORT_TEST_EXE=$GITHUB_WORKSPACE/$transport" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_STORAGE_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "storage" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_REPLICATION_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "replication" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_RESOURCES_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "resources" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Acceptance runner unit tests
        run: python -m unittest discover -s scripts -p test_acceptance_oltp.py
      - name: Acceptance (no AWS, no comparative benchmarks)
        if: ${{ !cancelled() }}
        run: |
          # O01 and O02 run in the o02 job and the growth category (O16, O21, O26, O28) in the growth jobs.
          # Exit 1 = a scenario failed; exit 2 = some scenarios did not run (listed in results.json, never counted as passed).
          keep=${KEEP_SCENARIOS//--scenario O01/}
          rc=0; python scripts/acceptance_oltp.py --test-binary "$NABEDRA_TEST_EXE" --server-binary "$NABEDRA_BIN" \
            --category compatibility --category queries --category transactions \
            --category recovery ${keep//--scenario O02/} --output artifacts/oltp-acceptance || rc=$?
          python scripts/ci_acceptance_summary.py artifacts/oltp-acceptance/results.json >> "$GITHUB_STEP_SUMMARY" || true
          [ "$rc" = 0 ] || [ "$rc" = 2 ]
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oltp-acceptance
          path: artifacts/oltp-acceptance
          retention-days: 14

  # T9: direct point path scenarios D01-D12 on real processes, and the existing suites, one matrix leg
  # per direct_oltp mode. D01-D12 and the Python unit tests run in the on leg, the library suite in the
  # off leg (the oltp job runs it with direct_oltp on).
  direct:
    name: direct point path and suites, direct_oltp ${{ matrix.mode }} (T9)
    needs: [revision, build]
    if: contains(needs.revision.outputs.jobs, ',direct,')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.revision.outputs.modes) }}
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          transport=$(awk -F'\t' '$1 == "transport" {print $3}' bins.tsv)
          [[ -n "$transport" && -x "$GITHUB_WORKSPACE/$transport" ]]
          echo "NABEDRA_TRANSPORT_TEST_EXE=$GITHUB_WORKSPACE/$transport" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_STORAGE_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "storage" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_REPLICATION_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "replication" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_RESOURCES_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "resources" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Build the TypeScript ORM
        id: build
        run: |
          (cd orm/typescript && npm ci --no-audit --no-fund && npm run build)
          python -m pip install --quiet "httpx>=0.27,<1"
          mkdir -p artifacts
      - name: Acceptance runner unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'on' }}
        run: python -m unittest discover -s scripts -p test_acceptance_oltp.py
      - name: D01-D12 and U01 on real processes
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'on' }}
        run: |
          set -o pipefail
          python server/tests/oltp_direct_acceptance.py --binary "$NABEDRA_BIN" --test-executable "$NABEDRA_TEST_EXE" \
            --output artifacts/direct 2>&1 | tee artifacts/direct.log
      - name: ORM suites, direct_oltp ${{ matrix.mode }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          status=0
          if [ "$MODE" = on ]; then
            (cd orm/python && PYTHONPATH=src python -m unittest discover -s tests) 2>&1 | tee artifacts/orm-python-unit.log || status=1
          fi
          binary="$NABEDRA_BIN"; [ "$MODE" = off ] && binary="$GITHUB_WORKSPACE/server/tests/direct_off_server.sh"
          (cd orm/typescript && NABEDRA_TEST_SERVER_BINARY="$binary" npm test) 2>&1 | tee "artifacts/orm-typescript-$MODE.log" || status=1
          python server/tests/oltp_process.py --binary "$binary" 2>&1 | tee "artifacts/orm-python-process-$MODE.log" || status=1
          exit $status
      - name: OLTP library suite, direct_oltp off
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'off' }}
        working-directory: server
        run: |
          set -o pipefail
          NABEDRA_TEST_DIRECT_OLTP=off "$NABEDRA_TEST_EXE" --test-threads 4 $QUARANTINE_SKIPS 2>&1 | tee ../artifacts/oltp-lib-direct-off.log
      - name: Storage library suite, direct_oltp off
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'off' }}
        working-directory: server
        run: |
          set -o pipefail
          NABEDRA_TEST_DIRECT_OLTP=off "$NABEDRA_OLTP_STORAGE_TEST_EXE" --test-threads 4 $QUARANTINE_SKIPS 2>&1 | tee ../artifacts/oltp-storage-direct-off.log
      - name: Replication library suite, direct_oltp off
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'off' }}
        working-directory: server
        run: |
          set -o pipefail
          NABEDRA_TEST_DIRECT_OLTP=off "$NABEDRA_OLTP_REPLICATION_TEST_EXE" --test-threads 4 $QUARANTINE_SKIPS 2>&1 | tee ../artifacts/oltp-replication-direct-off.log
      - name: Transport, protocol, resources and OLTP types library suites, direct_oltp off
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'off' }}
        working-directory: server
        run: |
          set -o pipefail
          status=0
          for kind in transport protocol resources oltp-types; do
            exe=$(awk -F'\t' -v k="$kind" '$1 == k {print $3}' ../bins.tsv)
            [ -n "$exe" ] || { echo "::error::the $kind test executable was not built"; status=1; continue; }
            threads=4; [ "$kind" = transport ] && threads=1
            echo "     Running $kind ($exe)" | tee -a ../artifacts/oltp-shared-crates-direct-off.log
            NABEDRA_TEST_DIRECT_OLTP=off "$GITHUB_WORKSPACE/$exe" --test-threads "$threads" 2>&1 \
              | tee -a ../artifacts/oltp-shared-crates-direct-off.log || status=1
          done
          exit "$status"
      - name: OLTP integration tests, direct_oltp off
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'off' }}
        working-directory: server
        env:
          NABEDRA_TEST_DIRECT_OLTP: "off"
        run: |
          set -o pipefail
          status=0
          for name in oltp_multiplex oltp_worker_queue worker_pool executor protocol; do
            exe=$(awk -F'\t' -v n="$name" '$1 == "test" && $2 == n {print $3}' ../bins.tsv)
            [ -n "$exe" ] || { echo "::error::integration test $name was not built"; status=1; continue; }
            echo "     Running $name ($exe)" | tee -a ../artifacts/oltp-integration-direct-off.log
            "$GITHUB_WORKSPACE/$exe" 2>&1 | tee -a ../artifacts/oltp-integration-direct-off.log || status=1
          done
          exit "$status"
      - name: OLTP acceptance, direct_oltp ${{ matrix.mode }} (no AWS, no benchmarks)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # O01 and O02 run in the o02 job and the growth category (O16, O21, O26, O28) in the growth jobs.
          keep=${KEEP_SCENARIOS//--scenario O01/}
          rc=0
          NABEDRA_TEST_DIRECT_OLTP=$MODE python scripts/acceptance_oltp.py --test-binary "$NABEDRA_TEST_EXE" \
            --server-binary "$NABEDRA_BIN" --category compatibility --category queries --category transactions \
            --category recovery ${keep//--scenario O02/} --output "artifacts/acceptance-$MODE" > "artifacts/acceptance-$MODE.log" 2>&1 || rc=$?
          tail -40 "artifacts/acceptance-$MODE.log"
          python scripts/ci_acceptance_summary.py "artifacts/acceptance-$MODE/results.json" >> "$GITHUB_STEP_SUMMARY" || true
          # Exit 1 = a scenario failed; exit 2 = some scenarios did not run (listed in results.json, not counted as passed).
          status=0; [ "$rc" = 0 ] || [ "$rc" = 2 ] || status=1
          # The RF3 transaction cases must execute every clause in each mode (quarantined ones excepted).
          for required in O07 O10; do
            [[ " $KEEP_SCENARIOS " == *" $required "* ]] || continue
            jq -e --arg s "$required" '[.results[] | select(.scenario == $s and .status == "passed")] | length == 1' \
              "artifacts/acceptance-$MODE/results.json" > /dev/null || { echo "::error::$required must pass with direct_oltp=$MODE"; status=1; }
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-evidence-${{ matrix.mode }}
          path: artifacts
          retention-days: 14

  # Engine parity scenarios with the inputs they need: O01 (unchanged ORMs against an OLAP and an OLTP
  # server) and O02 (engine identity with the same-commit engine matrix), using the OLAP server and the
  # matrix from `features` and the shared OLTP build. Every selected mode, in one job.
  o02:
    name: O01 and O02 engine parity, direct_oltp ${{ inputs.modes || 'on,off' }}
    needs: [revision, build, features]
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(needs.revision.outputs.jobs, ',o02,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - uses: actions/download-artifact@v4
        with:
          name: o02-inputs
      - name: Unpack the shared build and the O02 inputs
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          tar -xf o02-inputs.tar && rm o02-inputs.tar
          grep -qx "source=$TESTED_SHA" o02-inputs/source.txt || { echo "::error::the O02 inputs are not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          storage=$(awk -F'\t' '$1 == "storage" {print $3}' bins.tsv)
          [[ -n "$storage" && -x "$GITHUB_WORKSPACE/$storage" ]]
          "$GITHUB_WORKSPACE/$storage" --list |
            grep -Fx "oltp::pool::tests::kv::ns22_rocksdb_pools_and_legacy_stores_are_refused_untouched: test"
          echo "NABEDRA_OLTP_STORAGE_TEST_EXE=$GITHUB_WORKSPACE/$storage" >> "$GITHUB_ENV"
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_O02_ENGINE_FEATURES=$GITHUB_WORKSPACE/o02-inputs/o02-engine-features.json" >> "$GITHUB_ENV"
      - name: Build the unmodified ORMs
        run: |
          (cd orm/typescript && npm ci --no-audit --no-fund && npm run build)
          python -m pip install --quiet "httpx>=0.27,<1"
      - name: O01 and O02 in every mode
        env:
          MODES: ${{ join(fromJSON(needs.revision.outputs.modes), ' ') }}
        run: |
          quarantined=" $(python3 scripts/ci_quarantine.py scenarios | tr '\n' ' ') "
          status=0
          for scenario in O01 O02; do
            if [[ "$quarantined" == *" $scenario "* ]]; then
              echo "$scenario is quarantined: it runs in the quarantine job." >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            for mode in $MODES; do
              rc=0
              NABEDRA_TEST_DIRECT_OLTP=$mode python scripts/acceptance_oltp.py --test-binary "$NABEDRA_TEST_EXE" \
                --server-binary "$NABEDRA_BIN" --olap-binary o02-inputs/nabedra-db-olap --scenario "$scenario" \
                --output "artifacts/$scenario-$mode" || rc=$?
              python scripts/ci_acceptance_summary.py "artifacts/$scenario-$mode/results.json" >> "$GITHUB_STEP_SUMMARY" || true
              # Exit 2 = not every clause executed: shown as not-run, never as passed.
              if [ "$rc" = 2 ]; then echo "::warning::$scenario direct_oltp=$mode: not-run (see results.json)"; elif [ "$rc" != 0 ]; then status=1; fi
            done
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o02-evidence
          path: artifacts
          if-no-files-found: ignore
          retention-days: 14

  # The one opt-level-1 build of the OLTP server and library test executable that O21 and O28 need
  # (debug builds time out). Its own target directory, so its paths never collide with the shared build.
  growth-build:
    name: OLTP opt-level-1 build (O21, O28)
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',growth,')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Restore Cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: oltp-opt1-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: oltp-opt1-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target-opt1; fi
      - name: Build
        working-directory: server
        run: |
          set -o pipefail
          cargo test --locked --no-default-features --features oltp --lib --no-run --target-dir target-opt1 \
            --message-format=json-render-diagnostics > ../build-opt1.json
          cargo build --locked --no-default-features --features oltp --bin nabedra-db --target-dir target-opt1
          cd ..
          jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null and (.target.kind | index("lib")))
                 | ["lib", .target.name, .executable] | @tsv' build-opt1.json | sed "s#\t$GITHUB_WORKSPACE/#\t#" > bins.tsv
          printf 'server\tnabedra-db\tserver/target-opt1/debug/nabedra-db\n' >> bins.tsv
          test "$(awk -F'\t' '$1 == "lib"' bins.tsv | wc -l)" = 1
          cat bins.tsv
      - name: Stage Cargo cache without workspace crates
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/cargo-cache && mkdir -p ~/cargo-cache && cp -al server/target-opt1 ~/cargo-cache/target
          CARGO_TARGET_DIR=~/cargo-cache/target cargo clean --offline --locked --manifest-path server/Cargo.toml -p nabedra-database -p nabedra-kv
          du -sh ~/cargo-cache/target
      - name: Save Cargo cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Pack
        run: |
          printf 'source=%s\n' "$TESTED_SHA" > bins-source.txt
          tar -I 'zstd -T0 -3' -cf oltp-bins-opt1.tar.zst bins.tsv bins-source.txt $(cut -f3 bins.tsv)
          echo "OLTP opt-level-1 build artifact: $(du -h oltp-bins-opt1.tar.zst | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: oltp-bins-opt1
          path: oltp-bins-opt1.tar.zst
          compression-level: 0
          retention-days: 3

  # Growth acceptance (O16, O21, O26, O28): O16 and O26 on the shared build, every mode in one job;
  # O21 and O28 on the opt-level-1 build, one job per mode. The plan comes from `revision`.
  growth:
    name: ${{ matrix.scenario }} growth acceptance, direct_oltp ${{ matrix.modes }}
    needs: [revision, build, growth-build]
    if: needs.revision.outputs.has_growth == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.revision.outputs.growth) }}
    env:
      SCENARIO: ${{ matrix.scenario }}
      MODES: ${{ matrix.modes }}
      LIMIT: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.opt1 && 'oltp-bins-opt1' || 'oltp-bins' }}
      - name: Unpack the ${{ matrix.opt1 && 'opt-level-1' || 'shared' }} build
        run: |
          tar -I zstd -xf oltp-bins*.tar.zst && rm oltp-bins*.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the build is not $TESTED_SHA"; exit 1; }
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "server" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.scenario }}
        run: |
          status=0
          for mode in $MODES; do
            echo "direct_oltp=$mode"
            rc=0
            NABEDRA_TEST_DIRECT_OLTP=$mode python scripts/acceptance_oltp.py --test-binary "$NABEDRA_TEST_EXE" \
              --server-binary "$NABEDRA_BIN" --scenario "$SCENARIO" --timeout "$LIMIT" \
              --output "artifacts/$SCENARIO-$mode" || rc=$?
            python scripts/ci_acceptance_summary.py "artifacts/$SCENARIO-$mode/results.json" >> "$GITHUB_STEP_SUMMARY" || true
            # Exit 2 = not every clause executed: shown as not-run, never as passed.
            if [ "$rc" = 2 ]; then echo "::warning::$SCENARIO direct_oltp=$mode: not-run (see results.json)"; elif [ "$rc" != 0 ]; then status=1; fi
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-${{ matrix.scenario }}-${{ matrix.label }}
          path: artifacts
          if-no-files-found: ignore
          retention-days: 14

  # REP1-REP5 worker recovery process suites on the shared build, one invocation each: SCALE1's scale,
  # direct-mode rollback, retained restart, system replacement and REP5's abandon, wipe and data-trust
  # replacement variants. replacement-mixed needs the pre-execution binary and runs in rep4-mixed.
  rep1:
    name: REP1 worker recovery, rollback, restart and replacement
    needs: [revision, build]
    if: contains(needs.revision.outputs.jobs, ',rep1,')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
      - name: Process suites
        run: |
          set -o pipefail
          status=0
          for suite in scale rollback restart replacement-check replacement-abandon replacement-wipe replacement-data-trust; do
            echo "::group::$suite"
            python3 server/tests/oltp_recovery_operations.py --binary "$NABEDRA_BIN" \
              --test-executable "$NABEDRA_TEST_EXE" --suite "$suite" 2>&1 | tee "oltp-rep1-$suite.log" || { status=1; echo "::error::REP1 suite $suite failed"; }
            echo "::endgroup::"
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oltp-rep1-process-logs
          path: oltp-rep1-*.log
          if-no-files-found: ignore
          retention-days: 14

  # REP4: mixed-version enrollment. Builds the pre-execution worker (3b77bce) in its own target,
  # enrolls it next to this commit's server from the shared build, and runs clippy on both sides.
  rep4-mixed:
    name: REP4 mixed-version enrollment (pre-execution worker)
    needs: [revision, build]
    if: contains(needs.revision.outputs.jobs, ',rep4-mixed,')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEGACY_BASE: 3b77bced7c8d6aa5decb25e58e5f428b7dc18ce2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      # Restore only: the OLTP dependency cache, for this commit's clippy.
      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/cargo-cache
          key: oltp-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/kv/Cargo.toml') }}
          restore-keys: oltp-${{ env.RUST_TOOLCHAIN }}-
      - name: Use restored target
        run: if [ -d ~/cargo-cache/target ]; then mv ~/cargo-cache/target server/target; fi
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
      - name: Build the pre-execution worker
        run: |
          git fetch --no-tags --depth=1 origin "$LEGACY_BASE"
          mkdir -p "$RUNNER_TEMP/rep4/source"
          git archive "$LEGACY_BASE" | tar -x -C "$RUNNER_TEMP/rep4/source"
          CARGO_TARGET_DIR="$RUNNER_TEMP/rep4/target" cargo build --manifest-path "$RUNNER_TEMP/rep4/source/server/Cargo.toml" \
            --locked --no-default-features --features oltp --bin nabedra-db
      - name: Mixed-version enrollment and clippy on both sides
        run: |
          set -o pipefail
          status=0
          cp "$NABEDRA_BIN" "$RUNNER_TEMP/rep4/current-nabedra-db"
          python3 server/tests/oltp_recovery_operations.py --suite replacement-mixed \
            --binary "$RUNNER_TEMP/rep4/current-nabedra-db" --test-executable "$NABEDRA_TEST_EXE" \
            --legacy-binary "$RUNNER_TEMP/rep4/target/debug/nabedra-db" 2>&1 | tee oltp-rep1-replacement-mixed.log || status=1
          CARGO_TARGET_DIR="$RUNNER_TEMP/rep4/target" cargo clippy --manifest-path "$RUNNER_TEMP/rep4/source/server/Cargo.toml" \
            --locked --no-default-features --features oltp --lib 2>&1 | tee oltp-rep1-replacement-baseline-clippy.log || status=1
          cargo clippy --manifest-path server/Cargo.toml --locked --no-default-features --features oltp --lib \
            2>&1 | tee oltp-rep1-replacement-clippy.log || status=1
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oltp-rep4-mixed-logs
          path: oltp-rep1-*.log
          if-no-files-found: ignore
          retention-days: 14

  # AZ1/AZ2: RF3 packet-drop (black-hole) failover fixture (O06/O18) on the shared build.
  blackhole:
    name: RF3 packet-drop failover (AZ1/AZ2, O06/O18)
    needs: [revision, build]
    if: contains(needs.revision.outputs.jobs, ',blackhole,')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
      - name: Packet-drop failover
        env:
          PYTHONPATH: orm/python/src
          PYTHONDONTWRITEBYTECODE: "1"
          NABEDRA_OLTP_RPC_TRACE: "1"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/az1-cluster" az1-evidence
          status=0
          python3 -u server/tests/oltp_blackhole.py --binary "$NABEDRA_BIN" --test-executable "$NABEDRA_TEST_EXE" \
            --output "$RUNNER_TEMP/az1-cluster" 2>&1 | tee az1-evidence/az1.log || status=1
          find "$RUNNER_TEMP/az1-cluster" -maxdepth 1 -name '*.log' -exec cp -t az1-evidence {} +
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: az1-failover
          path: az1-evidence
          if-no-files-found: ignore
          retention-days: 14

  # MIG1/MIG2: export a RocksDB-era RF3 cluster (b29a178, built in its own checkout) with the
  # unmodified ORMs and restore it on this commit's native release server.
  migrate:
    name: RocksDB-era OLTP archive upgrade (MIG2)
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',migrate,')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/checkout@v4
        with:
          ref: b29a17847d6861040234d767396e6cceb10187f4
          path: legacy-release
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Legacy export retry regression
        run: python server/tests/test_oltp_upgrade_export.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the native OLTP binary
        run: cargo build --manifest-path server/Cargo.toml --locked --release --no-default-features --features oltp --bin nabedra-db
      - name: Build the pinned old OLTP binary in its own checkout
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev cmake
          cd legacy-release
          git rev-parse HEAD
          cargo build --manifest-path server/Cargo.toml --locked --release --no-default-features --features oltp --bin nabedra-db
      - name: Build the unmodified ORMs
        run: |
          python -m pip install --quiet 'httpx>=0.27,<1'
          cd orm/typescript
          npm ci --no-audit --no-fund
          npm run build
      - name: Export and restore the RF3 cluster
        timeout-minutes: 80
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          mkdir -p artifacts/migration
          python server/tests/oltp_upgrade_acceptance.py \
            --old-binary legacy-release/server/target/release/nabedra-db \
            --new-binary server/target/release/nabedra-db --output artifacts/migration \
            2>&1 | tee artifacts/migration/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mig2-evidence
          path: artifacts/migration
          retention-days: 14

  # Selected OLTP acceptance scenarios on the shared build, one job per scenario and mode.
  scenarios:
    name: acceptance ${{ matrix.scenario }}, direct_oltp ${{ matrix.mode }}
    needs: [revision, build]
    if: needs.revision.outputs.has_scenarios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.revision.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          transport=$(awk -F'\t' '$1 == "transport" {print $3}' bins.tsv)
          [[ -n "$transport" && -x "$GITHUB_WORKSPACE/$transport" ]]
          echo "NABEDRA_TRANSPORT_TEST_EXE=$GITHUB_WORKSPACE/$transport" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_STORAGE_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "storage" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_REPLICATION_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "replication" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_RESOURCES_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "resources" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.scenario }}
        env:
          SCENARIO: ${{ matrix.scenario }}
          MODE: ${{ matrix.mode }}
        run: |
          rc=0
          NABEDRA_TEST_DIRECT_OLTP=$MODE python scripts/acceptance_oltp.py --test-binary "$NABEDRA_TEST_EXE" \
            --server-binary "$NABEDRA_BIN" --scenario "$SCENARIO" --output "artifacts/$SCENARIO-$MODE" || rc=$?
          python scripts/ci_acceptance_summary.py "artifacts/$SCENARIO-$MODE/results.json" >> "$GITHUB_STEP_SUMMARY" || true
          # Exit 2 = the scenario did not execute every assertion: shown as not-run, never as passed.
          if [ "$rc" = 2 ]; then echo "::warning::$SCENARIO direct_oltp=$MODE: not-run (see results.json)"; exit 0; fi
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-${{ matrix.scenario }}-${{ matrix.mode }}
          path: artifacts
          retention-days: 14

  # Exact library tests repeated on the shared build (flake probes, focused reruns).
  tests:
    name: library tests x${{ inputs.repeat }}, direct_oltp ${{ matrix.mode }}
    needs: [revision, build]
    if: github.event_name == 'workflow_dispatch' && inputs.tests != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.revision.outputs.modes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          transport=$(awk -F'\t' '$1 == "transport" {print $3}' bins.tsv)
          [[ -n "$transport" && -x "$GITHUB_WORKSPACE/$transport" ]]
          echo "NABEDRA_TRANSPORT_TEST_EXE=$GITHUB_WORKSPACE/$transport" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_STORAGE_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "storage" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_REPLICATION_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "replication" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Repeat
        working-directory: server
        env:
          TESTS: ${{ inputs.tests }}
          REPEAT: ${{ inputs.repeat }}
          MODE: ${{ matrix.mode }}
        run: |
          read -r -a names <<< "$TESTS"
          # Each name runs on the OLTP test executable (server library or crate) that lists it.
          executables=()
          for kind in lib transport storage replication resources protocol oltp-types; do
            executables+=(--executable "$GITHUB_WORKSPACE/$(awk -F'\t' -v k="$kind" '$1 == k {print $3}' ../bins.tsv)")
          done
          python3 ../scripts/ci_repeat_tests.py --mode "$MODE" --repeat "$REPEAT" \
            --log ../tests.log "${executables[@]}" "${names[@]}" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.mode }}
          path: tests.log
          retention-days: 14

  # Quarantined tests and scenarios (.github/quarantine.tsv), run repeatedly so their owners see
  # current pass counts. Never fails the run: results go to the summary as warnings.
  quarantine:
    name: quarantined tests and scenarios (non-blocking)
    needs: [revision, build]
    if: contains(needs.revision.outputs.jobs, ',quarantine,')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: oltp-bins
      - name: Unpack the shared build
        run: |
          tar -I zstd -xf oltp-bins.tar.zst && rm oltp-bins.tar.zst
          grep -qx "source=$TESTED_SHA" bins-source.txt || { echo "::error::the shared build is not $TESTED_SHA"; exit 1; }
          lib=$(awk -F'\t' '$1 == "lib" {print $3}' bins.tsv)
          echo "NABEDRA_TEST_EXE=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_STORAGE_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "storage" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_OLTP_REPLICATION_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "replication" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_RESOURCES_TEST_EXE=$GITHUB_WORKSPACE/$(awk -F'\t' '$1 == "resources" {print $3}' bins.tsv)" >> "$GITHUB_ENV"
          echo "NABEDRA_BIN=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "NABEDRA_DIRECT_OFF_BINARY=$GITHUB_WORKSPACE/server/target/debug/nabedra-db" >> "$GITHUB_ENV"
          echo "QUARANTINE_SKIPS=$(python3 scripts/ci_quarantine.py skips)" >> "$GITHUB_ENV"
          echo "KEEP_SCENARIOS=$(python3 scripts/ci_quarantine.py scenario-args)" >> "$GITHUB_ENV"
      - name: Quarantined tests, 5 runs each
        working-directory: server
        run: |
          tests=$(python3 ../scripts/ci_quarantine.py tests)
          if [ -z "$tests" ]; then echo "No quarantined tests." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          executables=()
          for kind in lib transport storage replication resources protocol oltp-types; do
            executables+=(--executable "$GITHUB_WORKSPACE/$(awk -F'\t' -v k="$kind" '$1 == k {print $3}' ../bins.tsv)")
          done
          python3 ../scripts/ci_repeat_tests.py --mode on --repeat 5 --log ../quarantine-tests.log --report-only \
            "${executables[@]}" $tests >> "$GITHUB_STEP_SUMMARY"
      - name: Quarantined scenarios, both modes
        if: ${{ !cancelled() }}
        run: |
          for scenario in $(python3 scripts/ci_quarantine.py scenarios); do
            for mode in on off; do
              NABEDRA_TEST_DIRECT_OLTP=$mode python scripts/acceptance_oltp.py --test-binary "$NABEDRA_TEST_EXE" \
                --server-binary "$NABEDRA_BIN" --scenario "$scenario" --output "artifacts/$scenario-$mode" || true
              python scripts/ci_acceptance_summary.py "artifacts/$scenario-$mode/results.json" >> "$GITHUB_STEP_SUMMARY" || true
            done
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-evidence
          path: |
            quarantine-tests.log
            artifacts
          if-no-files-found: ignore
          retention-days: 14

  # FLAKE1 (G7 follow-up): worker anon memory under point-update load on a real RF3 cluster
  # (server/tests/oltp_worker_memory.py), for THP always/madvise x MALLOC_ARENA_MAX unset/2, plus
  # a heaptrack profile of every worker. Opt-in: dispatch with jobs=memory.
  memory:
    name: worker memory under load, THP and malloc arenas, heaptrack (FLAKE1)
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',memory,')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build release nabedra-db (oltp, line tables for heaptrack)
        working-directory: server
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build --locked --release --no-default-features --features oltp --bin nabedra-db
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq heaptrack gdb > /dev/null
          sudo sysctl -w kernel.yama.ptrace_scope=0
          python -m pip install --quiet "httpx>=0.27,<1"
          nproc; free -m; ldd --version | sed -n 1p
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag
      - name: Memory matrix (THP x MALLOC_ARENA_MAX)
        run: |
          set -o pipefail
          mkdir -p artifacts
          bin="$PWD/server/target/release/nabedra-db"
          status=0
          for thp in always madvise; do
            echo "$thp" | sudo tee /sys/kernel/mm/transparent_hugepage/enabled > /dev/null
            for arena in default 2; do
              label="thp-$thp-arena-$arena"
              if [ "$arena" = default ]; then unset MALLOC_ARENA_MAX; else export MALLOC_ARENA_MAX=$arena; fi
              python server/tests/oltp_worker_memory.py --binary "$bin" --output "artifacts/$label" --label "$label" \
                2>&1 | tee "artifacts/$label.log" | grep -v '^{' || status=1
              rm -rf "artifacts/$label/cluster"
            done
          done
          unset MALLOC_ARENA_MAX
          exit $status
      - name: Heaptrack profile (THP always, default arenas)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          echo always | sudo tee /sys/kernel/mm/transparent_hugepage/enabled > /dev/null
          bin="$PWD/server/target/release/nabedra-db"
          python server/tests/oltp_worker_memory.py --binary "$bin" --output artifacts/heaptrack --label heaptrack \
            --heaptrack 2>&1 | tee artifacts/heaptrack.log | grep -v '^{'
          grep -h '"leader"' artifacts/heaptrack/memory.json || true
          for profile in artifacts/heaptrack/heaptrack.w*; do
            name=$(basename "$profile" | sed -E 's/\.(gz|zst)$//')
            heaptrack_print -f "$profile" --print-peaks 1 --print-allocators 1 --print-temporary 1 --print-leaks 0 \
              -n 25 > "artifacts/heaptrack/$name.txt" 2>&1 || true
            echo "===== $profile"; { awk '/^PEAK MEMORY CONSUMERS/{p=1} p' "artifacts/heaptrack/$name.txt" | grep -E 'peak memory consumed over|/server/(src|kv)/' | head -120; } || true
            tail -6 "artifacts/heaptrack/$name.txt" || true
          done
          rm -rf artifacts/heaptrack/cluster
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-evidence
          path: artifacts
          retention-days: 14

  # NS11/T10: the release OLTP server for the comparative benchmark, built in the same
  # Debian bookworm base as the Dockerfile's build stage (glibc of the benchmark images),
  # plus the NS18 engine microbench in release. Opt-in: dispatch with
  # jobs=bench. The comparative benchmark itself runs on the controlled host.
  bench:
    name: release benchmark binary and NS18 microbench (NS11)
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',bench,')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: rust:1.94.1-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Build release nabedra-db (oltp)
        working-directory: server
        run: |
          start=$(date +%s)
          cargo build --locked --release --no-default-features --features oltp --bin nabedra-db
          echo "build_seconds=$(( $(date +%s) - start ))" | tee ../bench-build.txt
          mkdir -p ../bench-bin
          cp target/release/nabedra-db "../bench-bin/nabedra-db-${TESTED_SHA::7}"
          cd ../bench-bin
          sha256sum nabedra-db-* | tee -a ../bench-build.txt
          ./nabedra-db-* --version | tee -a ../bench-build.txt
          ldd nabedra-db-* | tee -a ../bench-build.txt
          { ldd --version || true; } | sed -n 1p | tee -a ../bench-build.txt
          cp ../bench-build.txt .
      - uses: actions/upload-artifact@v4
        with:
          name: bench-binary
          path: bench-bin
          retention-days: 14
      - name: NS18 microbench (release, ignored tests)
        working-directory: server
        run: |
          set -o pipefail
          nproc; free -m; df -h .
          cargo test --locked --release -p nabedra-kv --test store_bench -- --ignored --nocapture --test-threads 1 2>&1 | tee ../ns18-bench.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns18-bench-log
          path: ns18-bench.log
          retention-days: 14

  # PERF1: CPU profile of the RF3 direct path. Opt-in with jobs=perf: builds a release binary with
  # frame pointers (for perf call graphs; the bench job's binary stays the comparison build), runs
  # the benchmark driver on this runner with the NS11 caps, records per-stage timings from
  # /v1/runtime/stats and samples every worker and the API with perf at idle (serial pair), at 50 and at
  # 150 updates/s.
  perf:
    name: direct path CPU profile and stage timings (PERF1)
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',perf,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Release nabedra-db with frame pointers (bookworm)
        run: |
          mkdir -p perf-bin
          docker run --rm -v "$PWD:/w" -w /w/server -e CARGO_BUILD_JOBS=4 -e CARGO_TERM_COLOR=never \
            -e RUSTFLAGS="-C force-frame-pointers=yes" "rust:${RUST_TOOLCHAIN}-bookworm" \
            sh -ec 'cargo build --locked --release --no-default-features --features oltp --bin nabedra-db && cp target/release/nabedra-db /w/perf-bin/nabedra-db-fp'
          sudo chown -R "$(id -u):$(id -g)" perf-bin server/target || true
          ls -la perf-bin
      - name: Benchmark image and perf
        run: |
          printf 'FROM python:3.11-slim-bookworm\nENV TOKIO_WORKER_THREADS=2\n' | docker build -t nabedra-perf-ci:1 -
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version; nproc; free -m
      - name: Serial pair with stage timings and an idle profile
        run: |
          cd scripts
          python3.11 benchmark_oltp_nabedra.py --image nabedra-perf-ci:1 --binary "$GITHUB_WORKSPACE/perf-bin/nabedra-db-fp" --direct-oltp on \
            --output "$GITHUB_WORKSPACE/perf-out/serial" --rates 0.2 --seconds 5 --warmup-seconds 5 --repetitions 10 \
            --clients 1 --rows 2000 --seed 20261118 --timeout 10 --perf-record 30 --perf-delay 20 --perf-frequency 999 --perf-call-graph fp
      # RD2: the same serial run with the role checks not kept warm (same binary and runner).
      - name: Serial pair without grant warming (RD2 A/B)
        run: |
          cd scripts
          python3.11 benchmark_oltp_nabedra.py --image nabedra-perf-ci:1 --binary "$GITHUB_WORKSPACE/perf-bin/nabedra-db-fp" --direct-oltp on \
            --output "$GITHUB_WORKSPACE/perf-out/serial-nowarm" --rates 0.2 --seconds 5 --warmup-seconds 5 --repetitions 10 \
            --clients 1 --rows 2000 --seed 20261118 --timeout 10 --worker-env NABEDRA_BENCH_NO_GRANT_WARM=1
      # RD3: 400 updates/s with and without leader direct admission (same binary and runner).
      - name: RD3 A/B (400/s, direct admission on/off)
        run: |
          cd scripts
          bench() { python3.11 benchmark_oltp_nabedra.py --image nabedra-perf-ci:1 --binary "$GITHUB_WORKSPACE/perf-bin/nabedra-db-fp" \
            --direct-oltp on --seed 20261118 --timeout 10 "$@"; }
          bench --output "$GITHUB_WORKSPACE/perf-out/rate400" --rates 400 --seconds 20 --warmup-seconds 5 \
            --repetitions 1 --clients 64 --rows 10000
          bench --output "$GITHUB_WORKSPACE/perf-out/rate400-noadmission" --rates 400 --seconds 20 --warmup-seconds 5 \
            --repetitions 1 --clients 64 --rows 10000 --worker-env NABEDRA_BENCH_NO_DIRECT_ADMISSION=1
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/perf-out" || true
      - name: 50 updates/s with perf
        run: |
          cd scripts
          python3.11 benchmark_oltp_nabedra.py --image nabedra-perf-ci:1 --binary "$GITHUB_WORKSPACE/perf-bin/nabedra-db-fp" --direct-oltp on \
            --output "$GITHUB_WORKSPACE/perf-out/rate50" --rates 50 --seconds 60 --warmup-seconds 5 --repetitions 1 \
            --clients 32 --rows 5000 --seed 20261118 --timeout 10 --perf-record 25 --perf-delay 25 --perf-frequency 999 --perf-call-graph fp
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/perf-out" || true
      # PERF1 (hardening): per-update CPU at the API (perf samples it too) and the leader at 150/s,
      # above the old two-worker API admission ceiling.
      - name: 150 updates/s with perf
        run: |
          cd scripts
          python3.11 benchmark_oltp_nabedra.py --image nabedra-perf-ci:1 --binary "$GITHUB_WORKSPACE/perf-bin/nabedra-db-fp" --direct-oltp on \
            --output "$GITHUB_WORKSPACE/perf-out/rate150" --rates 150 --seconds 60 --warmup-seconds 5 --repetitions 1 \
            --clients 32 --rows 10000 --seed 20261118 --timeout 10 --perf-record 25 --perf-delay 25 --perf-frequency 999 --perf-call-graph fp
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/perf-out" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-profile
          path: perf-out
          retention-days: 14

  # Paired A/B benchmarks (docs/testing/perf/README.md). Opt-in with jobs=ab. One runner per spec
  # builds release binaries of ab_base (default: sha, an A/A run) and sha, then runs
  # scripts/testing/ab.py with both sides. ab.py and the specs come from the workflow ref. With
  # ab_drivers=harness (default) both sides run the workflow ref's drivers, fixtures and ORM; with
  # ab_drivers=side each side runs from its own tree, for a head whose config, wire protocol or on-disk
  # format differs from the base. Every invocation starts one side's cluster on fresh data.
  ab:
    name: A/B ${{ matrix.spec }}
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',ab,')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # One leg per selected spec (revision job, "Resolve the A/B base and specs").
      matrix: ${{ fromJSON(needs.revision.outputs.ab_matrix) }}
    env:
      SPEC: ${{ matrix.spec }}
      NAME: ${{ matrix.name }}
      TARGET: ${{ matrix.target }}
      AB_BASE: ${{ needs.revision.outputs.ab_base }}
      AB_DRIVERS: ${{ inputs.ab_drivers || 'harness' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          path: code-under-test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build each side
        working-directory: code-under-test
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
          mkdir -p "$RUNNER_TEMP/ab-bin"
          for sha in $(printf '%s\n' "$TESTED_SHA" "$AB_BASE" | awk '!seen[$0]++'); do
            git checkout --quiet --detach "$sha"
            out="$RUNNER_TEMP/ab-bin/$TARGET-$sha"
            start=$(date +%s)
            case "$TARGET" in
              oltp|cache|olap)
                # The Dockerfile's bookworm base, so the binary also runs in the OLTP benchmark image.
                docker run --rm -v "$PWD:/w" -w /w/server -e CARGO_BUILD_JOBS -e CARGO_TERM_COLOR "rust:${RUST_TOOLCHAIN}-bookworm" \
                  cargo build --locked --release --no-default-features --features "$TARGET" --bin nabedra-db
                cp server/target/release/nabedra-db "$out" ;;
              events)
                docker build -q -f server/events/deploy/Dockerfile --build-arg BUILD_JOBS=4 -t "nabedra-events:$sha" server
                docker image inspect --format '{{.Id}}' "nabedra-events:$sha" > "$out" ;;
              kv)
                exe=$(cd server && cargo test --locked --release -p nabedra-kv --test store_bench --no-run --message-format=json \
                  | jq -r 'select(.executable != null and .target.name == "store_bench") | .executable')
                cp "$exe" "$out" ;;
              sim)
                (cd server && RUSTFLAGS="--cfg tokio_unstable" CARGO_TARGET_DIR=target/sim \
                  cargo build --locked --release -p nabedra-sim-oltp --bin nabedra-sim)
                cp server/target/sim/release/nabedra-sim "$out" ;;
            esac
            echo "$TARGET ${sha::10} built in $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          sha256sum "$RUNNER_TEMP"/ab-bin/*
      - name: Runner setup
        run: |
          base="$RUNNER_TEMP/ab-bin/$TARGET-$AB_BASE"; head="$RUNNER_TEMP/ab-bin/$TARGET-$TESTED_SHA"
          case "$TARGET" in
            events)
              base="nabedra-events:$AB_BASE"; head="nabedra-events:$TESTED_SHA" ;;
            oltp)
              printf 'FROM python:3.11-slim-bookworm\nENV TOKIO_WORKER_THREADS=2\n' | docker build -t nabedra-perf-ci:1 -
              echo "NABEDRA_PERF_OLTP_IMAGE=nabedra-perf-ci:1" >> "$GITHUB_ENV" ;;
            cache)
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends valkey-server valkey-tools || sudo apt-get install -y --no-install-recommends valkey-server
              sudo systemctl stop valkey-server || true
              python3.11 -m pip install --quiet 'redis==6.4.0' 'hiredis==3.2.1'
              valkey-server --version
              {
                echo "NABEDRA_PERF_VALKEY=$(command -v valkey-server)"
                echo "NABEDRA_PERF_VALKEY_CLI=$(command -v valkey-cli)"
                echo "NABEDRA_PERF_CLIENT_CPU=$(( $(nproc) - 1 ))"
              } >> "$GITHUB_ENV" ;;
            olap)
              {
                echo "NABEDRA_PERF_BASE_SHA=$AB_BASE"
                echo "NABEDRA_PERF_HEAD_SHA=$TESTED_SHA"
                echo "NABEDRA_PERF_FIXTURE_SHA=$GITHUB_SHA"
              } >> "$GITHUB_ENV" ;;
          esac
          roots=""
          case "$AB_DRIVERS" in
            harness) ;;
            side)
              for side in base head; do
                sha=$AB_BASE; [ "$side" = head ] && sha=$TESTED_SHA
                tree="$RUNNER_TEMP/tree-$side"
                git -C code-under-test worktree add --quiet --detach "$tree" "$sha"
                roots+=" --$side-root $tree"
              done ;;
            *) echo "::error::ab_drivers must be harness or side, got '$AB_DRIVERS'"; exit 1 ;;
          esac
          { echo "AB_BASE_BIN=$base"; echo "AB_HEAD_BIN=$head"; echo "AB_ROOTS=$roots"; } >> "$GITHUB_ENV"
          nproc; free -m; df -h .; grep -m1 'model name' /proc/cpuinfo
      - name: Paired run
        run: |
          out="$RUNNER_TEMP/ab-out/$NAME"; mkdir -p "$out"
          start=$(date +%s)
          set +e
          # shellcheck disable=SC2086 # AB_ROOTS is empty or two --<side>-root options.
          python3.11 scripts/testing/ab.py "$PWD/docs/testing/perf/$SPEC.toml" "$AB_BASE_BIN" "$AB_HEAD_BIN" --output "$out" $AB_ROOTS 2>&1 | tee "$out/ab.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "ab.py exit $status after $(( $(date +%s) - start )) s (base \`${AB_BASE::10}\`, head \`${TESTED_SHA::10}\`, drivers $AB_DRIVERS)" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-${{ matrix.name }}
          path: ${{ runner.temp }}/ab-out
          retention-days: 14

  # Callgrind instruction counts per operation (scripts/testing/insn_count.py) of ab_base against sha.
  # Opt-in with jobs=insn. The counting driver comes from the workflow ref and goes into both trees.
  insn:
    name: instruction counts (insn_count.py)
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',insn,')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AB_BASE: ${{ needs.revision.outputs.ab_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain and Callgrind
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind
          git fetch --quiet origin "$AB_BASE" "$TESTED_SHA"
      - name: Counts
        run: |
          start=$(date +%s)
          set +e
          python3 scripts/testing/insn_count.py --base "$AB_BASE" --head "$TESTED_SHA" --output insn.json \
            --work-dir "$RUNNER_TEMP/insn" 2>&1 | tee insn.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "insn_count.py exit $status after $(( $(date +%s) - start )) s"
            echo '```'
            grep -E '^(PASS|FAIL|NOISY|INCONCLUSIVE)' insn.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insn-counts
          path: |
            insn.json
            insn.log
          if-no-files-found: ignore
          retention-days: 14

  # LIVE3: Linux release binaries per engine, built in the Dockerfile's bookworm base, with checksums.
  live3:
    name: LIVE3 Linux release binary (${{ matrix.engine }})
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',live3,')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: rust:1.94.1-bookworm
    strategy:
      fail-fast: false
      matrix:
        engine: [oltp, olap, cache]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Build and identify the release binary
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN"
          cargo build --locked --manifest-path server/Cargo.toml --release --no-default-features --features "$ENGINE" --bin nabedra-db
          mkdir live3-bin
          cp server/target/release/nabedra-db live3-bin/
          cd live3-bin
          sha256sum nabedra-db > SHA256SUMS
          {
            printf 'source=%s\nengine=%s\n' "$TESTED_SHA" "$ENGINE"
            rustc --version
            ./nabedra-db --version
            ldd nabedra-db
          } | tee build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: live3-${{ matrix.engine }}
          path: live3-bin
          retention-days: 7

  # GC1: CPU, wall time, entries, fsyncs and bytes per committed direct write on an in-process
  # RF3 cluster (per-voter runtimes, per-thread CPU from /proc), release build, uncapped.
  # Prints one `GC1 {json}` line per phase into gc1-measure.log.
  gc1:
    name: direct write cost per entry, append and fsync (GC1)
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',gc1,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml disagrees with RUST_TOOLCHAIN" >&2; exit 1; }
      - name: Build release library tests
        working-directory: server
        run: cargo test --locked --release --no-default-features --features oltp --lib --no-run
      - name: Measure
        working-directory: server
        env:
          GC1_RATES: "100,400,1000,2000"
          GC1_RANGES: "1,8"
          # GC2: Raft log group commit on (GC1), DirectBatch off vs on.
          GC1_MODES: "on"
          GC1_BATCH: "off,on"
          GC1_PACKING: "800,1600"
          GC1_SECONDS: "10"
          GC1_SERIAL: "300"
        run: |
          set -o pipefail
          nproc; free -m; df -h .
          cargo test --locked --release --no-default-features --features oltp --lib gc1_measure -- --ignored --nocapture --test-threads 1 2>&1 | tee ../gc1-measure.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc1-measure
          path: gc1-measure.log
          retention-days: 14

  # PERF1 (hardening): factor A/B on runners, relative numbers only (the controlled host gives the
  # headline numbers). `perf1-bin` builds this commit's release server; the before binary is BENCH2's
  # 5eb80fb artifact (run 44878990620), whose product code equals 7e110cb. One variable at a time,
  # same driver, data, rates and NS11 caps unless stated.
  perf1-bin:
    name: PERF1 factor binary
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',perf1,')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: rust:1.94.1-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Build release nabedra-db (oltp)
        working-directory: server
        run: |
          rustup default "$RUST_TOOLCHAIN"
          cargo build --locked --release --no-default-features --features oltp --bin nabedra-db
          mkdir -p ../perf1-bin && cp target/release/nabedra-db ../perf1-bin/nabedra-db-after
          sha256sum ../perf1-bin/nabedra-db-after
      - uses: actions/upload-artifact@v4
        with:
          name: perf1-after-binary
          path: perf1-bin
          retention-days: 7

  perf1-factors:
    name: PERF1 factors (${{ matrix.factor }})
    needs: [revision, perf1-bin]
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        factor: [api, compaction]
    env:
      FACTOR: ${{ matrix.factor }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: perf1-after-binary
          path: perf1-bin
      - uses: actions/download-artifact@v4
        with:
          name: bench-binary
          path: perf1-before
          run-id: 44878990620
          github-token: ${{ github.token }}
      - name: Binaries and image
        run: |
          mv perf1-before/nabedra-db-5eb80fb perf1-bin/nabedra-db-before
          chmod +x perf1-bin/*
          sha256sum perf1-bin/*
          printf 'FROM python:3.11-slim-bookworm\nENV TOKIO_WORKER_THREADS=2\n' | docker build -t nabedra-perf-ci:1 -
          nproc; free -m; df -h .
      - name: Runs
        run: |
          cd scripts
          OUT="$GITHUB_WORKSPACE/perf1-out"; mkdir -p "$OUT"
          run() {  # run <name> <before|after> <api-cpus> <args...>
            local name=$1 binary=$2 api=$3; shift 3
            local rc=0 start=$(date +%s)
            python3.11 benchmark_oltp_nabedra.py --image nabedra-perf-ci:1 --binary "$GITHUB_WORKSPACE/perf1-bin/nabedra-db-$binary" \
              --direct-oltp on --api-cpus "$api" --seed 20261118 --timeout 10 --output "$OUT/$name" "$@" \
              > "$OUT/$name.console.log" 2>&1 || rc=$?
            echo "$name rc=$rc seconds=$(( $(date +%s) - start )) load=$(cut -d' ' -f1-3 /proc/loadavg)" | tee -a "$OUT/runs.txt"
          }
          FAC="--rates 100,200,400 --seconds 5 --warmup-seconds 3 --repetitions 3 --clients 32 --rows 5000"
          SOAK="--soak --soak-rows 80000 --soak-payload-bytes 2048 --soak-seconds 300 --soak-phase-seconds 60 --clients 32 --soak-verify-keys 500"
          if [ "$FACTOR" = api ]; then
            for api in 0.35 none 0.7 1.0; do
              for b in before after; do run "fac-$b-api$api" $b $api $FAC; done
            done
          else
            run soak100-before-api0.35 before 0.35 $SOAK --soak-rate 100
            run soak100-after-api0.35 after 0.35 $SOAK --soak-rate 100
            run soak100-before-apinone before none $SOAK --soak-rate 100
            run soak100-after-apinone after none $SOAK --soak-rate 100
            run soak100-after-apinone-hold after none $SOAK --soak-rate 100 --hold-compaction
            run soak50-before-api0.35 before 0.35 $SOAK --soak-rate 50
            run soak50-after-api0.35 after 0.35 $SOAK --soak-rate 50
            run soak50-after-apinone after none $SOAK --soak-rate 50
            run soak50-after-apinone-hold after none $SOAK --soak-rate 50 --hold-compaction
          fi
      - name: Summary
        if: always()
        run: |
          OUT="$GITHUB_WORKSPACE/perf1-out"
          cat "$OUT/runs.txt" || true
          python3.11 docs/testing/evidence/oltp/direct-latency/perf1-hardening/analyze.py "$OUT"/*/ --json "$OUT/summary.json" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf1-factors-${{ matrix.factor }}
          path: perf1-out
          retention-days: 14

  # SNAP1 (hardening): NS11 soaks before/after taking Raft snapshot export off the apply path.
  # Before = nabedra/hardening bb6dc32 (main 70c4e7d merged), after = the tested commit.
  # Runner numbers are relative; same driver, data, rates and NS11 caps for both binaries.
  snap1-bin:
    name: SNAP1 soak binary (${{ matrix.side }})
    needs: revision
    if: contains(needs.revision.outputs.jobs, ',snap1,')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: rust:1.94.1-bookworm
    strategy:
      matrix:
        side: [before, after]
    env:
      SIDE: ${{ matrix.side }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'before' && 'bb6dc324e00493ee4ae5d3735184811d29404fb3' || env.TESTED_SHA }}
      - name: Build release nabedra-db (oltp)
        working-directory: server
        run: |
          rustup default "$RUST_TOOLCHAIN"
          cargo build --locked --release --no-default-features --features oltp --bin nabedra-db
          mkdir -p ../snap1-bin && cp target/release/nabedra-db "../snap1-bin/nabedra-db-$SIDE"
          echo "built $SIDE at $(git rev-parse HEAD 2>/dev/null || echo unknown)"; sha256sum ../snap1-bin/*
      - uses: actions/upload-artifact@v4
        with:
          name: snap1-binary-${{ matrix.side }}
          path: snap1-bin
          retention-days: 7

  snap1-soak:
    name: SNAP1 soaks (${{ matrix.rate }}/s)
    needs: [revision, snap1-bin]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        rate: [100, 50]
    env:
      RATE: ${{ matrix.rate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: snap1-binary-*
          path: snap1-bin
          merge-multiple: true
      - name: Binaries and image
        run: |
          chmod +x snap1-bin/*
          sha256sum snap1-bin/*
          printf 'FROM python:3.11-slim-bookworm\nENV TOKIO_WORKER_THREADS=2\n' | docker build -t nabedra-perf-ci:1 -
          nproc; free -m; df -h .
      - name: Soaks
        run: |
          cd scripts
          OUT="$GITHUB_WORKSPACE/snap1-out"; mkdir -p "$OUT"
          SOAK="--soak --soak-rows 80000 --soak-payload-bytes 2048 --soak-seconds 300 --soak-phase-seconds 60 --clients 32 --soak-verify-keys 500"
          for side in before after; do
            name="soak$RATE-$side"; rc=0; start=$(date +%s)
            python3.11 benchmark_oltp_nabedra.py --image nabedra-perf-ci:1 --binary "$GITHUB_WORKSPACE/snap1-bin/nabedra-db-$side" \
              --direct-oltp on --api-cpus none --seed 20261118 --timeout 10 --output "$OUT/$name" $SOAK --soak-rate "$RATE" \
              > "$OUT/$name.console.log" 2>&1 || rc=$?
            echo "$name rc=$rc seconds=$(( $(date +%s) - start )) load=$(cut -d' ' -f1-3 /proc/loadavg)" | tee -a "$OUT/runs.txt"
          done
      - name: Summary
        if: always()
        run: |
          OUT="$GITHUB_WORKSPACE/snap1-out"
          cat "$OUT/runs.txt" || true
          python3.11 docs/testing/evidence/oltp/direct-latency/snap1/analyze_snap1.py "$OUT"/*/ --json "$OUT/snap1-summary.json" || true
          python3.11 docs/testing/evidence/oltp/direct-latency/perf1-hardening/analyze.py "$OUT"/*/ --json "$OUT/perf1-summary.json" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snap1-soak-${{ matrix.rate }}
          path: snap1-out
          retention-days: 14
