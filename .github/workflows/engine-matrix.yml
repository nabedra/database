name: engine builds
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      TOKIO_WORKER_THREADS: 2
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang libclang-dev
      - run: cargo fmt --manifest-path server/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml --no-default-features --features oltp --all-targets -- -D warnings
      - run: python3 scripts/check_engine_features.py
      - run: python3 -m pip install './orm/python[gateway]'
      - run: cargo build --locked --manifest-path server/Cargo.toml --no-default-features --features oltp --bin nabedra-db
      - run: python3 server/tests/oltp_process.py --binary server/target/debug/nabedra-db --evidence-dir "${{ runner.temp }}/oltp-process" --benchmark-condition "GitHub hosted CI runner; other host activity not controlled"
      - run: PYTHONPATH=orm/python/src python3 -m unittest discover -s orm/python/tests -v
