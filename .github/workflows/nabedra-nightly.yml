name: nabedra nightly

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabedra-nightly-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch nightly checks on main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Dispatching nabedra-build.yml is the only write this workflow makes.
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Select T2 checks and dispatch the build workflow
        env:
          GH_TOKEN: ${{ github.token }}
          S3_CONFIGURED: ${{ vars.NABEDRA_TEST_S3_ROLE_ARN != '' && vars.NABEDRA_TEST_S3_BUCKET != '' }}
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          include_s3=true
          # A dispatched check fails on not-run, so S3 checks wait until the test bucket exists.
          if [ "$S3_CONFIGURED" != true ]; then
            include_s3=false
            echo "S3 checks omitted: not-run: s3-unconfigured (repository variables unset)." >> "$GITHUB_STEP_SUMMARY"
          elif ! python3 scripts/testing/s3/budget.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
            include_s3=false
            echo "S3 checks omitted because the budget check failed." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Keep four OLTP shards, two Events shards and the Cache cluster sweep.
          # The four OLTP entries join this list through their T2 check definitions.
          checks=$(python3 scripts/testing/run_check.py --list --tier T2 --json |
            jq -r --argjson include_s3 "$include_s3" \
              '[.[] |
                select($include_s3 or (.needs | index("s3") == null)) |
                select(.id != "events-sim-nightly-3" and .id != "events-sim-nightly-4") |
                .id] | join(",")')
          # The run ID keeps a manual rerun on the same day from sharing evidence and S3 prefixes.
          request_id="nightly-${sha:0:7}-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          {
            printf 'Tested revision: `%s`\n\n' "$sha"
            printf 'Request: `%s`\n\n' "$request_id"
            printf 'T2 checks: %s\n' "${checks:-none registered}"
          } >> "$GITHUB_STEP_SUMMARY"
          gh workflow run nabedra-build.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f sha="$sha" -f request_id="$request_id" -f base=false \
            -f checks="$checks" -f jobs=fuzz,features,quarantine -f fuzz_seconds=3600 | tee -a "$GITHUB_STEP_SUMMARY"
