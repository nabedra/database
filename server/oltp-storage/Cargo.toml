[package]
name = "nabedra-oltp-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/zPy52/nabedra-database"
publish = ["crates-io"]
description = "Nabedra OLTP storage"

[features]
sim = ["nabedra-rt/sim", "nabedra-kv/sim", "dep:nabedra-sim"]
test-hooks = ["nabedra-resources/test-defaults", "nabedra-resources/test-hooks"]

[dependencies]
nabedra-sim = { path = "../sim", version = "0.1.0", optional = true }
nabedra-rt = { path = "../rt", version = "0.1.0" }
nabedra-protocol = { path = "../protocol", version = "0.1.0" }
nabedra-resources = { path = "../resources", version = "0.1.0" }
nabedra-oltp-types = { path = "../oltp-types", version = "0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "arbitrary_precision"] }
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "io-util"] }
tracing = "=0.1.44"
uuid = { version = "=1.29.2", features = ["serde", "v4"] }
nabedra-kv = { path = "../kv", version = "0.1.0" }
bytes = "=1.12.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
libc = "=0.2.191"

[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["async-await"] }
nabedra-resources = { path = "../resources", version = "0.1.0", features = ["test-defaults", "test-hooks"] }
tokio = { version = "=1.54.1", features = ["test-util"] }
