The 2def358f refusal reversed where it decides, QuorumEndpoint::check_mount in manager/system_recovery.rs: a
mount that Control already committed is accepted even when the process retained nothing.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults and trigger, and what is missing.
workload = "membership"
profile = ["replacement", "wipe-data"]
# expect is the plan. The text an expected kind enforces is in [[rules]] at the end. A kind without text there detects
# nothing.
# No [[rules]] for WipedNeverVotes: its only text is design 3.7, and lead decision 13.1 lists design rules for rows 6,
# 9, 20 and the Liveness rows (read as 10, 11, 13 and 16), not for row 15.
expect = ["WipedNeverVotes"]
hold = """\
Row 15. The in-tree regression fails on a timeout alone (`subprocess.TimeoutExpired`), and the assertions after \
it never run. Missing: (1) a state check in the tree, such as the review's r121_wiped_replacement_never_rejoins \
with server/tests/review121_wipe.py, which is on scratch/review-121-clean and -clean2 only; (2) [regression] \
naming it, with clean and patched runs of it; (3) a [review] of that test with assertion state. The row is also \
blocked (H-05 and S12 in ../simulator.toml), and decision 13.1 lists no design rule for it.\
"""
seeds = [1, 10000]

# The text below is a timeout, not a state check: the suite's assertions after the 30 s exit wait never run. The
# review's state check (below) is on a scratch branch, so this manifest cannot name it as its test.
[regression]
kind = "recovery-suite"
suite = "replacement-wipe"
mode = "on"
assertion = "timeout"
timeout_s = 3600
failure_contains = ["assert attempt.popen.wait(timeout=30) != 0", "subprocess.TimeoutExpired"]

