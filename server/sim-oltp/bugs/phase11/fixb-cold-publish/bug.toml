port_notes = """
The d509f66b hunk in authority/control/machine/system_recovery.rs reversed: Publish requires the replacement's
original run instead of the revocation that Mount wrote, so a cold start between them makes Publish Stale
forever. c7249204's resume path stays; it cannot publish past this check.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults and trigger, and what is missing.
workload = "membership"
profile = ["replacement", "full-stop"]
# expect: only rules lead decision 9 allows, with their source text (designs/ is outside this repository).
#   `Liveness`, designs/phase-10-11-oltp-sim.md, 3.7: "convergence within 30 s of the heal; the cold start, move or
#     index build finishes within its bound"
#   `Liveness`, designs/phase-10-11-oltp-sim.md, 4.2, row 13: "`Liveness` (replacement)"
expect = ["Liveness"]
seeds = [1, 10000]

[regression]
