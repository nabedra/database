# Reverted fix FLAKE3-epoch (phase 11, design section 4.2, row 19).
schema = "nabedra.sim-bug/1"
id = "flake3-epoch"
bug = "FLAKE3-epoch"
set = "resources"
phase = 11
class = "resource-release-order"
guarantees = ["OLTP-G01"]
scenarios = ["O06", "O11"]
fix_commits = ["38fc414df670cdfae981184e4721c0bbd79ff0e9"]
reverts = "38fc414df670cdfae981184e4721c0bbd79ff0e9"
port = "hand"
port_notes = """
38fc414d reversed in typed_log.rs (a test-hooks cfg and crate moves around it): take() uses the head job's
epoch again, so a task whose own append was already covered can take jobs queued behind a pending vote,
truncation or purge.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults and trigger, and what is missing.
workload = "resources"
profile = ["leader-move", "append-load", "crash-leader"]
# expect: only rules lead decision 9 allows, with their source text (designs/ is outside this repository).
#   `LogMatching`, designs/phase-10-11-oltp-sim.md, 3.7: "the same `(group, index)` always applies the same log id and
#     payload hash"
#   `MajorityReached`, designs/phase-10-11-oltp-sim.md, 3.7: "an applied entry is durable on a majority, rebuilt from
#     the volume at each start"
expect = ["LogMatching", "MajorityReached"]
seeds = [1, 10000]

# The assertion below is a counter (how many syncs happened), not a state check.
[regression]
kind = "lib-test"
test = "oltp_replication::typed_log::tests::o06_o11_gc1_queued_appends_share_one_sync_and_never_cross_a_vote"
mode = "on"
failure_contains = ["the vote must sync before the post-vote batch starts"]

# The patch author's own runs.
[regression.evidence]
digest = "44a619dbc910f2fcad82e491bf5684e07498864f92366e8afb48e3d606f115ae"
clean = { run = "https://github.com/zPy52/nabedra-database/actions/runs/45435450471", sha = "b0a6d0573cba411b762e8c4e544431710003576b", result = "passed", note = "request p11-bugs-clean-b0a6d05-171752, o06_o11_gc1_queued_appends_share_one_sync_and_never_cross_a_vote, 3 of 3 attempts, on mode, over main c8426fe1" }
patched = { run = "https://github.com/zPy52/nabedra-database/actions/runs/45435960323", sha = "ab0b5567e26a47350fc2c3e3881679d03967baec", result = "failed", note = "request p11-bugs-flake3-epoch-ab0b556-172028, o06_o11_gc1_queued_appends_share_one_sync_and_never_cross_a_vote, 20 of 20 attempts, on mode, over main c8426fe1", output = """
assertion `left == right` failed: the vote must sync before the post-vote batch starts
  left: 5
 right: 6
test result: FAILED. 0 passed; 1 failed; 0 ignored; 0 measured; 193 filtered out; finished in 0.02s
""" }

