"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults and trigger, and what is missing.
workload = "resources"
profile = ["leader-move", "append-load", "crash-leader"]
# expect is the plan. The text an expected kind enforces is in [[rules]] at the end. A kind without text there detects
# nothing.
# No [[rules]] for LogMatching and MajorityReached: its only text is design 3.7, and lead decision 13.1 lists design
# rules for rows 6, 9, 20 and the Liveness rows (read as 10, 11, 13 and 16), not for row 19.
expect = ["LogMatching", "MajorityReached"]
hold = """\
Row 19. The in-tree assertion is a counter (how many syncs happened). Missing: (1) a state check in the tree, \
such as the review's r121_flake3_a_crash_never_keeps_a_post_vote_entry_without_its_vote, which is on \
scratch/review-121-clean2 only; (2) [regression] naming it, with clean and patched runs of it; (3) a [review] of \
that test with assertion state. The row also looks unreachable through a RaftCore (read by author and reviewer, \
not run), and decision 13.1 lists no design rule for it.\
"""
seeds = [1, 10000]

