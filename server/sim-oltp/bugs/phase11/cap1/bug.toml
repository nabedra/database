# Reverted fix CAP1 (phase 11, design section 4.2, row 17).
schema = "nabedra.sim-bug/1"
id = "cap1"
bug = "CAP1"
set = "membership"
phase = 11
class = "membership-replacement-trust"
guarantees = ["OLTP-G06", "OLTP-G08"]
scenarios = ["O02", "O12"]
fix_commits = ["9be40820c5d2385d24e8bc4d5b3b441820567f04", "414dcf79c8f29eb01a4b1a5961b078eacb477232", "2920a442d269135de2a7471001d6af9ea4c45853"]
reverts = "2920a442d269135de2a7471001d6af9ea4c45853"
port = "hand"
port_notes = """
Partial. Put back: the per-connection proposal gate 2920a442 replaced (check_index_reclamation_voters,
peer_features set by HostedGroupManager) and the ungated reclamation loop. Not put back, because the code
is gone: ALPN nabedra-otp/3, PeerFeature::IndexReclamation, RequestTarget::Feature and the session's
required-feature refusal (9be40820), and the sender gates (414dcf79). The gate therefore asks for
PeerFeature::DirectAdmission (otp/4), the surviving half of the original
`direct_admission || alpn == INDEX_RECLAIM_ALPN`. With one binary every session passes both forms.
The missing sender gates make the patch wider than the original on the sender side: the calls
ParticipantStoredIndex, ParticipantIndexReclaim and TimestampCall 42 go to any session. The record's consequence, an old
build that cannot apply the entry, cannot happen with one binary. What the review measured: the ReclaimIndex entry
commits with no member advertising it and Control not enabling it, and a worker that never advertised joins afterwards.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults and trigger, and what is missing.
workload = "membership"
profile = ["mixed-features", "index-drop", "worker-join"]
# expect: only rules lead decision 9 allows, with their source text (designs/ is outside this repository).
#   `CapabilityBeforeUse`, designs/phase-10-11-oltp-sim.md, 3.7: "no entry needing feature F commits while a voter lacks
#     F"
expect = ["CapabilityBeforeUse"]
seeds = [1, 10000]

# The probe is the patch author's. What confirms this row is the review's run below, not the probe.
[regression]
kind = "lib-test"
test = "oltp_replication::manager::damage_scheduler_tests::probe_cap1_no_reclamation_before_the_cluster_feature"
mode = "on"
probe = true
failure_contains = ["before Control enabled data.index.reclaim"]

# The patch author's own runs.
[regression.evidence]
digest = "709d7c994a53a0c42ff9414da3fe54666378b16cfdc09893882109836db1eaaa"
clean = { run = "https://github.com/zPy52/nabedra-database/actions/runs/45435450471", sha = "b0a6d0573cba411b762e8c4e544431710003576b", result = "passed", note = "request p11-bugs-clean-b0a6d05-171752, probe_cap1_no_reclamation_before_the_cluster_feature, 3 of 3 attempts, on mode, over main c8426fe1" }
patched = { run = "https://github.com/zPy52/nabedra-database/actions/runs/45435906940", sha = "386b6dde6e3506647c28aa91c2629509bb28106b", result = "failed", note = "request p11-bugs-cap1-386b6dd-172011, probe_cap1_no_reclamation_before_the_cluster_feature, 1 of 1 attempts, on mode, over main c8426fe1", output = """
a ReclaimIndex entry committed at AppliedPosition { term: 1, node_id: 1, index: 3 } before Control enabled data.index.reclaim
test result: FAILED. 0 passed; 1 failed; 0 ignored; 0 measured; 194 filtered out; finished in 1.58s
""" }

