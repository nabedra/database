# Reverted fix TOPO1-child-schema (phase 11, design section 4.2, row 4).
schema = "nabedra.sim-bug/1"
id = "topo1-child-schema"
bug = "TOPO1-child-schema"
set = "topology"
phase = 11
class = "stale-route-topology-schema"
guarantees = ["OLTP-G06"]
scenarios = ["O28", "D11"]
fix_commits = ["40e0c7f76d27c67d3f1deda91bc585b1781811bf"]
reverts = "40e0c7f76d27c67d3f1deda91bc585b1781811bf"
port = "clean"
port_notes = """
`git diff 40e0c7f7 40e0c7f7^` on its two product files (store/direct.rs moved to nabedra-oltp-storage): the
executor's schema cache key is (table, route epoch, group epoch) without the lifecycle, and DirectSchema
loses its now unused Hash. The probe drives CatalogSchema directly. The bug record's O28 also fails with the
patch (opt-level-1 growth job, `fresh scan omitted an acknowledged mutation`, run 45440163383) and passes
without it (run 45440174171), one run each.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults and trigger, and what is missing.
workload = "topology"
profile = ["index-publish", "split"]
# expect: only rules lead decision 9 allows, with their source text (designs/ is outside this repository).
#   `CoveringIndexComplete`, designs/phase-10-11-oltp-sim.md, 3.7: "an acknowledged insert appears in every covering
#     index scan at a later snapshot"
expect = ["CoveringIndexComplete"]
seeds = [1, 10000]

# The stronger regression is acceptance O28: author patched 1 of 1 failed, clean 1 of 1 passed (port_notes); review below.
[regression]
kind = "lib-test"
test = "oltp_runtime::worker_runtime::index_backend::acceptance_tests::probe_topo1_a_reused_direct_epoch_reads_the_new_lifecycle"
mode = "on"
probe = true
failure_contains = ["the child group used the parent's cached pre-index descriptor"]

# The patch author's own runs.
[regression.evidence]
