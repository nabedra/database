port_notes = """
http.rs before d7b9d63c kept the direct gateway only with a declared length
(`.zip(declared_length(..))`). PERF1 restructured that code, so the port filters the gateway on
`length.is_some()` at its one use. A body without Content-Length skips the anchor check again.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
