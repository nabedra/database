schema = "nabedra.sim-bug/1"
id = "rv-rep-2"
bug = "RV-REP-2"
set = "membership"
phase = 11
class = "membership-replacement-trust"
guarantees = ["OLTP-G08", "OLTP-G09"]
scenarios = ["O17"]
fix_commits = ["8b3c44b2c55b51c4aae414567924ace705fdf048", "2def358f9c98bb14910726ac5888ba3be2a80441"]
reverts = ["8b3c44b2c55b51c4aae414567924ace705fdf048", "2def358f9c98bb14910726ac5888ba3be2a80441"]
port = "hand"
port_notes = """
Partial: two fixes are reversed and the record's consequence is not back. The patch reverses
8b3c44b2c55b51c4aae414567924ace705fdf048 (system_trust.rs loads 1,024 revocations) and
2def358f9c98bb14910726ac5888ba3be2a80441's capacity refusal in system_recovery.rs. Neither alone has the defect
after a mount at the limit (review, local runs). 8b3c44b2 alone shows only on an old durable image (author, run
45435939958, `!restarted.revoked(survivor)`): since 2def358f Control refuses the mount that would write the 1,025th
revocation. With both, that mount commits and Control cannot load its revocations again. The title, `The 1,025th worker revocation could stop Control`, is not put back: refresh_or_retry
(2def358f) stays, so a running core keeps going, and a restart does not fail either: with_replacement_directory returns
Ok and retries forever with trust_available() false. The regression fails at its first assertion, the 2def358f refusal,
and never reaches the 8b3c44b2 half.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults and trigger, and what is missing.
workload = "membership"
profile = ["revocation-storm"]
# expect is the plan. The text an expected kind enforces is in [[rules]] at the end. A kind without text there detects
# nothing.
# No [[rules]] for Liveness: its only text is design 3.7, and lead decision 13.1 lists design rules for rows 6, 9, 20
# and the Liveness rows (read as 10, 11, 13 and 16), not for row 18.
expect = ["Liveness"]
seeds = [1, 10000]

# The text below shows the 2def358f half only.
[regression]
kind = "lib-test"
test = "oltp_replication::authority::control::tests::system_recovery::o17_revocation_limit_and_failed_refresh_preserve_the_committed_mount"
mode = "on"
assertion = "state"
failure_contains = ["left: SystemReplacementMounted"]

