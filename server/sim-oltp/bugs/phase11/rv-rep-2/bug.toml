# Reverted fix RV-REP-2 (phase 11, design section 4.2, row 18).
schema = "nabedra.sim-bug/1"
id = "rv-rep-2"
bug = "RV-REP-2"
set = "membership"
phase = 11
class = "membership-replacement-trust"
guarantees = ["OLTP-G08", "OLTP-G09"]
scenarios = ["O17"]
fix_commits = ["8b3c44b2c55b51c4aae414567924ace705fdf048", "2def358f9c98bb14910726ac5888ba3be2a80441"]
reverts = "8b3c44b2c55b51c4aae414567924ace705fdf048"
port = "hand"
port_notes = """
8b3c44b2 reversed (system_trust.rs loads 1,024 revocations), plus the 2def358f capacity refusal in
system_recovery.rs. 8b3c44b2 alone is clean but cannot be reached: since 2def358f Control refuses the mount
that would write the 1,025th revocation, so only an old durable image holds one. With both, the 1,025th
mount commits and Control cannot load its revocations again. refresh_or_retry (2def358f) stays, so a running
core keeps retrying instead of stopping; a restart fails.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults, trigger and invariant, and what is missing.
workload = "membership"
profile = ["revocation-storm"]
expect = ["Liveness"]
seeds = [1, 10000]

[regression]
kind = "lib-test"
test = "oltp_replication::authority::control::tests::system_recovery::o17_revocation_limit_and_failed_refresh_preserve_the_committed_mount"
mode = "on"
failure_contains = ["left: SystemReplacementMounted"]

