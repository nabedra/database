Row 20. The in-tree assertion is a counter (how many stubbed reads are in flight). Missing: (1) a state check in \
the tree, such as the review's r121_rd2_hung_background_reads_leave_the_foreground_a_lane_slot, which is on \
scratch/review-121-clean2 only and models the Control lane; (2) [regression] naming it, with clean and patched \
runs of it; (3) a [review] of that test with assertion state.\
"""
seeds = [1, 10000]

# The assertion below is a counter (how many stubbed reads are in flight), not a state check.
