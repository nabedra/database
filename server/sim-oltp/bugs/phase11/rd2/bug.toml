# Independent review of PR #121 (2026-11-24, Claude Opus 5.5, wrote no patch): sensitive.
# Patch read: exact. Kept apart from the author's evidence above. These are workflow `tests`, `scenarios` or growth runs
# in mode on, not attested checks, and not a detection.
# - sensitive by the review's own test: the in-tree assertion is a counter (see [regression]). The lane in the review's test is a model.
# - oltp_replication::service_rpc::grant_cache::tests::r121_rd2_hung_background_reads_leave_the_foreground_a_lane_slot: clean https://github.com/zPy52/nabedra-database/actions/runs/45461651504 (01c4af20) 3 of 3 passed; patched https://github.com/zPy52/nabedra-database/actions/runs/45461681739 (600bbac1) 3 of 3 failed: `the foreground found the Control lane full 140 times of 200`, with a modelled four-slot lane.
# - the [regression] test, the counter: clean https://github.com/zPy52/nabedra-database/actions/runs/45456378227 (f75c41a7) 3 of 3 passed; patched https://github.com/zPy52/nabedra-database/actions/runs/45456677709 (79f07747) 3 of 3 failed: `in_flight.load(Ordering::Relaxed) <= 1`, a count of stubbed reads.
# No [review] table. The review calls the patch sensitive by its own state test only, which is not in the tree. The tool
# ties [review] to [regression], whose assertion is a counter, and refuses `sensitive` with it. Any other verdict would
# not be the review's. See hold.

[[rules]]  # 4.2, row 20
kind = "WarmReadsSerial"
source = "plans/testing/phase-10-11-oltp-sim.md"
text = "a probe rule allows at most one background Control lane slot"

[[rules]]  # 3.7
