116f03f8 reversed in service_rpc/grant_cache.rs, where #68 added a sim-only ordered map around it: warm
refreshes run together with join_all under GRANT_TTL again, without backoff.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults and trigger, and what is missing.
workload = "cold"
profile = ["staggered-reopen", "control-delay"]
# expect is the plan. The text an expected kind enforces is in [[rules]] at the end. A kind without text there detects
# nothing.
expect = ["WarmReadsSerial", "Liveness"]
