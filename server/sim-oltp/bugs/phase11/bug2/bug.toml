# Reverted fix BUG2 (phase 11, design section 4.2, row 5).
schema = "nabedra.sim-bug/1"
id = "bug2"
bug = "BUG2"
set = "queued"
phase = 11
class = "stale-route-topology-schema"
guarantees = ["OLTP-G06", "OLTP-G07"]
scenarios = ["O16"]
fix_commits = ["fd5aa4a3cef443fc1635ff5667e232b071b6c007"]
reverts = "fd5aa4a3cef443fc1635ff5667e232b071b6c007"
port = "hand"
port_notes = """
The fix's two hunks reversed in server/oltp-types/src/queue.rs, where RecordHeader::preflight moved from
oltp_runtime/replica.rs. A ready view or owner mismatch is part of the malformed check again. The bug record's
O16 (direct_oltp off) passed once with the patch, so it is not a steady regression.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults and trigger, and what is missing.
workload = "queued"
profile = ["view-change", "delay-install", "owner-kill"]
# expect: only rules lead decision 9 allows, with their source text (designs/ is outside this repository).
#   `QueueCopyStaleNotInvalid`, designs/phase-10-11-oltp-sim.md, 3.7: "a well-formed copy from a newer authority is
#     refused as `Stale`"
#   `QueueRetention`, designs/phase-10-11-oltp-sim.md, 3.7: "an accepted request keeps a complete copy while any holder
#     lives, and the new run is empty after a full stop"
#   `QueueRetention`, docs/testing/guarantees/oltp.md, OLTP-G07: "Accepted queued work stays recoverable while a
#     complete copy survives. A full worker stop abandons outstanding work."
expect = ["QueueCopyStaleNotInvalid", "QueueRetention"]
seeds = [1, 10000]

# The probe is the patch author's. What confirms this row is the review's run below, not the probe.
[regression]
kind = "lib-test"
test = "oltp_runtime::replica::tests::probe_bug2_a_copy_under_a_newer_authority_is_stale_not_invalid"
mode = "on"
probe = true
failure_contains = ["a copy under a newer ready view", "left: Some(Invalid)"]

# The patch author's own runs.
[regression.evidence]
digest = "ebe0d865b9c52eb4282f5f1312545aade25ba3afcd94045bb6cb1f95a82df89d"
