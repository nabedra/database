bug = "GC1-double-guard"
set = "resources"
phase = 11
class = "resource-release-order"
guarantees = ["OLTP-G09"]
scenarios = ["C07", "F03"]
fix_commits = ["b694f75b3a2198c6a02aff222a2f62dd1161adde"]
reverts = ["b694f75b3a2198c6a02aff222a2f62dd1161adde"]
port = "hand"
port_notes = """
b694f75b reversed in typed_log.rs (log targets changed around it): each AppendJob carries a second
PendingGuard besides its task's guard. Not sensitive: the regression fails on the pending counter only. The defect
changes only the count. Both guards are acquired and released once each, so there is no other behaviour to test.
Refreshed on 1fb888a9 (close-out of broad run 45727968538): #151 added sim-only probe lines to the append task
(`WorkStarted` and `WorkDone` for the task's guard). Context only, the changed lines are the same (digest
unchanged). `drop(pending)` stays the task's last statement, now after the sim-only `WorkDone`, so a sim build
still reports the work done before the job guards are released. In a sim build the probe now names the job's
guard (moved into AppendJob) and the task's own guard has no WorkStarted or WorkDone.
"""
