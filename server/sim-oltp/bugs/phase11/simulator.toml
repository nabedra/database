# What each phase 11 reverted fix needs from the simulator before a search can count (P11-BUGS).
# Nothing here is a detection. `faults` names the schedule, `trigger` the protocol point to place it at,
# `rules` the names in the manifest's `expect` with their source text, and `gaps` what the simulator or the
# design lacks today.
#
# `sensitivity` is the independent review's word (PR #121, 2026-11-24): sensitive, partial or not sensitive. The runs are
# in the manifests. A partial patch cannot count for the bar (amendment to lead decision 9).
#
# `rules` is [[rules]] of the manifest: a literal quote of `file` for each rule that has an allowed text. Lead decision 9 and
# its amendments say which texts count, and decision 13.1 lists the rows that may quote the design copied to
# plans/testing/phase-10-11-oltp-sim.md: 6, 9, 20 and the Liveness rows, read here as 10, 11, 13 and 16. `no_text` names
# kinds in `expect` whose only text is the design's, for a row that is not listed: they detect nothing. A name here is not a
# working rule: decision 9 also wants an author who did not write the patch and works from the quoted text alone, legal and
# illegal fixtures, and a run on unpatched main first. `not_detectable_yet` and `hold` repeat the manifest. The lead's
# decisions are in designs/lead-decisions.md, outside this repository.
#
# Count (2026-11-25). Eight rows have nothing in their manifest that keeps a hit from counting, except the plan record
# below: 2, 3, 5, 6, 9, 11, 13, 16. Row 5 only through QueueRetention. Row 3 only through the retry rule, not through a
# deadline. Rows 3 and 11 also need `record --never-searched` for an earlier plan before a [detection] can count. Seven
# rows are held: 4, 7, 10, 14, 15, 19, 20. Two patches are partial: 17, 18. One is not sensitive: 22. Rows 1, 8, 12, 21
# (and 7, 14, 22) have no rule. Row 15 is blocked, row 4 has an open split finding and 19 looks unreachable (read, not
# run). No resource-release-order row (19 to 22) can count. Each of the four sets holds a row with an empty `expect`, so
# its check fails and cannot pass. The bar is 15.
#
# reach: reachable (workload only), needs-workload, needs-client, needs-invariant, needs-probe,
# needs-trigger, needs-fault, needs-hook, narrower or partly (than the original defect), nightly,
# blocked (by a missing seam or an open finding), unreachable (through the product core).

