# What each phase 11 reverted fix needs from the simulator before a search can count (P11-BUGS).
# Nothing here is a detection. `faults` names the schedule, `trigger` the protocol point to place it at,
# `rules` the names in the manifest's `expect` with their source text, and `gaps` what the simulator or the
# design lacks today.
#
# `sensitivity` is the independent review's word (PR #121, 2026-11-24): sensitive, partial or not sensitive. The runs are
# in the manifests. A partial patch cannot count for the bar (amendment to lead decision 9).
#
# `rules` holds only what lead decision 9 and its amendments allow: the rules design 4.2 names for the row, except where
# decision 9 rules them out, and the replacements it permits. A rule without text to quote is left out. `text` is a literal
# quote of `file`. designs/ is outside this repository. A name here is not a working rule: decision 9 also wants an author
# who did not write the patch and works from the quoted text alone, legal and illegal fixtures, and a run on unpatched
# main first. Not detectable yet rows say so in `not_detectable_yet`.
#
# Count (2026-11-24). 15 rows have a rule: 2, 3, 4, 5, 6, 9, 10, 11, 13, 15, 16, 17, 18, 19, 20. 13 of them have a sensitive
# patch, because 17 and 18 are partial. 12 of those 13 remain without 19, which looks unreachable: 2, 3, 4, 5, 6, 9, 10, 11,
# 13, 15, 16, 20. Of the 12, 4 and 15 are blocked. Seven rows have no rule: 1, 7, 8, 12, 14, 21, 22. The bar is 15.
#
# reach: reachable (workload only), needs-workload, needs-client, needs-invariant, needs-probe,
# needs-trigger, needs-fault, needs-hook, narrower or partly (than the original defect), nightly,
# blocked (by a missing seam or an open finding), unreachable (through the product core).

