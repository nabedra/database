# Reverted fix FIXC-owner-fence (phase 11, design section 4.2, row 12).
schema = "nabedra.sim-bug/1"
id = "fixc-owner-fence"
bug = "FIXC-owner-fence"
set = "queued"
phase = 11
class = "fence-lifecycle-order"
guarantees = ["OLTP-G02", "OLTP-G07"]
scenarios = ["O08", "R01"]
fix_commits = ["c7b93782a1e9bf4802d3e0dd046ee6725d5616b1", "4287df8234a38854edf7e54e1e42cd460f1c551a"]
reverts = "4287df8234a38854edf7e54e1e42cd460f1c551a"
port = "hand"
port_notes = """
4287df82 reversed at its two decision points, after c7b93782's follow-up: TransactionCoordinator::recover_queued
always abandons an attempt of a fenced owner, and Status refuses RetrySnapshot unless the attempt was
created by the current authority. The helper signatures stay. The library test proves the Status hunk. The
retained-restart process suite proves the runtime hunk: with the patch its fenced mutation ended as a failed
receipt, conflict `original execution authority was fenced` (run 45440132415); it passes without
(run 45440153575). O08 passed with the patch.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults and trigger, and what is missing.
workload = "queued"
profile = ["owner-kill", "prepared-hold"]
# expect: only rules lead decision 9 allows, with their source text (designs/ is outside this repository).
#   Empty. Not detectable yet, and does not count (lead, 2026-11-24). Decision 9 names only this text for
#     AcceptedSettlesInRun: docs/testing/scheduler-contract.md, "Retain accepted work through individual failures while
#     a request copy survives.", and docs/testing/guarantees/oltp.md, OLTP-G07, "Accepted queued work stays recoverable
#     while a complete copy survives. A full worker stop abandons outstanding work." Neither sentence says accepted work
#     cannot end in a definite refusal, which is what the patched build gives: a receipt that failed with the conflict
#     `original execution authority was fenced`.
expect = []
seeds = [1, 10000]

[regression]
kind = "lib-test"
test = "oltp_replication::authority::status::identity::tests::o10_o14_r01_q06_fenced_retry_abort_requires_exact_settlement"
mode = "on"
failure_contains = ["expected retry abort, got Rejected(InvalidBinding)"]

# The patch author's own runs.
[regression.evidence]
digest = "919565cb643c1ba88338c5eddacf1cd5cac017638726187fffc9fce3e989ed40"
clean = { run = "https://github.com/zPy52/nabedra-database/actions/runs/45435450471", sha = "b0a6d0573cba411b762e8c4e544431710003576b", result = "passed", note = "request p11-bugs-clean-b0a6d05-171752, o10_o14_r01_q06_fenced_retry_abort_requires_exact_settlement, 3 of 3 attempts, on mode, over main c8426fe1" }
patched = { run = "https://github.com/zPy52/nabedra-database/actions/runs/45436022495", sha = "08fafb0a3343878b6a8ed9e2a179268853dfb157", result = "failed", note = "request p11-bugs-fixc-owner-fence-08fafb0-172046, o10_o14_r01_q06_fenced_retry_abort_requires_exact_settlement, 1 of 1 attempts, on mode, over main c8426fe1", output = """
expected retry abort, got Rejected(InvalidBinding)
test result: FAILED. 0 passed; 1 failed; 0 ignored; 0 measured; 193 filtered out; finished in 0.38s
""" }

