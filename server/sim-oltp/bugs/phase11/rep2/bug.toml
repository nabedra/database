# Reverted fix REP2 (phase 11, design section 4.2, row 14).
schema = "nabedra.sim-bug/1"
id = "rep2"
bug = "REP2"
set = "membership"
phase = 11
class = "membership-replacement-trust"
guarantees = ["OLTP-G08"]
scenarios = ["O17", "NS14"]
fix_commits = ["116fb51dd377611f0a53642fe68e1bb4f742da7d"]
reverts = "116fb51dd377611f0a53642fe68e1bb4f742da7d"
port = "hand"
port_notes = """
116fb51d reversed in manager/lifecycle.rs with its later signatures: reconcile_voter_replacement accepts any
stable membership equal to `next` without checking which voter the plan removes, and replace_damaged_voter
certifies the named removal from the current voter set, ignoring the durable plan and joint consensus.
retain_removed (REP5, REP6) keeps its values.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults, trigger and invariant, and what is missing.
workload = "membership"
profile = ["replacement", "leader-crash", "lost-reply"]
expect = ["Liveness", "RetryCertifiesNamedRemoval"]
seeds = [1, 10000]

[regression]
kind = "lib-test"
test = "oltp_replication::typed_network::tests::o06_o16_o17_rf3_lost_timestamp_voter_replacement"
mode = "on"
failure_contains = ["stable membership must not certify a different removal"]
