port = "hand"
port_notes = """
116fb51d reversed in manager/lifecycle.rs with its later signatures: reconcile_voter_replacement accepts any
stable membership equal to `next` without checking which voter the plan removes, and replace_damaged_voter
certifies the named removal from the current voter set, ignoring the durable plan and joint consensus.
retain_removed (REP5, REP6) keeps its values.
"""
# The phase 11 workloads do not exist yet: workload, profile and expect are what this patch needs,
# not a detection. ../simulator.toml says which faults and trigger, and what is missing.
workload = "membership"
profile = ["replacement", "leader-crash", "lost-reply"]
# Lead decisions are in designs/lead-decisions.md, outside this repository.
expect = []
expect_reason = """\
Lead decision 9, count after review-121: "Rows 1, 7, 8, 14, 22 have no rule". Decision 13.1: "Decision 9 counts \
design rules only for the rows it names (6, 9, 20 and the Liveness rows listed there), not for 7 or 14." Design \
3.7 lists RetryCertifiesNamedRemoval by name only.\
"""
hold = """\
Row 14. Lead decision 13.1: "Decision 9 counts design rules only for the rows it names (6, 9, 20 and the \
Liveness rows listed there), not for 7 or 14." The tool knows no row and would take a design rule from \
plans/testing/phase-10-11-oltp-sim.md. RetryCertifiesNamedRemoval also looks unreachable through the API (read \
by author and reviewer, not run).\
"""
