# Reverted fix BUG1-d04, the D04 lost responder (phase 10, design section 4.1).
schema = "nabedra.sim-bug/1"
id = "bug1-d04"
bug = "BUG1-d04"
set = "direct"
phase = 10
class = "uncertain-outcome"
guarantees = ["OLTP-G01", "OLTP-G03", "OLTP-G04"]
scenarios = ["D04", "O10"]
fix_commits = ["259da02c2369527ebce3d292dac83dd5ffad2d71", "d7b9d63c3d548e7f694d077aec3d3d4743cdb1c2"]
reverts = "259da02c2369527ebce3d292dac83dd5ffad2d71"
port = "hand"
port_notes = """
The 259da02c executor hunks conflict with HEAD. This ports the pre-fix design into
server/src/oltp_runtime/direct/executor.rs: only the leader holds the uncertainty. A proposal of
unknown outcome sets a request-local `uncertain` flag (in mutate across its RD1 schema retries, and
in forward_admitted) and retries locally with RetryCause::Leadership, instead of returning
outcome_unknown at once. While the flag is set, deadline exits answer outcome_unknown through the
restored deadline_expired(uncertain), not_leader_or(handle, uncertain) answers outcome_unknown when
no other node leads, and full-device or reservation refusals retry instead of answering. The bug is
the one the fix removed: a leader that steps down after applying redirects (NotLeader), and the
gateway follows it without the uncertainty. A review replaced the first port, which returned Ok(())
for every error and so also answered unavailable_not_applied at the deadline after an uncertain
proposal, a stronger bug than the original that a deadline-edge seed could find without the D04
redirect.
"""
workload = "direct"
# drain-leader between Applied and the reply, and crash-leader.
profile = ["drain-leader", "crash-leader"]
expect = ["NotAppliedNeverCommitted"]
seeds = [1, 10000]

[regression]
kind = "lib-test"
test = "oltp_runtime::direct::tests::d04_o10_bug1_leader_shutdown_after_apply_preserves_proposal_uncertainty"
mode = "on"
failure_contains = ["NotLeader { hint:"]

