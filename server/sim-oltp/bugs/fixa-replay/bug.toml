# Reverted fix FIXA-replay (phase 10, design section 4.1).
schema = "nabedra.sim-bug/1"
id = "fixa-replay"
bug = "FIXA-replay"
set = "direct"
phase = 10
class = "uncertain-outcome"
guarantees = ["OLTP-G03", "OLTP-G04"]
scenarios = ["D02"]
fix_commits = ["443322361d89d5f3de5dd06632f09e4a14dd8fec"]
reverts = "443322361d89d5f3de5dd06632f09e4a14dd8fec"
port = "clean"
port_notes = """
`git diff 44332236 44332236^` on server/src/oltp_runtime/direct/executor.rs: back to
`Committed::Replayed(Some(result))` plus `Committed::Replayed(None) => Retry(Conflict)`, so a batch
replay within one RETRY_PAUSE of the deadline answers unavailable_not_applied.
"""
workload = "direct"
# data.direct.batch on, concurrent writers on one range, lost-reply plus deadline-edge.
profile = ["batch", "same-range-writers", "lost-reply", "deadline-edge"]
expect = ["NotAppliedNeverCommitted", "failed-write-observed"]
seeds = [1, 10000]

[regression]
kind = "lib-test"
test = "oltp_runtime::direct::tests::fixa::d02_fixa_batch_replay_near_deadline_preserves_the_committed_outcome"
mode = "on"
failure_contains = ["an applied batch replay must return its result or an unknown outcome"]

[regression.evidence]
digest = "8ce2dcc915f0141bf4efdd27cf8a769596641a0b3de5643ef557b801532c3960"
clean = { run = "https://github.com/zPy52/nabedra-database/actions/runs/45413905217", sha = "5953e85183f733a73658dc75ef9cd10d8c21e5cc", result = "passed", note = "check oltp-sim-bugs-regression, request p10-bugs-5953e85-152526, direct_oltp on" }
patched = { run = "https://github.com/zPy52/nabedra-database/actions/runs/45413905217", sha = "5953e85183f733a73658dc75ef9cd10d8c21e5cc", result = "failed", note = "check oltp-sim-bugs-regression, request p10-bugs-5953e85-152526, direct_oltp on; patch applied to this SHA in a scratch worktree", output = """
an applied batch replay must return its result or an unknown outcome: Failed(ProtocolError { code: StorageUnavailable, message: "direct request deadline expired before it applied", outcome: NotApplied })
test result: FAILED. 0 passed; 1 failed; 0 ignored; 0 measured; 196 filtered out; finished in 0.93s
fixa-replay: with the patch failed; verified (digest 8ce2dcc915f0141bf4efdd27cf8a769596641a0b3de5643ef557b801532c3960)
""" }

# Transcribed from that review. It applied the patch itself and ran the named test with and without it, locally and
# unattested. The assertion type is P10-BUGS-2's reading of the failure text, not the review's word.
[review]
verdict = "sensitive"
assertion = "state"
reviewer = "Claude Opus 5.5 (LAND-113, independent review of PR #113, wrote none of it)"
source = "https://github.com/zPy52/nabedra-database/pull/113, review of heads 67ea0db3 and 90b869b3"
notes = "The replayed batch answers NotApplied for an applied mutation with the patch."
