# Reverted fix ACC3-cold-fence, ACC3 O15 (phase 10, design section 4.1).
schema = "nabedra.sim-bug/1"
id = "acc3-cold-fence"
bug = "ACC3-cold-fence"
set = "direct"
phase = 10
class = "fence-lifecycle-order"
guarantees = ["OLTP-G07"]
scenarios = ["O15", "R04"]
fix_commits = ["6cf032792e7ed01c97e01c16a31f0adc8478ee95"]
reverts = "6cf032792e7ed01c97e01c16a31f0adc8478ee95"
port = "clean"
port_notes = """
`git diff 6cf03279 6cf03279^` on server/src/oltp_replication/service_rpc.rs: deletes the
Client match arm that retries the other verified voters when a ParticipantFence is PeerRejected
with placement_rejected_before_execution, so cold fencing gives up while a voter reopens.
"""
workload = "cold"
profile = ["staggered-reopen"]
# Cold start does not finish within 120 s; a worker exits on the refusal.
expect = ["Liveness"]
seeds = [1, 10000]

[regression]
# The fix added no unit test; the bug record's lowest regression is the O15 acceptance scenario.
kind = "acceptance"
scenario = "O15"
mode = "on"
timeout_s = 3600
failure_contains = ["registered startup ValidationError: worker does not host target replica node", "AssertionError: ['RF3 cold run']"]
# O15 caught this patch in 1 of 5 patched runs: run 45148928008 (on failed, off passed) and 0 of 3
# attempts in the oltp-sim-bugs-regression run 45150522656. After the crate split it caught it in
# 0 of 10 attempts at 5953e85 (oltp-sim-bugs-regression-acc3, run 45413905217), while all 10
# unpatched attempts passed: 1 of 18 in all. The patch still removes the retry (the refusal then
# reaches the generic transport arm, which returns it), but only a replica that has not reopened
# when the fence arrives exposes it. O15 cannot gate it; the cold workload's seed search must.
attempts = 10

[regression.evidence]
