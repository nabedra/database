# Reverted fix ACC3-cold-fence, ACC3 O15 (phase 10, design section 4.1).
schema = "nabedra.sim-bug/1"
id = "acc3-cold-fence"
bug = "ACC3-cold-fence"
set = "direct"
phase = 10
class = "fence-lifecycle-order"
guarantees = ["OLTP-G07"]
scenarios = ["O15", "R04"]
fix_commits = ["6cf032792e7ed01c97e01c16a31f0adc8478ee95"]
reverts = "6cf032792e7ed01c97e01c16a31f0adc8478ee95"
port = "clean"
port_notes = """
`git diff 6cf03279 6cf03279^` on server/src/oltp_replication/service_rpc.rs: deletes the
Client match arm that retries the other verified voters when a ParticipantFence is PeerRejected
with placement_rejected_before_execution, so cold fencing gives up while a voter reopens.
"""
workload = "cold"
profile = ["staggered-reopen"]
# Cold start does not finish within 120 s; a worker exits on the refusal.
expect = ["Liveness"]
seeds = [1, 10000]

[regression]
# The fix added no unit test; the bug record's lowest regression is the O15 acceptance scenario.
kind = "acceptance"
scenario = "O15"
mode = "on"
timeout_s = 3600
failure_contains = ["registered startup ValidationError: worker does not host target replica node", "AssertionError: ['RF3 cold run']"]
# This patch is NOT shown to be sensitive: O15 is a timing window and no test has failed because of
# the patch since the crate split.
# - Before it: 1 of at most 5 patched runs failed (run 45148928008 failed with direct_oltp on at
#   3998c378 with "worker does not host target replica node", and passed with it off; run
#   45150522656 allowed 3 attempts, none failed and the last passed, and its log did not list them).
#   The clean run was 45148935717 at 53a5716f.
# - After it: oltp-sim-bugs-regression-acc3 at 5953e85 (run 45413905217) allowed 10 attempts and
#   none failed. The unpatched side passed all 10. That run's log did not list the patched
#   attempts, so it shows no failure and a passing last attempt, not ten passes. Run 45422532178
#   at a7292e3 listed every attempt: 10 of 10 patched and 10 of 10 unpatched passed.
# The old runs are not recorded as [regression.evidence]: their digest was for the old path, and
# the re-verification that would justify a new one did not fail. `check` accepts a clean port
# without evidence. By lead decision 8 a simulator hit on this patch does not count until a test
# fails because of it. sim_bugs.py run does not enforce that yet.
attempts = 10
