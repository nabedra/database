# Reverted fix AZ2 (phase 10, design section 4.1).
schema = "nabedra.sim-bug/1"
id = "az2"
bug = "AZ2"
set = "direct"
phase = 10
class = "membership-replacement-trust"
guarantees = ["OLTP-G08"]
scenarios = ["O26"]
fix_commits = ["2df6cd9aefeeeed22d56a2c5cf87cebded9f54df"]
reverts = "2df6cd9aefeeeed22d56a2c5cf87cebded9f54df"
port = "hand"
port_notes = """
The fix conflicts in five files. This ports its decision point, raft_sender in
server/src/oltp_replication/typed_network.rs: `if replaying_history || membership...` goes back to
`if membership.nodes().next().is_none()`, so a learner replaying a historical membership refuses
bootstrap voters it does not list ("sender is outside enrolled replica membership"). The
catch_up_before plumbing stays and `replaying_history` becomes an unused variable (a warning).
"""
workload = "move"
# Delay on the old voters, so the learner replays history after the sender is published.
profile = ["delay-old-voters"]
expect = ["Liveness"]
seeds = [1, 10000]

[regression]
kind = "lib-test"
test = "oltp_replication::typed_network::tests::o26_learner_accepts_current_leader_while_replaying_historical_membership"
mode = "on"
failure_contains = ["left: None", "right: Some(ReplicaMember { node_id: 4"]

