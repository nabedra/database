<text x="190.0" y="235" font-size="14">17.5</text>
<rect x="475" y="219" width="248.0" height="22" fill="#2f7867"/>
<text x="732.0" y="235" font-size="14">2091.9</text>
<text x="26" y="280" font-size="13">64 warm-up events and three rounds of 256 events per run. Three- and six-broker runs both use RF3.</text>
