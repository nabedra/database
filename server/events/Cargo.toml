[package]
name = "nabedra-events"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
axum-server = { version = "=0.9.2", default-features = false, features = ["tls-rustls"] }
base64 = "0.22.1"
bytes = "1"
clap = { version = "=4.6.7", features = ["derive"] }
fs2 = "0.4.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12.1"
openraft = { version = "=0.9.25", default-features = false, features = ["generic-snapshot-data", "serde", "storage-v2"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["http2", "json", "rustls", "stream"] }
rocksdb = { version = "=0.25.0", default-features = false, features = ["bindgen-runtime"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3"
thiserror = "2"
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "=1.54.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time", "net", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "=0.5.3", features = ["util", "limit", "load-shed", "timeout"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
uuid = { version = "=1.29.2", features = ["serde", "v4"] }
