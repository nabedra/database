[package]
name = "nabedra-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Nabedra wire protocol, request validation and shared query semantics"
license = "MIT"
repository = "https://github.com/nabedra/database"
publish = ["crates-io"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "arbitrary_precision"] }
sha2 = "=0.11.1"
uuid = { version = "=1.29.2", features = ["serde"] }
