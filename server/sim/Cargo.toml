[package]
name = "nabedra-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Nabedra's deterministic simulation core: trace hash, network plan, nemesis, Raft observer, seed sweep and shrinking"
license = "MIT"
repository = "https://github.com/nabedra/database"
# Dev-only. No product crate depends on it, and it depends on no product crate.
publish = false

[lib]
name = "nabedra_sim"

[dependencies]
nabedra-rt = { path = "../rt", version = "0.1.0", features = ["sim"] }
nabedra-check = { path = "../check" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time"] }
uuid = "=1.29.2"
serde_json = "=1.0.154"

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt", "time", "sync"] }

[lints.rust]
# `--cfg tokio_unstable` is set through RUSTFLAGS for simulation builds only; it enables
# `Builder::rng_seed`, so `select!` branch order follows the seed.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
