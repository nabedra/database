[package]
name = "nabedra-vector"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Nabedra's search index: partitions, codes, scans and checkpoints"
license = "MIT"
repository = "https://github.com/zPy52/nabedra-database"
publish = ["crates-io"]

[dependencies]
nabedra-rt = { path = "../rt", version = "0.1.0" }
nabedra-simd = { path = "../simd", version = "0.1.0" }
# Full-text analysis: word boundaries (UAX #29), NFC and Snowball stemmers. They decide the terms
# of a text, so a new version of any of them, or of its Unicode data, or a change to the table of
# format characters in `text`, bumps `VERSION` or `PREPARATION` there, and old checkpoints are
# refused instead of misread.
unicode-segmentation = "=1.13.3"
unicode-normalization = "=0.1.26"
rust-stemmers = "=1.2.0"

[dev-dependencies]
nabedra-check = { path = "../check" }
# The reference of the BM25 differential (VS tests of `impact`). Tests only.
tantivy = { version = "=0.27.0", default-features = false }
