[package]
name = "nabedra-database"
version = "0.1.1"
edition = "2024"
rust-version = "1.94.1"
description = "Database with mutually exclusive OLAP, OLTP, and native cache server builds"
license = "MIT"
repository = "https://github.com/zPy52/nabedra-database"
readme = "README.md"
keywords = ["database", "olap", "oltp", "distributed", "storage"]
categories = ["database", "command-line-utilities"]
publish = ["crates-io"]
include = ["/src/", "/tests/", "/examples/", "/Cargo.lock", "/README.md", "/LICENSE*"]

[workspace]
# `nabedra-kv` builds and tests alone: `cargo test -p nabedra-kv`.
members = [".", "kv"]
exclude = ["events"]

[lib]
name = "nabedra_database_server"

[[bin]]
name = "nabedra-db"
path = "src/main.rs"

[features]
default = ["olap", "s3"]
olap = ["dep:arrow-array", "dep:arrow-ipc", "dep:arrow-schema", "dep:parquet"]
oltp = ["dep:nabedra-kv", "dep:openraft", "dep:tokio-rustls", "dep:socket2"]
cache = ["dep:clock-bound-client", "dep:hashbrown", "dep:smallvec", "dep:toml", "dep:openraft", "dep:tokio-rustls"]
oltp-backup-s3 = ["oltp", "s3"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-smithy-http-client"]

[dependencies]
ring = "=0.17.14"
sha2 = "=0.11.1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
axum-server = { version = "=0.9.2", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
http-body-util = "=0.1.5"
mime = "=0.3.18"
tracing = "=0.1.44"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "arbitrary_precision"] }
uuid = { version = "=1.29.2", features = ["serde", "v4"] }
# The SDK's default HTTPS client uses aws-lc; ring is the only TLS provider, so
# the S3 clients get an explicit rustls + ring client (`crate::aws_http`).
aws-config = { version = "=1.13.1", optional = true, default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "=1.158.0", optional = true, default-features = false, features = ["sigv4a", "http-1x", "rt-tokio"] }
aws-smithy-http-client = { version = "=1.5.2", optional = true, default-features = false, features = ["rustls-ring"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "io-util"] }

arrow-array = { version = "=60.1.0", optional = true }
arrow-schema = { version = "=60.1.0", optional = true }
parquet = { version = "=60.1.0", optional = true, default-features = false, features = ["arrow"] }
openraft = { version = "=0.10.0", optional = true, default-features = false, features = ["tokio-rt", "serde"] }
tokio-rustls = { version = "=0.26.6", optional = true, default-features = false, features = ["tls12", "ring"] }
# Already in the tree through tokio; used only to enable TCP keepalive.
socket2 = { version = "=0.6.5", optional = true }
bytes = "=1.12.1"
nabedra-kv = { path = "kv", version = "0.1.0", optional = true }
hashbrown = { version = "=0.17.1", default-features = false, optional = true }
smallvec = { version = "=1.16.5", optional = true }
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde"], optional = true }

# Cached HTTP transport; explicit TLS, no proxy or retry middleware.
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "ring"] }
tokio-util = { version = "=0.7.20", features = ["io"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

[dependencies.arrow-ipc]
version = "=60.1.0"
optional = true

[target.'cfg(target_os = "linux")'.dependencies]
clock-bound-client = { version = "=2.0.3", optional = true }

[target.'cfg(unix)'.dependencies]
# Bounded startup material reads use O_NONBLOCK before opened-handle validation.
libc = "=0.2.191"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
tower = { version = "=0.5.3", features = ["util"] }
http-body = "=1.1.0"

# Local edit loop (plans/fast-builds.md, BLD2). Line tables keep file:line in
# backtraces with smaller objects and faster links than full debug info.
# CI overrides debug info to 0 through CARGO_PROFILE_DEV_DEBUG.
[profile.dev]
debug = "line-tables-only"

# Dependencies are not stepped through in a debugger.
[profile.dev.package."*"]
debug = false

