[package]
name = "nabedra-rt"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Nabedra's runtime seam: clock, task spawning, ids and the filesystem, with a deterministic simulation mode"
license = "MIT"
repository = "https://github.com/zPy52/nabedra-database"
publish = ["crates-io"]

[lib]
name = "nabedra_rt"

[features]
# Deterministic simulation: per-node clocks, seeded ids, a per-node task registry and
# inline blocking work. Never enable it in a product build; `server/src/main.rs` refuses
# to compile with it.
sim = ["tokio/test-util", "net", "tokio/sync", "tokio/macros"]
# The network seam: listener, connector and stream traits over tokio TCP. Off by default
# so crates that never touch the network (nabedra-kv, Events) keep their graph.
net = ["tokio/net"]
# openraft 0.10's runtime on the simulated node context (`sim::openraft10`). Sim only; the
# three crates are already in the product graph through openraft at these versions.
sim-openraft = ["sim", "dep:openraft-rt", "dep:openraft-rt-tokio", "dep:rand"]

[dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time"] }
uuid = { version = "=1.29.2", features = ["v4"] }
openraft-rt = { version = "=0.10.0", optional = true }
openraft-rt-tokio = { version = "=0.10.0", optional = true }
rand = { version = "=0.10.4", default-features = false, optional = true }

# `RealFs` (flock, fallocate, posix_fadvise) and `FaultFs`'s errno values, at the version
# nabedra-kv already pins, so no crate enters the graph.
[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", default-features = false }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt", "rt-multi-thread", "time", "test-util", "net", "io-util"] }

[lints.rust]
# Simulation builds may pass `--cfg tokio_unstable` (see `sim::runtime_seeded`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
