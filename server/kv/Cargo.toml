[package]
name = "nabedra-kv"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Nabedra's in-tree storage engine: an LSM with a group-committed journal"
license = "MIT"
repository = "https://github.com/nabedra/database"
publish = ["crates-io"]

[features]
# Deterministic simulation (phase 9): forwards to nabedra-rt/sim, so the journal, flush and
# compaction services are stepped by a simulated world instead of running as threads.
# Never part of a product build; the server enables it only through its own sim feature.
sim = ["nabedra-rt/sim"]

[dependencies]
bytes = "=1.12.1"
nabedra-rt = { path = "../rt", version = "0.1.0" }
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
