[package]
name = "nabedra-oltp-replication"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/nabedra/database"
publish = ["crates-io"]
description = "Nabedra OLTP replication"

[features]
sim = ["nabedra-rt/sim", "nabedra-rt/sim-openraft", "nabedra-transport/sim", "nabedra-oltp-storage/sim", "nabedra-oltp-types/sim"]
test-hooks = ["nabedra-oltp-storage/test-hooks", "nabedra-resources/test-defaults", "nabedra-resources/test-hooks", "nabedra-transport/test-hooks"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-smithy-http-client"]

[dependencies]
nabedra-rt = { path = "../rt", version = "0.1.0" }
nabedra-protocol = { path = "../protocol", version = "0.1.0" }
nabedra-resources = { path = "../resources", version = "0.1.0" }
nabedra-oltp-types = { path = "../oltp-types", version = "0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "arbitrary_precision"] }
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "io-util"] }
tracing = "=0.1.44"
uuid = { version = "=1.29.2", features = ["serde", "v4"] }
nabedra-kv = { path = "../kv", version = "0.1.0" }
bytes = "=1.12.1"
nabedra-transport = { path = "../transport", version = "0.1.0" }
nabedra-oltp-storage = { path = "../oltp-storage", version = "0.1.0" }
openraft = { version = "=0.10.0", default-features = false, features = ["tokio-rt", "serde"] }
aws-config = { version = "=1.13.1", optional = true, default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "=1.158.0", optional = true, default-features = false, features = ["sigv4a", "http-1x", "rt-tokio"] }
aws-smithy-http-client = { version = "=1.5.2", optional = true, default-features = false, features = ["rustls-ring"] }

ring = "=0.17.14"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
nabedra-oltp-storage = { path = "../oltp-storage", version = "0.1.0", features = ["test-hooks"] }
nabedra-resources = { path = "../resources", version = "0.1.0", features = ["test-defaults", "test-hooks"] }
nabedra-transport = { path = "../transport", version = "0.1.0", features = ["test-hooks"] }
tokio = { version = "=1.54.1", features = ["test-util"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
