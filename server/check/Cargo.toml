[package]
name = "nabedra-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Nabedra's in-tree test harness: seeded generators, shrinking, config randomizer, evidence records"
license = "MIT"
repository = "https://github.com/zPy52/nabedra-database"
publish = false

[lib]
name = "nabedra_check"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
