# Crate graph rules for the phase 8 split. Read by scripts/testing/crate_graph.py and the
# `crate-graph` check (docs/testing/checks/crate-graph.toml).
#
# The split is a proposal until each phase 8 PR lands: packages listed here that do not exist yet
# are the planned crates, and their rules start to bite when they appear in the workspace.

# Layers, lowest first. Every dependency (normal, build or dev) of a workspace package must point
# to a package in a strictly lower layer. Packages in one layer are siblings and may not depend on
# each other (transport and storage, for example). A workspace package without a layer fails.
[[layer]]
name = "runtime"
packages = ["nabedra-rt"]

[[layer]]
name = "harness"
packages = ["nabedra-check"]

[[layer]]
name = "simulation"
packages = ["nabedra-sim"]

[[layer]]
name = "protocol"
packages = ["nabedra-protocol", "nabedra-kv"]

[[layer]]
name = "resources"
packages = ["nabedra-resources"]

[[layer]]
name = "oltp-types"
packages = ["nabedra-oltp-types"]

[[layer]]
name = "transport-and-storage"
packages = ["nabedra-transport", "nabedra-oltp-storage"]

[[layer]]
name = "replication"
packages = ["nabedra-oltp-replication"]

[[layer]]
name = "server"
packages = ["nabedra-database"]

# Top-level modules of the server crate and the package their code moves to. The ratchet counts
# literal `crate::<dst>` references (phase 8 design, 2.1) from each mapped module into a module of
# a higher layer. Modules not listed stay in `default`, the top of the graph.
[modules]
root = "server/src"
default = "nabedra-database"

[modules.layer]
protocol = "nabedra-protocol"
migration_interchange = "nabedra-protocol"
query_semantics = "nabedra-protocol"
scheduling = "nabedra-resources"
oltp = "nabedra-oltp-storage"
oltp_replication = "nabedra-oltp-replication"
oltp_deployment = "nabedra-oltp-replication"
oltp_backup_repository = "nabedra-oltp-replication"
oltp_runtime = "nabedra-database"

# The planned package edges (phase 8 design, 3.1). The planted-cycle cases build stub workspaces
# from them, with no registry crates, so `cargo metadata` needs no network.
[planned.nabedra-rt]

[planned.nabedra-check]

[planned.nabedra-sim]
normal = ["nabedra-rt", "nabedra-check"]

[planned.nabedra-kv]
normal = ["nabedra-rt"]

[planned.nabedra-protocol]

[planned.nabedra-resources]
normal = ["nabedra-rt", "nabedra-protocol"]
dev = ["nabedra-check"]

[planned.nabedra-oltp-types]
normal = ["nabedra-protocol", "nabedra-resources"]

[planned.nabedra-transport]
normal = ["nabedra-rt", "nabedra-protocol", "nabedra-resources", "nabedra-oltp-types"]

# Storage is extracted. Cargo enforces its dependencies and the source plant below
# exercises the unresolved upward import in the real crate.
[planned.nabedra-oltp-storage]
normal = ["nabedra-rt", "nabedra-kv", "nabedra-protocol", "nabedra-resources", "nabedra-oltp-types", "nabedra-sim"]
dev = ["nabedra-resources"]

[planned.nabedra-oltp-replication]
normal = [
  "nabedra-rt", "nabedra-kv", "nabedra-protocol", "nabedra-resources", "nabedra-oltp-types",
  "nabedra-transport", "nabedra-oltp-storage",
]

[planned.nabedra-database]
normal = [
  "nabedra-rt", "nabedra-kv", "nabedra-protocol", "nabedra-resources", "nabedra-oltp-types",
  "nabedra-transport", "nabedra-oltp-storage", "nabedra-oltp-replication",
]
dev = ["nabedra-check", "nabedra-oltp-storage"]

# The upward edge the planted cases add: storage naming replication.
[plant]
package = "nabedra-oltp-storage"
dependency = "nabedra-oltp-replication"
# Case 5 runs once this file exists: it appends `use <crate> as _;` and requires E0432 or E0433.
lib = "server/oltp-storage/src/lib.rs"
crate = "nabedra_oltp_replication"

# Case 6: every `impl ...Proof for` block lives in the replication crate, so lower crates can take
# a proof by trait but never forge one. The case runs once `requires` exists.
[proofs]
requires = "server/oltp-replication/src/oltp_replication/mod.rs"
allowed = ["server/oltp-replication/"]
scan = ["server"]

# These capabilities are created by the runtime that owns the request gate or RAM copy.
[proofs.runtime_allowed]
NeverAcceptedAdmission = "server/src/oltp_runtime/worker_runtime.rs"
QueueCopySource = "server/src/oltp_runtime/replica.rs"

# BEGIN ratchet (generated by `python3 scripts/testing/crate_graph.py ratchet --write`)
# References from each mapped module into a module of a higher layer. `*` is every unmapped
# module of the server crate. A count may fall but never rise, and a pair at 0 stays at 0.
# `literal` counts `crate::<module>` tokens with comments (the design's 2.1 method); `expanded`
# strips comments and expands grouped imports, so `use crate::{a::B}` cannot hide an edge.
[ratchet]
sha = "148ed66e6ad298f3f107147a2c3813f8c0bc9aec"

