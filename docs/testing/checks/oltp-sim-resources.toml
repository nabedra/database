id = "oltp-sim-resources"
module = "oltp"
kinds = ["S", "H"]
# Fault model. The `resources` overlay of phase 11 on `direct`, `cold` and `move`: client
# requests are cut, the admission limits are filled and shed, and workers stall and drain during
# work. ExactlyOnceRelease, ReleaseAfterWork and ResourceBaseline are judged, and a quiet stage
# with cuts must leave every ledger where it was. Every seed runs twice, in a process of its own,
# because a seed can wedge (it has no verdict then) and must not take the others with it. The
# check passes only if every seed ran, passed and replayed. It is red on unpatched main: no red is
# allowed or narrowed here.
guarantees = ["OLTP-G09"]
scenarios = []
tiers = ["T2"]
command = ["bash", "-euc", '''
build=(cargo test --locked --release -p nabedra-sim-oltp --lib)
"${build[@]}" --no-run
"${build[@]}" -- --test-threads=2 invariants:: workloads:: nemesis::
artifacts=$NABEDRA_SIM_ARTIFACTS
run=0 red=0 none=0
for seed in $(seq 1 16); do
    log=$(mktemp)
    status=0
    NABEDRA_SEED=$seed NABEDRA_SIM_ARTIFACTS=$artifacts/seed-$seed timeout 400s "${build[@]}" \
        sweep::tests::sweep -- --exact --nocapture --test-threads=1 >"$log" 2>&1 || status=$?
    cat "$log"
    if ! grep -q '^nabedra-sim-seed: ' "$log"; then
        none=$((none + 1))
        echo "resources seed $seed: no verdict (exit $status)"
    else
        run=$((run + 1))
        if [ "$status" -ne 0 ]; then red=$((red + 1)); fi
    fi
    rm -f "$log"
done
echo "resources overlay: $run of 16 seeds have a verdict, $red red, $none without one"
[ "$run" -eq 16 ] && [ "$red" -eq 0 ]
''']
cwd = "server"
timeout_s = 7200
needs = []
result_parser = "cargo-test"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SIM_WORKLOAD = "resources", NABEDRA_SEEDS = "1", NABEDRA_SIM_JOBS = "1", NABEDRA_SIM_VERIFY_REPLAY = "1.0", NABEDRA_SIM_CHECK_ID = "oltp-sim-resources", NABEDRA_SIM_GUARANTEES = "OLTP-G09", NABEDRA_SIM_ARTIFACTS = "../../target/testing-logs/oltp-sim-resources" }
