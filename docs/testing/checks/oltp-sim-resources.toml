id = "oltp-sim-resources"
module = "oltp"
kinds = ["S"]
guarantees = []
scenarios = []
tiers = ["T2"]
command = ["bash", "-euc", '''
build=(cargo test --locked -j 4 --release -p nabedra-sim-oltp --lib)
"${build[@]}" --no-run
for seed in 9; do
    NABEDRA_SEED=$seed NABEDRA_SIM_ARTIFACTS=../../target/testing-logs/x timeout 150s "${build[@]}" sweep::tests::sweep -- --exact --nocapture --test-threads=1 >diag.log 2>&1 || true
    grep -a "DIAG" diag.log | grep -aE "n2 |n102 |node: 2,|node: 102|deadline|stall" | tail -400
done
exit 1
''']
cwd = "server"
timeout_s = 3600
needs = []
result_parser = "exit-code"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SIM_WORKLOAD = "resources", NABEDRA_SEEDS = "1", NABEDRA_SIM_JOBS = "1", NABEDRA_SIM_VERIFY_REPLAY = "0" }
