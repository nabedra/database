id = "oltp-sim-bugs-az2-1"
module = "oltp"
kinds = ["S", "H"]
# Shard 1 of 8 of the search for az2 (server/sim-oltp/bugs/SHARDS.md): seeds 1 to 1250 on the unpatched build and on the
# patched one. A pass says that the range ran to its end and nothing else: it is no detection and claims no guarantee. The log
# holds one row per seed. `sim_bugs.py merge` and the counting run (oltp-sim-bugs-az2) read it. Dispatch it from the commit it
# tests, or its attestation does not count.
guarantees = []
scenarios = []
tiers = ["T3"]
command = ["python3", "scripts/testing/sim_bugs.py", "shard", "az2", "--shard", "1/8", "--jobs", "4", "--sim-jobs", "4",
           "--time-limit", "17400", "--out", "target/testing-logs/oltp-sim-bugs-az2-1"]
cwd = "."
timeout_s = 18000
needs = []
result_parser = "exit-code"
not_run_marker = "not-run: sim-harness-missing"
env = { RUSTFLAGS = "--cfg tokio_unstable", RUST_MIN_STACK = "16777216" }
