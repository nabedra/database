id = "p11int-res-plants"
# Scratch, never merged. It asserts nothing and always exits 1.
module = "oltp"
kinds = ["S"]
guarantees = []
scenarios = []
tiers = ["T2"]
command = ["bash", "-euc", '''
build=(cargo test --locked -j 4 --release -p nabedra-sim-oltp --lib)
"${build[@]}" --no-run

for s in 1 3 4 7 12; do for p in none double-release double-release-nth lost-release-queue lost-release-result lost-release-nth held-await held-await-permit append-early append-lost append-double admission-bytes admission-slot; do
    NABEDRA_P11RES_PLANT=$p NABEDRA_SIM_PROFILE=none NABEDRA_SIM_WORKLOAD=direct,resources NABEDRA_SEED=$s NABEDRA_SIM_ARTIFACTS=$PWD/pl/$s-$p timeout 200s "${build[@]}" sweep::tests::sweep -- --exact --nocapture --test-threads=1 >log 2>&1 || true
    echo "PLANTED $s $p | $(grep 'nabedra-sim-seed' log | sed 's/.*"kinds":.\([^]]*\).*/KINDS \1/' | head -1) | $(grep -h '^PLANT' log | tail -1) | $(grep -o '"trace_hash": "[0-9a-f]*"' pl/$s-$p/sweep-report.json 2>/dev/null | head -1) | $(grep -oE '(ReleaseAfterWork|ExactlyOnceRelease): [^,]*' log | sort | uniq -c | sort -rn | head -1)"
done; done
for s in 1 3 4 7 12; do grep -h "ReleaseAfterWork:" pl/$s-held-await-permit/*/*tail* 2>/dev/null | head -2 || true; done

exit 1
''']
cwd = "server"
timeout_s = 7200
needs = []
result_parser = "exit-code"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SEEDS = "1", NABEDRA_SIM_JOBS = "1", NABEDRA_SIM_VERIFY_REPLAY = "0" }
