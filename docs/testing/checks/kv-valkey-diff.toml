id = "kv-valkey-diff"
module = "kv"
kinds = ["D"]
guarantees = ["KV-G01", "KV-G02", "KV-G12"]
scenarios = ["K01"]
tiers = ["T1", "T2"]
command = [
    "sh", "-ec",
    'cargo build --no-default-features --features cache && exec python3 ../scripts/cache-acceptance/differential.py --spawn-valkey --nabedra-bin "${CARGO_TARGET_DIR:-target}/debug/nabedra-db" --shrink --history ../target/testing-logs/kv-valkey-diff.jsonl',
]
cwd = "server"
timeout_s = 1800
needs = ["docker"]
result_parser = "exit-code"
