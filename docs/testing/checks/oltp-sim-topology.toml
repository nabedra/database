id = "oltp-sim-topology"
module = "oltp"
kinds = ["S", "H"]
# Fault model. The phase 11 topology workload: splits, moves and leader transfers under load,
# index publication, a table drop, and gateway routes of random age. A scenario is claimed only
# when every one of its clauses ran. Every seed is replayed, and one that completed no client or
# scan work under load is red. A seed whose split does not publish is red.
guarantees = ["OLTP-G02", "OLTP-G03", "OLTP-G06"]
scenarios = []
tiers = ["T1"]
command = ["bash", "-euc", '''
build=(cargo test --locked --release -p nabedra-sim-oltp --lib)
"${build[@]}" --no-run
"${build[@]}" -- --test-threads=2 workloads:: invariants::topology::
report=../target/testing-logs/oltp-sim-topology/sweep-report.json
rm -f "$report"
timeout 1500s "${build[@]}" sweep::tests::sweep -- --exact --nocapture --test-threads=1
# The unit tests above, or a filter that matches nothing, must not pass for the sweep.
python3 -c 'import json, sys
seeds = json.load(open(sys.argv[1]))["seeds"]
sys.exit(0 if len(seeds) == int(sys.argv[2]) else f"the sweep ran {len(seeds)} seeds")' "$report" "$NABEDRA_SEEDS"
''']
cwd = "server"
timeout_s = 4200
needs = []
result_parser = "cargo-test"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SIM_WORKLOAD = "topology", NABEDRA_SEEDS = "24", NABEDRA_SIM_JOBS = "2", NABEDRA_SIM_VERIFY_REPLAY = "1", NABEDRA_SEED = "1", NABEDRA_SIM_CHECK_ID = "oltp-sim-topology", NABEDRA_SIM_GUARANTEES = "OLTP-G02,OLTP-G03,OLTP-G06", NABEDRA_SIM_ARTIFACTS = "../../target/testing-logs/oltp-sim-topology" }
