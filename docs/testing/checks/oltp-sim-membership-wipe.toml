id = "oltp-sim-membership-wipe"
module = "oltp"
kinds = ["S", "H"]
# Fault model. The `wipe` step of `membership` on every seed, without other faults.
guarantees = ["OLTP-G08"]
scenarios = []
tiers = ["T2"]
# Build once. Cluster tests share process-wide budgets, so they run one at a time. The measured
# sweep takes at most 20 minutes. The sweep report must hold every seed of the range.
command = ["bash", "-euc", '''
build=(cargo test --locked -j 2 --release -p nabedra-sim-oltp --lib)
"${build[@]}" --no-run
report=../target/testing-logs/oltp-sim-membership-wipe/sweep-report.json
rm -f "$report"
timeout 1200s "${build[@]}" sweep::tests::sweep -- --exact --nocapture --test-threads=1
python3 -c 'import json, sys
seeds = json.load(open(sys.argv[1]))["seeds"]
sys.exit(0 if len(seeds) == int(sys.argv[2]) else f"the sweep ran {len(seeds)} seeds")' "$report" "$NABEDRA_SEEDS"
''']
cwd = "server"
timeout_s = 4200
needs = []
result_parser = "cargo-test"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SIM_WORKLOAD = "membership", NABEDRA_SIM_MEMBERSHIP = "wipe", NABEDRA_SIM_PROFILE = "none", NABEDRA_SEEDS = "24", NABEDRA_SIM_JOBS = "2", NABEDRA_SIM_VERIFY_REPLAY = "1", NABEDRA_SEED = "1", NABEDRA_SIM_CHECK_ID = "oltp-sim-membership-wipe", NABEDRA_SIM_GUARANTEES = "OLTP-G08", NABEDRA_SIM_ARTIFACTS = "../../target/testing-logs/oltp-sim-membership-wipe" }
