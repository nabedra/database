id = "p10w4-dr"
module = "oltp"
kinds = ["S"]
# Scratch diagnostic, never merged. It prints what each rule reports on the DR schedules and on
# 60 seeds. It asserts nothing, so it always exits 1.
guarantees = []
scenarios = []
tiers = ["T1"]
command = ["bash", "-euc", '''
cargo test --locked -j 2 --release -p nabedra-sim-oltp --lib --no-run
bin=$PWD/$(ls -t target/sim/release/deps/nabedra_sim_oltp-* | grep -v "[.]d$" | head -1)
out=$PWD/../target/testing-logs/p10w4-dr
mkdir -p $out
cd sim-oltp
set +e
for rule in old new; do
  if [ $rule = old ]; then export P10W4_OLD_RULE=1; else unset P10W4_OLD_RULE; fi
  NABEDRA_SIM_ARTIFACTS=$out/$rule timeout 1500 $bin scripted:: --ignored --nocapture --test-threads=1 > $out/dr-$rule.log 2>&1
  NABEDRA_SIM_EXPECT=none-such NABEDRA_SIM_ARTIFACTS=$out/s-$rule NABEDRA_SIM_WORKLOAD=mixed NABEDRA_SEED=1 NABEDRA_SEEDS=60 NABEDRA_SIM_JOBS=4 timeout 1500 $bin sweep::tests::sweep --exact --nocapture --test-threads=1 > $out/mixed-$rule.log 2>&1
done
$bin --nocapture --test-threads=1 probes::tests::a_refusal probes::tests::not_applied 2>&1 | tail -8
grep -a "fault model dr\|NotAppliedNeverCommitted" $out/dr-*.log | cut -c1-300
echo "diagnostic finished"
exit 1
''']
cwd = "server"
timeout_s = 7200
needs = []
result_parser = "cargo-test"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim" }
