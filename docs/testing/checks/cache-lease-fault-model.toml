id = "cache-lease-fault-model"
module = "cache"
kinds = ["S"]
# Component simulation. The controller is stepped directly without a Raft quorum.
guarantees = []
scenarios = ["K03"]
tiers = ["T1"]
command = ["cargo", "test", "--locked", "-j", "2", "--no-default-features", "--features", "cache,sim", "--lib", "cache::cluster::sim::", "--", "--test-threads=1"]
cwd = "server"
timeout_s = 1200
needs = []
result_parser = "cargo-test"
env = { RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim" }
