id = "oltp-sim-nightly-2"
module = "oltp"
kinds = ["S", "H"]
# Fault model. Smoke covers the single-key real-time history and keyed retries.
guarantees = ["OLTP-G02", "OLTP-G03"]
scenarios = []
tiers = ["T2", "T3"]
# Daily UTC range, shard 2 of 4. The request ID pins the date across runners.
command = ["bash", "-euc", '''
day=$(date -u +%F)
if [[ ${NABEDRA_REQUEST_ID:-} =~ ^nightly-[[:xdigit:]]{7}-([0-9]{4})([0-9]{2})([0-9]{2})- ]]; then
    day="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
fi
epoch_day=$(date -u -d "$day" +%s)
export NABEDRA_SEED=$((1000000 + 20000 * (epoch_day / 86400) + 5000 * NABEDRA_SIM_SHARD))
exec cargo test --locked --release -p nabedra-sim-oltp --lib sweep::tests::sweep \
    -- --exact --nocapture --test-threads=1
''']
cwd = "server"
timeout_s = 18000
needs = []
result_parser = "cargo-test"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SIM_WORKLOAD = "smoke", NABEDRA_SEEDS = "5000", NABEDRA_SIM_JOBS = "4", NABEDRA_SIM_VERIFY_REPLAY = "0.1", NABEDRA_SIM_SHARD = "1", NABEDRA_SIM_CHECK_ID = "oltp-sim-nightly-2", NABEDRA_SIM_GUARANTEES = "OLTP-G02,OLTP-G03", NABEDRA_SIM_ARTIFACTS = "../../target/testing-logs/oltp-sim-nightly-2" }
