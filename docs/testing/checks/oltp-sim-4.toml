id = "oltp-sim-4"
module = "oltp"
kinds = ["S", "H"]
# Fault model. Seeds rotate through `direct`, `cold` and `move`, and through the four TCP
# nemesis profiles. A scenario is claimed only when every one of its clauses ran.
guarantees = ["OLTP-G02", "OLTP-G03"]
scenarios = []
tiers = ["T1"]
# Shard 4 of 4. Build once, then allow the measured sweep at most 15 minutes.
command = ["bash", "-euc", '''
build=(cargo test --locked --release -p nabedra-sim-oltp --lib)
"${build[@]}" --no-run
report=../target/testing-logs/oltp-sim-4/sweep-report.json
rm -f "$report"
timeout 900s "${build[@]}" sweep::tests::sweep -- --exact --nocapture --test-threads=1
# The unit tests above, or a filter that matches nothing, must not pass for the sweep.
python3 -c 'import json, sys
seeds = json.load(open(sys.argv[1]))["seeds"]
sys.exit(0 if len(seeds) == int(sys.argv[2]) else f"the sweep ran {len(seeds)} seeds")' "$report" "$NABEDRA_SEEDS"
''']
cwd = "server"
timeout_s = 3600
needs = []
result_parser = "cargo-test"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SIM_WORKLOAD = "mixed", NABEDRA_SEEDS = "240", NABEDRA_SIM_JOBS = "4", NABEDRA_SIM_VERIFY_REPLAY = "1", NABEDRA_SEED = "481", NABEDRA_SIM_CHECK_ID = "oltp-sim-4", NABEDRA_SIM_GUARANTEES = "OLTP-G02,OLTP-G03", NABEDRA_SIM_ARTIFACTS = "../../target/testing-logs/oltp-sim-4" }
