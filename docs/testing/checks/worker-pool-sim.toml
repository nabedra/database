id = "worker-pool-sim"
module = "scheduler"
kinds = ["S", "U"]
guarantees = ["SCHED-G01", "OLAP-G07", "OLTP-G09"]
scenarios = ["C04", "C06", "F01", "F02", "F03"]
tiers = ["T1"]
# Fault model: the in-process worker pool covers the local slices of these scenarios.
command = ["cargo", "test", "--locked", "--no-default-features", "--features", "olap,sim", "--lib", "worker_pool::sim_tests", "--", "--test-threads=1"]
cwd = "server"
timeout_s = 1800
needs = []
result_parser = "cargo-test"
env = { CARGO_TARGET_DIR = "target/sim", RUSTFLAGS = "--cfg tokio_unstable" }
