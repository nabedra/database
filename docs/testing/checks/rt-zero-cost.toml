id = "rt-zero-cost"
module = "oltp"
kinds = ["P"]
guarantees = ["OLTP-G13"]
scenarios = ["O09"]
tiers = ["T1"]
# Pair phase 8 extractions with the pre-split baseline used for build times.
# The checks job fetches full history so this revision is available.
command = ["bash", "-ec", '''
if [[ ${GITHUB_ACTIONS:-} == true ]] && ! command -v valgrind >/dev/null; then
    sudo -n apt-get update -qq
    sudo -n apt-get install -y --no-install-recommends valgrind
fi
base=53a5716f844aa9690739daed32fd335c68bc0f8a
echo "rt-zero-cost base: $base"
exec python3 scripts/testing/insn_count.py --base "$base" --head HEAD --skip-missing-valgrind
''']
cwd = "."
timeout_s = 3600
needs = []
not_run_marker = "not-run: valgrind-missing"
result_parser = "exit-code"
