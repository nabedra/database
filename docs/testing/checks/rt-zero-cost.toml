id = "rt-zero-cost"
module = "oltp"
kinds = ["P"]
guarantees = ["OLTP-G13"]
scenarios = ["O09"]
tiers = ["T1"]
# The base is the merge base with main, so a task branch is measured against the main it
# branched from. On main itself (merge base = HEAD) it is HEAD's first parent: the last
# merge. Phase 7 as a whole was measured once against e3d51a6, the testing-plan baseline
# (P7-BANS report). The checks job fetches full history, so origin/main is present.
command = ["bash", "-ec", '''
if [[ ${GITHUB_ACTIONS:-} == true ]] && ! command -v valgrind >/dev/null; then
    sudo -n apt-get update -qq
    sudo -n apt-get install -y --no-install-recommends valgrind
fi
base=$(git merge-base origin/main HEAD)
if [[ $base == "$(git rev-parse HEAD)" ]]; then base=$(git rev-parse HEAD^1); fi
echo "rt-zero-cost base: $base"
exec python3 scripts/testing/insn_count.py --base "$base" --head HEAD --skip-missing-valgrind
''']
cwd = "."
timeout_s = 3600
needs = []
not_run_marker = "not-run: valgrind-missing"
result_parser = "exit-code"
