id = "cache-valkey-diff"
module = "cache"
kinds = ["D"]
# CACHE-G12 needs the ORM and stock-driver clients. This check sends raw RESP2 only.
guarantees = ["CACHE-G01", "CACHE-G02"]
scenarios = ["K01"]
tiers = ["T1", "T2"]
command = [
    "sh", "-ec",
    'cargo build --no-default-features --features cache && exec python3 ../scripts/cache-acceptance/differential.py --spawn-valkey --nabedra-bin "${CARGO_TARGET_DIR:-target}/debug/nabedra-db" --shrink --history ../target/testing-logs/cache-valkey-diff.jsonl',
]
cwd = "server"
timeout_s = 1800
needs = ["docker"]
result_parser = "exit-code"
