id = "oltp-sim-bugs-regression-acc3"
module = "oltp"
kinds = ["U"]
# Tooling: passes only if the ACC3 cold-fence patch, applied in a scratch worktree, makes O15 fail
# with its recorded failure text while O15 passes without it. It has not passed: O15 caught this
# patch in 1 of at most 5 patched runs before the crate split (runs 45148928008 and 45150522656) and
# in none since, where 10 of 10 listed patched attempts passed (run 45422532178). The patch is not
# shown to be sensitive. The manifest allows up to 10 attempts: every unpatched attempt must pass,
# and the first patched attempt with the expected failure decides. Kept apart from
# oltp-sim-bugs-regression so that timing window cannot gate the four library regressions.
guarantees = []
scenarios = []
tiers = ["T3"]
command = ["python3", "scripts/testing/sim_bugs.py", "verify", "acc3-cold-fence", "--jobs", "4"]
cwd = "."
timeout_s = 18000
needs = []
result_parser = "exit-code"
