id = "p10w4-cap"
module = "oltp"
kinds = ["S"]
# Scratch diagnostic, never merged. It asks whether the Control route cache can be driven to its
# cap and what that costs. It asserts nothing, so it always exits 1.
guarantees = []
scenarios = []
tiers = ["T1"]
command = ["bash", "-euc", '''
cargo test --locked -j 2 --release -p nabedra-sim-oltp --lib --no-run
bin=$PWD/$(ls -t target/sim/release/deps/nabedra_sim_oltp-* | grep -v "[.]d$" | head -1)
out=$PWD/../target/testing-logs/p10w4-cap
mkdir -p $out
cd sim-oltp
set +e
for w in direct cold move; do for n in 0 16 62 70; do
  echo "case $w tables $n" >> $out/times.txt
  /usr/bin/time -o $out/times.txt -a -f "wall %e s user %U s rss %M KB rc %x" env NABEDRA_DIAG_TABLES=$n NABEDRA_SIM_EXPECT=none-such NABEDRA_SIM_PROFILE=none NABEDRA_SIM_ARTIFACTS=$out/a NABEDRA_SIM_WORKLOAD=$w NABEDRA_SEED=4 NABEDRA_SEEDS=1 NABEDRA_SIM_JOBS=1 timeout 900 $bin sweep::tests::sweep --exact --nocapture --test-threads=1 > $out/$w-$n.log 2>&1
done; done
cat $out/times.txt
echo "diagnostic finished, no assertion ran"
exit 1
''']
cwd = "server"
timeout_s = 7200
needs = []
result_parser = "cargo-test"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SIM_WORKLOAD = "mixed" }
