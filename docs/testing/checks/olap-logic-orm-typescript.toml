id = "olap-logic-orm-typescript"
module = "orm-typescript"
kinds = ["D"]
guarantees = ["ORM-G02", "OLAP-G06"]
scenarios = ["U01", "U02"]
tiers = ["T1"]
command = ["bash", "-ec", '''
if [ ! -f node_modules/typescript/bin/tsc ]; then
  npm ci --no-audit --no-fund
fi
npm run build
node --test --test-reporter=tap --test-name-pattern='^replay corpus over HTTP$' tests/logic-replay.test.mjs
''']
cwd = "orm/typescript"
timeout_s = 300
needs = ["node"]
result_parser = "node-test"
