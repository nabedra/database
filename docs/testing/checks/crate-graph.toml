id = "crate-graph"
# The module ratchet must run on OLTP changes, which is what makes a rising back edge fail before
# the crates exist (phase 8 design, 4.3), so the check belongs to `oltp` rather than `testing`.
module = "oltp"
kinds = ["U"]
guarantees = []
scenarios = []
tiers = ["T0", "T1"]
# Case 5 exercises the source edge in storage. Case 6 requires the replication proofs
# and checks their placement and the rejection of a forged implementation.
command = ["python3", "-m", "unittest", "discover", "-v", "-s", "scripts/testing", "-p", "test_crate_graph.py"]
cwd = "."
timeout_s = 600
needs = []
result_parser = "unittest"
