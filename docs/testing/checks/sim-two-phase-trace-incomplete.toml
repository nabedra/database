# Traces that carry less than their actions need, or something a checker misreads, must not be
# accepted: a required variable omitted, misspelt or given twice, only action names, a message missing
# or wrong, and an integer TLC wraps to the right one. The trace writer cannot write or refuses to
# write each of them (two_phase_trace.rs), so these are edited by hand, and what is checked is the
# trace spec and tla_trace.py. At c8426fe1 all seven are accepted, so this check FAILS until
# specs/lib, the trace spec and the tools refuse them. It is in the nightly tier only for that reason.
# Move its traces into sim-two-phase-trace once it passes.
id = "sim-two-phase-trace-incomplete"
module = "sim"
kinds = ["T"]
guarantees = []
scenarios = []
tiers = ["T2"]
command = ["bash", "-euc", '''
traces="$PWD/target/sim-two-phase-trace-incomplete"
rm -rf "$traces"
export NABEDRA_TRACE_DIR="$traces/accepted"
export RUSTFLAGS="--cfg tokio_unstable"
export CARGO_TARGET_DIR="$PWD/server/target/sim"
cargo test --locked -j 2 -p nabedra-sim --manifest-path server/Cargo.toml --test two_phase_trace
test "$(find "$traces/incomplete" -name "TwoPhase-*.ndjson" | wc -l)" -eq 7
exec python3 scripts/testing/tla_trace.py check specs/selftest TwoPhase --expect-rejected "$traces/incomplete" --module sim
''']
cwd = "."
timeout_s = 1800
needs = ["tlc"]
result_parser = "tlc"
