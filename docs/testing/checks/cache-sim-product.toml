id = "cache-sim-product"
module = "cache"
kinds = ["U"]
guarantees = []
scenarios = ["K01", "K02", "K03"]
tiers = ["T1"]
command = ["bash", "-euc", '''
set -o pipefail
base=$(git merge-base origin/main HEAD)
if [[ $base == "$(git rev-parse HEAD)" ]]; then base=$(git rev-parse HEAD^1); fi
mkdir -p target
scratch=$(mktemp -d "$PWD/target/cache-product.XXXXXX")
git worktree add --detach "$scratch/base" "$base"
trap 'git worktree remove "$scratch/base"; rm -r -- "$scratch"' EXIT

tree() {
    local server=$1 edges=$2
    shift 2
    cargo tree --manifest-path "$server/Cargo.toml" --locked -p nabedra-database \
        -e "$edges" "$@" | sed "s|($server|(<server>|g"
}

for feature in default olap oltp oltp-backup-s3 cache cache,test-hooks; do
    args=()
    if [[ $feature != default ]]; then args=(--no-default-features --features "$feature"); fi
    tree "$scratch/base/server" normal "${args[@]}" > "$scratch/base.txt"
    tree "$PWD" normal "${args[@]}" > "$scratch/head.txt"
    diff -u "$scratch/base.txt" "$scratch/head.txt"
    tree "$PWD" normal,features "${args[@]}" > "$scratch/features.txt"
    if grep -E 'nabedra-(rt|database) feature "sim|nabedra-sim ' "$scratch/features.txt"; then
        echo "Simulation dependency in product features $feature" >&2
        exit 1
    fi
    printf 'Product dependency tree unchanged for %s\n' "$feature"
done

cargo test --locked -j 4 --no-default-features --features cache
''']
cwd = "server"
timeout_s = 1800
needs = []
result_parser = "cargo-test"
