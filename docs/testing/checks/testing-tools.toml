command = ["python3", "-c", '''
import sys
import unittest

loader = unittest.TestLoader()
suite = unittest.TestSuite(
    loader.discover("scripts/testing", pattern=f"test_{tool}.py")
    for tool in ("ab", "build_times", "insn_count", "licenses", "pr_lint", "repeat_gate", "triage")
)
sys.exit(not unittest.TextTestRunner().run(suite).wasSuccessful())
''']
