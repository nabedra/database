id = "oltp-sim-topology-splits"
module = "oltp"
kinds = ["S", "H"]
# Fault model, no nemesis. The same seeds with the range split before any client starts, and with
# the split requested under direct load. The second half is red while a split under direct load
# does not publish (OLTP-sim-split-after-direct-commit).
guarantees = ["OLTP-G06"]
scenarios = []
tiers = ["T1"]
command = ["bash", "-euc", '''
build=(cargo test --locked -j 2 --release -p nabedra-sim-oltp --lib)
"${build[@]}" --no-run
rc=0
for way in split-before-load split-under-load; do
  echo "split timing $way"
  NABEDRA_SIM_TOPOLOGY="no-move,$way" NABEDRA_SIM_ARTIFACTS="$NABEDRA_SIM_ARTIFACTS/$way" \
    timeout 1500s "${build[@]}" sweep::tests::sweep -- --exact --nocapture --test-threads=1 || rc=$?
done
exit "$rc"
''']
cwd = "server"
timeout_s = 5400
needs = []
result_parser = "cargo-test"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SIM_WORKLOAD = "topology", NABEDRA_SIM_PROFILE = "none", NABEDRA_SEEDS = "12", NABEDRA_SIM_JOBS = "2", NABEDRA_SIM_VERIFY_REPLAY = "0.25", NABEDRA_SEED = "1", NABEDRA_SIM_CHECK_ID = "oltp-sim-topology-splits", NABEDRA_SIM_GUARANTEES = "OLTP-G06", NABEDRA_SIM_ARTIFACTS = "../../target/testing-logs/oltp-sim-topology-splits" }
