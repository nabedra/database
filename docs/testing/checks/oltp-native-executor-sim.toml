id = "oltp-native-executor-sim"
module = "oltp"
kinds = ["S", "U"]
guarantees = ["OLTP-G09", "SCHED-G01"]
scenarios = ["C04", "C06", "F01", "F02", "F03"]
tiers = ["T1"]
# Fault model: native worker-local slots, job settlement and replay on a mounted pool.
command = ["bash", "-ec", '''
export CARGO_TARGET_DIR="$PWD/$CARGO_TARGET_DIR"
cargo test --locked -j 2 -p nabedra-database --no-default-features --features oltp,sim --lib oltp::pool::resources::sim_tests -- --show-output --test-threads=1
python3 ../scripts/testing/repeat_gate.py --features oltp,sim <<'JSON'
[
  {"id": "c04_c06_f01_f02_native_slots_refill_and_isolate_failures", "file": "server/src/oltp/pool/resources/sim_tests.rs", "lang": "rust"},
  {"id": "f03_native_drain_keeps_cancelled_work_until_settlement", "file": "server/src/oltp/pool/resources/sim_tests.rs", "lang": "rust"},
  {"id": "f03_native_crash_drops_queued_work_and_releases_accounting", "file": "server/src/oltp/pool/resources/sim_tests.rs", "lang": "rust"}
]
JSON
''']
cwd = "server"
timeout_s = 3600
needs = []
result_parser = "cargo-test"
env = { RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim" }
