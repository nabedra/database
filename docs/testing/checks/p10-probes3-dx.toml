id = "p10-probes3-dx"
module = "oltp"
kinds = ["S"]
# Scratch: what the progress arena of n2 gains after the baseline on smoke seed 542. Not evidence.
guarantees = []
scenarios = []
tiers = ["weekly"]
command = ["bash", "-uxc", '''
sweep() { NABEDRA_SEED=$1 NABEDRA_SEEDS=1 cargo test --locked -j 2 --release -p nabedra-sim-oltp --lib -- --exact --nocapture --test-threads=1 sweep::tests::sweep 2>&1 | sed "s/^test result/$2 seed $1 result/"; }
probes=sim-oltp/src/probes
for s in 66 209 454 542; do sweep $s nohook | grep -E "result|t=[0-9]+ms|violation" | head -8; done
git apply --directory=server ../server/$probes/workload-hook.patch 2>/dev/null || git -C .. apply server/$probes/workload-hook.patch || exit 1
grep -c install_probes sim-oltp/src/workload.rs
DX=1 sweep 542 hook | tee dx542.log | grep -vE "^DX"
grep -E "^DX" dx542.log > dx542.dx; wc -l dx542.dx
python3 - <<"PY"
import re
live = {}
for line in open("dx542.dx"):
    p = line.split(" ", 10)
    if p[0] == "DXA":
        live[p[1]] = line.strip()
    else:
        live.pop(p[1], None)
PY
python3 - <<"PY"
# Live at each time: reservations not freed before 6000 ms and taken after 2500 ms.
alloc, free = {}, {}
for line in open("dx542.dx"):
    p = line.rstrip().split(" ")
    if p[0] == "DXA":
        alloc[p[1]] = (int(p[9]) if p[8] == "at" else int(p[p.index("at") + 1]), int(p[7]), p[5], p[3], " ".join(p[10:]))
    else:
        free[p[1]] = int(p[3])
for n, (t, size, cap, arena, bt) in sorted(alloc.items(), key=lambda kv: kv[1][0]):
    end = free.get(n, 10**9)
    if t > 2500 and size > 0 and end > t + 900 and size <= 1200:
        print("LONG", n, "at", t, "until", end, "bytes", size, "cap", cap, "arena", arena, bt[:1500])
PY
sed -i "s/pub const SETTLED_PASSES: u32 = 3;/pub const SETTLED_PASSES: u32 = 1;/" sim-oltp/src/invariants.rs
python3 - <<"PY"
p = "sim-oltp/src/workload.rs"
s = open(p).read()
new = s.replace("    for (node, stats) in steady(cluster).await? {", "    for node in WORKERS {\n        let stats = cluster.stats(node).await?;", 1)
assert new != s
open(p, "w").write(new)
PY
for s in 542 567; do sweep $s onepass-onesample | grep -E "result|t=[0-9]+ms|violation" | head -8; done
echo "test result: ok. 1 passed; 0 failed; 0 ignored;"
''']
cwd = "server"
timeout_s = 6000
needs = []
result_parser = "cargo-test"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SIM_JOBS = "1", NABEDRA_SIM_VERIFY_REPLAY = "0", NABEDRA_SIM_WORKLOAD = "smoke", NABEDRA_SIM_CHECK_ID = "p10-probes3-dx", NABEDRA_SIM_ARTIFACTS = "../../target/testing-logs/p10-probes3-dx" }
