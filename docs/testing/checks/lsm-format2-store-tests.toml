# LSM-1: every nabedra-kv store integration suite (damage, crash, power loss, GC, campaign, model) on
# format 2 stores, whose journals use authenticated frames.
id = "lsm-format2-store-tests"
module = "lsm"
kinds = ["U"]
guarantees = ["LSM-G01", "LSM-G02", "LSM-G03"]
scenarios = ["LSM01", "NS04", "NS05", "NS06", "NS07", "NS25"]
tiers = ["T1"]
command = ["cargo", "test", "--locked", "-p", "nabedra-kv", "--tests", "--", "--test-threads=2"]
cwd = "server"
timeout_s = 1800
needs = []
result_parser = "cargo-test"
env = { NABEDRA_KV_TEST_AUTH = "1" }
