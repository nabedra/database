id = "p10w5-diag-4"
module = "oltp"
kinds = ["S"]
# Scratch diagnostic, never merged. It prints lease holders and refusals and asserts nothing, so it
# always exits 1: its record must never read as a pass.
guarantees = []
scenarios = []
tiers = ["T1"]
command = ["bash", "-euc", '''
cargo test --locked -j 2 --release -p nabedra-sim-oltp --lib --no-run
bin=$PWD/$(ls -t target/sim/release/deps/nabedra_sim_oltp-* | grep -v "[.]d$" | head -1)
out=$PWD/../target/testing-logs/p10w5-diag-4
mkdir -p $out
cd sim-oltp
set +e
one() {
  s=$1; d=$out/s$s
  NABEDRA_DIAG=1 NABEDRA_SIM_TRACE=full NABEDRA_SIM_ARTIFACTS=$d NABEDRA_SEED=$s NABEDRA_SEEDS=1 NABEDRA_SIM_JOBS=1 NABEDRA_SIM_VERIFY_REPLAY=0 timeout 900 $bin sweep::tests::sweep --exact --nocapture --test-threads=1 > $d.log 2>&1
  echo "rc $?" >> $d.log
  grep -av "conn=" $(find $d -name trace.txt) > $d.trace 2>/dev/null
  cp $d/sweep-report.json $d.report.json 2>/dev/null
  rm -rf $d
  gzip -f $d.log $d.trace
}
export -f one; export out bin
seq 481 720 | xargs -P 4 -I{} bash -c 'one {}'
echo "diagnostic finished, no assertion ran"
exit 1
''']
cwd = "server"
timeout_s = 10800
needs = []
result_parser = "cargo-test"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SIM_WORKLOAD = "mixed" }
