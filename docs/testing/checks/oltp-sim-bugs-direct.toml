id = "oltp-sim-bugs-direct"
module = "oltp"
kinds = ["S", "H"]
# Fault-model simulation evidence, by the rule in server/sim-oltp/bugs/README.md (lead decision 8).
# Each phase 10 reverted fix must be found by a seed in [1, 10000], tried in order, that reports an
# expected invariant or anomaly. That seed, replayed alone on the patched build, must fail the same way
# twice and leave a history. A red unpatched twin or a replay that differs masks the seed, and the
# search goes on. The unpatched build runs the same seeds for the base rate. A hit is a candidate until
# [detection] confirms its mechanism for that exact hit, everything else the README lists is there, and
# the build is main's. The regression of a found target also runs in this job. No patch has been
# detected. acc3-cold-fence has no test that fails because of it: it is not shown, is not searched, and
# keeps this check from passing until that changes.
# sim-bugs-run.json in the uploaded target/testing-logs/oltp-sim-bugs-direct holds the result of each
# target, and the log holds one sim-bugs-search line per search for searches.jsonl. 10,000 seeds on two
# builds do not fit 3,600 s per target, so such a search ends `incomplete` and the record fails. The
# design for shards is server/sim-oltp/bugs/SHARDS.md. The sweep binaries stay in the target directory:
# design 3.10 allows no binary artifact from this job.
# While the harness lacks a bug's workload, the command prints the marker below and the record is
# not-run, never a pass. It stays out of T2 so the nightly does not dispatch it.
guarantees = ["OLTP-G01", "OLTP-G03", "OLTP-G04", "OLTP-G07", "OLTP-G08"]
scenarios = ["D02", "D04", "O10", "O15", "R04", "O26"]
tiers = ["weekly", "T3"]
command = ["python3", "scripts/testing/sim_bugs.py", "run", "--set", "direct", "--jobs", "4",
           "--sim-jobs", "4", "--search-timeout", "3600", "--time-limit", "16200",
           "--out", "target/testing-logs/oltp-sim-bugs-direct"]
cwd = "."
timeout_s = 18000
needs = []
result_parser = "exit-code"
not_run_marker = "not-run: sim-harness-missing"
env = { RUSTFLAGS = "--cfg tokio_unstable", RUST_MIN_STACK = "16777216" }
