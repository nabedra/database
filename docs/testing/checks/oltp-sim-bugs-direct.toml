id = "oltp-sim-bugs-direct"
module = "oltp"
kinds = ["S", "H"]
# Fault-model simulation evidence, by the rule in server/sim-oltp/bugs/README.md (lead decision 8): the counting run of
# all five phase 10 reverted fixes, and their acceptance record. Each must be found by a seed in [1, 10000], tried in
# order, that reports an expected invariant or anomaly. The 10,000 seeds of a target are run in four shards
# (oltp-sim-bugs-<id>-1 to -4, server/sim-oltp/bugs/SHARDS.md). This check verifies their attested records on the branch
# evidence/sim-bugs, merges them again, and repeats the builds, the hit, its twin, the base run around it and the
# regression. A hit is a candidate until [detection] confirms its mechanism for that exact hit, everything else the README
# lists is there, and the build is main's. A missing or unattested shard is incomplete. No patch has been detected.
# acc3-cold-fence has no test that fails because of it: it is not shown, is not searched, and keeps this check from passing
# until that changes.
# sim-bugs-count.json in the uploaded target/testing-logs/oltp-sim-bugs-direct holds the result of each target. The sweep
# binaries stay in the target directory: design 3.10 allows no binary artifact from this job.
guarantees = ["OLTP-G01", "OLTP-G03", "OLTP-G04", "OLTP-G07", "OLTP-G08"]
scenarios = ["D02", "D04", "O10", "O15", "R04", "O26"]
tiers = ["weekly", "T3"]
command = ["python3", "scripts/testing/sim_bugs.py", "count", "--set", "direct", "--jobs", "4",
           "--sim-jobs", "4", "--time-limit", "16200", "--out", "target/testing-logs/oltp-sim-bugs-direct"]
cwd = "."
timeout_s = 18000
needs = []
result_parser = "exit-code"
not_run_marker = "not-run: sim-harness-missing"
env = { RUSTFLAGS = "--cfg tokio_unstable", RUST_MIN_STACK = "16777216" }
