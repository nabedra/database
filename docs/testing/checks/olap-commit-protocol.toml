id = "olap-commit-protocol"
module = "olap"
kinds = ["S"]
guarantees = ["OLAP-G02", "OLAP-G03", "OLAP-G04", "OLAP-G05"]
scenarios = ["T03", "T04", "T05", "T06"]
tiers = ["T1", "T2"]
# Includes the planted-bug sensitivity tests (false not_applied, CAS overwrite).
command = ["cargo", "test", "--locked", "--lib", "storage::commit_protocol_tests::", "--", "--nocapture"]
cwd = "server"
timeout_s = 1800
needs = []
result_parser = "cargo-test"
env = { NABEDRA_CASES = "1280" }
