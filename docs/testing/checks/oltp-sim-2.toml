id = "oltp-sim-2"
module = "oltp"
kinds = ["S", "H"]
# Fault model. Seeds rotate through `direct`, `cold` and `move`, and through the four TCP
# nemesis profiles. A scenario is claimed only when every one of its clauses ran.
guarantees = ["OLTP-G02", "OLTP-G03"]
scenarios = []
tiers = ["T1"]
# Shard 2 of 4. Build once, then allow the measured sweep at most 15 minutes.
command = ["bash", "-euc", '''
build=(cargo test --locked -j 2 --release -p nabedra-sim-oltp --lib)
"${build[@]}" --no-run
"${build[@]}" -- --test-threads=2 workloads:: nemesis:: node::tests::
exec timeout 900s "${build[@]}" sweep::tests::sweep -- --exact --nocapture --test-threads=1
''']
cwd = "server"
timeout_s = 3600
needs = []
result_parser = "cargo-test"
env = { RUST_MIN_STACK = "16777216", RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim", NABEDRA_SIM_WORKLOAD = "mixed", NABEDRA_SEEDS = "240", NABEDRA_SIM_JOBS = "4", NABEDRA_SIM_VERIFY_REPLAY = "0.1", NABEDRA_SEED = "1", NABEDRA_SIM_CHECK_ID = "oltp-sim-2", NABEDRA_SIM_GUARANTEES = "OLTP-G02,OLTP-G03", NABEDRA_SIM_ARTIFACTS = "../../target/testing-logs/oltp-sim-2" }
