# The shards, their merge and the counting run of sim_bugs.py: every test once, then the repetition gate (50 runs of each) in
# four processes. The harness, the library tests and `gh attestation verify` are fakes.
command = ["bash", "-euo", "pipefail", "-c", '''
python3 -m unittest test_sim_bugs_shards
python3 - <<'PY'
from concurrent.futures import ThreadPoolExecutor
import json
import subprocess
import sys
import unittest
from test_sim_bugs_shards import CountTest, MergeTest, ShardTest

tests = [{"id": f"test_sim_bugs_shards.{case.__name__}.{name}", "file": "scripts/testing/test_sim_bugs_shards.py",
          "lang": "python"}
         for case in (ShardTest, MergeTest, CountTest)
         for name in unittest.defaultTestLoader.getTestCaseNames(case) if name.startswith("test_")]

def gate(shard):
    return subprocess.run([sys.executable, "repeat_gate.py"], input=json.dumps(shard), text=True,
                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT)

with ThreadPoolExecutor(4) as pool:
    results = list(pool.map(gate, [tests[i::4] for i in range(4)]))
for result in results:
    print(result.stdout, end="", flush=True)
sys.exit(max(result.returncode for result in results))
PY
''']
cwd = "scripts/testing"
