# LSM-1 and LSM-10 regressions: keyed journal record headers, creation with a crash at every step, key
# refusals, format 1 refusal, backup and restore, and the journal-level forged-evidence cases.
id = "lsm-integrity-tests"
module = "lsm"
kinds = ["U"]
guarantees = ["LSM-G02", "LSM-G03"]
scenarios = ["NS05", "NS07", "NS22", "NS25"]
tiers = ["T1"]
command = ["cargo", "test", "--locked", "-p", "nabedra-kv", "--test", "store_integrity", "--lib", "--", "lsm1", "--test-threads=1"]
cwd = "server"
timeout_s = 600
needs = []
result_parser = "cargo-test"
