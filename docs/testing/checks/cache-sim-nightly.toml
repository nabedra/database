id = "cache-sim-nightly"
module = "cache"
kinds = ["S", "H"]
guarantees = ["CACHE-G02", "CACHE-G03", "CACHE-G05", "CACHE-G06", "CACHE-G07", "CACHE-G08", "CACHE-G09"]
scenarios = ["K01", "K02", "K03"]
tiers = ["T2", "T3"]
# Fault-model repetition gate. Run five times the PR seeds in a single sweep
# so the evidence contains the result and range of the entire campaign.
command = ["bash", "-euc", '''
build=(cargo test --locked -j 4 --release --no-default-features --features cache,sim --lib)
test_name=cache::cluster::sim::tests::seed_sweep
tests=$("${build[@]}" "$test_name" -- --list --format terse)
grep -Fxq "$test_name: test" <<< "$tests"

first=${NABEDRA_SEED:-auto}
if [[ $first == auto ]]; then
    run_id=${GITHUB_RUN_ID:-0}
    first=$((1000000 + 100000 * 10#$run_id))
fi
NABEDRA_SEED="$first" "${build[@]}" "$test_name" -- --exact --nocapture --test-threads=1
''']
cwd = "server"
# 4 h 20 min including compilation, within the five-hour nightly runner budget.
timeout_s = 15600
needs = []
result_parser = "cargo-test"
env = { RUSTFLAGS = "--cfg tokio_unstable", CARGO_TARGET_DIR = "target/sim-cache", CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS = "true", CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS = "true", NABEDRA_SEEDS = "1250", NABEDRA_SIM_JOBS = "4", NABEDRA_SIM_SHRINK = "0", NABEDRA_SIM_ARTIFACTS = "../target/testing-logs/cache-sim-nightly" }
