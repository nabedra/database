# The simulator's disk fault model (FaultFs and simulated volumes): specs/sim/disk/SimDisk.tla.
# Three exhaustive baselines (SimDisk.cfg, SimDisk.p4k.cfg, SimDisk.wipe.cfg) with coverage, then every
# mutant, finding, witness and gap configuration in specs/sim/disk/mutants. See specs/sim/README.md.
id = "sim-sim-disk"
module = "sim"
kinds = ["T"]
guarantees = ["LSM-G01", "LSM-G02", "LSM-G03", "OLTP-G01", "OLTP-G08"]
scenarios = ["NS04", "NS05", "NS15", "O11", "O17"]
tiers = ["T1"]
command = ["python3", "scripts/testing/tla_check.py", "specs/sim/disk", "SimDisk", "--module", "sim"]
cwd = "."
timeout_s = 7200
needs = ["tlc"]
result_parser = "tlc"
