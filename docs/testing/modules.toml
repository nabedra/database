# Path-to-module map for check selection, the coverage matrix and the nightly budget.
#
# Rules:
# - A path belongs to every module whose `paths` glob matches it and whose `exclude` globs do not.
#   Shared server files map to both `oltp` and `olap`, so a change to them selects both.
# - A path that matches no module belongs to the `fallback` module (`misc`). `matrix.py select`
#   treats a `misc` path as "run every T1 check", because nothing narrower is known to be safe.
# - Globs are relative to the repository root. `**` matches any number of directories (including
#   none), `*` matches within one path segment, and `?` matches one character.
# - `register` names the module's guarantee register. Several modules may share one register.
# - `level` is the assurance level (plan revision 2, "Three assurance levels"): L1, L2 or L3.
# - `hot_paths` are the globs whose changes require paired A/B performance runs in T1.
# - `matrix.py lint` checks this file: every test file must match a module, every module named by
#   a check must exist, and nightly shares must add up to 100.

schema = "nabedra.modules/1"
fallback = "misc"

[nightly]
core_hours = 160

# The nightly simulation and fuzzing budget is split by risk. Each pool's share is a percentage of
# `core_hours`; the modules in a pool share its hours. Change the shares as bug rates change.
[[nightly.pool]]
name = "oltp"
share = 60
modules = ["oltp", "lsm"]

[[nightly.pool]]
name = "events"
share = 15
modules = ["events"]

[[nightly.pool]]
name = "cache"
share = 15
modules = ["cache"]

[[nightly.pool]]
name = "olap"
share = 10
modules = ["olap", "olap-stream", "scheduler"]

