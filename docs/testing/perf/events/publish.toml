name = "Events publish and poll p99"
module = "events"
command = [
    "python3.11", "server/events/tests/acceptance.py", "--image", "{bin}",
    "--cases", "load-1", "--load-events", "96", "--output", "{work}/events.json",
]
warmup = 1
rounds = 6
timeout_s = 600
metric_file = "events.json"

# Medians over the three measured load stages. Poll latency includes empty polls.
[metrics]
publish_p99_ms = '"p99_publish_ms"\s*:\s*(\d+(?:\.\d+)?)'
poll_p99_ms = '"p99_poll_ms"\s*:\s*(\d+(?:\.\d+)?)'
