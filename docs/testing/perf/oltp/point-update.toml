name = "OLTP direct point update p99"
module = "oltp"
command = [
    "sh", "-eu", "-c",
    'exec python3.11 scripts/benchmark_oltp_nabedra.py --image "$NABEDRA_PERF_OLTP_IMAGE" --binary "$1" --output "$2" --direct-oltp on --rates 20 --seconds 3 --warmup-seconds 1 --repetitions 3 --clients 8 --rows 500',
    "oltp-benchmark", "{bin}", "{work}",
]
warmup = 1
rounds = 6
metric_file = "results.json"
metric = '"success_latency_ms"\s*:\s*\{[^}]*"p99"\s*:\s*(\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)'
