name = "OLTP queued point update latency"
module = "oltp"
# The point-update workload with direct OLTP off, so every update takes the queued path.
command = [
    "sh", "-eu", "-c",
    'exec python3.11 scripts/benchmark_oltp_nabedra.py --image "$NABEDRA_PERF_OLTP_IMAGE" --binary "$1" --output "$2" --direct-oltp off --rates 20 --seconds 10 --warmup-seconds 2 --repetitions 3 --clients 8 --rows 500',
    "oltp-benchmark", "{bin}", "{work}",
]
warmup = 2
rounds = 24
timeout_s = 1200
metric_file = "results.json"

# Medians of the per-phase percentiles; 200 updates per phase, so p99 is the second largest.
# The p99 had an A/A sd of 11% to 13%, so it gates at 10% and the p50 at 5%.
[metrics]
p50_ms = '"success_latency_ms"\s*:\s*\{[^}]*"p50"\s*:\s*(\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)'
p99_ms = { pattern = '"success_latency_ms"\s*:\s*\{[^}]*"p99"\s*:\s*(\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)', threshold_pct = 10 }
