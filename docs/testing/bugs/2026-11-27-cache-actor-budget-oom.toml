# Finding CACHE-5 of the review wave (rv-cache, 2026-11-26), confirmed in phase 2 by the regression below:
# it returned OOM on 6417c4dd (run 45975845424, Cache library tests) and evicts on the fix.
# The store evicted only against its own slot limit (store.rs fit_layout), while publish refused any turn whose
# charge exceeded the actor's remaining primary budget (actor.rs publish, StoreBytes::ceiling). With 8 MiB per
# actor and 683 slots of 8 MiB, a full actor returned OOM under sampled_lru, which CACHE-G03 forbids.
# Residual: eviction stays within the written slot, so a write to a slot that holds too little to evict still
# returns OOM when the actor is full. Choosing victims across slots needs a multi-slot journal turn.
id = "cache-actor-budget-oom"
title = "Sampled LRU returned OOM instead of evicting once the actor's primary budget was full"
class = "other"
module = "cache"
guarantees = ["CACHE-G03"]
