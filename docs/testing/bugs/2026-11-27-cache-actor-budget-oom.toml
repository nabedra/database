seed = "unknown"
why_not_caught = "Store tests check eviction against the slot limit alone, and no actor test filled several slots past the actor budget."
invariant_added = "A sampled_lru write that fits its slot but not the actor's remaining primary budget evicts older keys of the slot and is admitted."
