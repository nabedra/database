# Suspected by the rv-dense review (2026-11-27), confirmed by task fix-dense. A PreadDisk pool
# thread that runs a panicking read dies (disk.rs `work` called the job bare). The panicked job
# drops its reply sender, but a batch with more requests than live threads keeps jobs queued that
# no thread runs, and `read` waits on their senders for ever. Evidence: `cargo-slot test -p
# nabedra-vector --lib -- vs10_a_pool_whose_reads_all_panic` with the fix taken out: "read 0 of a
# pool whose reads panicked" (no answer in 10 s), log /home/dev/logs/oltp-vector/w3/fix-dense/red.log.
