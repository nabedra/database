# Found by reading the simulator code (server/rt/src/sim/net.rs Pipe::push keeps one barrier per stream;
# server/sim-oltp/src/net/mod.rs gives every worker frame Fate::Frame) and confirmed as a counterexample of
# specs/sim/net (mutant prefix_frames_overtake breaks ConnectionFifo). Not reproduced in a running simulator. The swept
# OLTP profiles reach it through Rule::Delay (DeadlineEdge) and Rule::Slow, against the nemesis header that calls
# reordering beyond-TCP and opt-in.
