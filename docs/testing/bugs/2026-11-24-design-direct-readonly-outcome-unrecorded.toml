# Fixed 2026-11-27 (fx-oltp-direct): a miss commits a tombstone over the head it read with its record; a row
# conflict is settled at the anchor and answered by the queued path. Regressions in direct/tests/fxod.rs and
# application/direct/tests.rs; before-fix run 45979142040, after-fix run 45979136103.
# Design review 2026-11-26 (wave-rv, rv-oltp-direct, finding OD-2; earlier DR-1, draft PR #118, reproduced on one
# simulator seed, local). Found in TLC: specs/oltp/direct, mutant prefix_dr1_readonly_unrecorded, 9 states, no fault.
# The shipped executor answers a no-op (update or delete of a missing row) and a row conflict (insert of a present row)
# without a dedup record (direct/executor.rs prepare, "A read-only outcome commits nothing", and compute,
# already_exists()). An earlier attempt of the same identity that is still running, or a later repeat after the row
# changed, then gets another definite result. Plan section 4 "Retry results" (lead decision 2026-11-24) requires the
# first definite result.
