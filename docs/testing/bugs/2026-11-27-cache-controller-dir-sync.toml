# Candidate from fx-lsm's search for the LSM-10 pattern, confirmed in phase 2 with FaultFs: the shipped open
# (create_dir_all, then sync of the directory itself only) loses topology.wal after a crash to durable state;
# durable_dir keeps it across a crash and 64 seeded power losses. The regression runs both forms.
id = "RV-CACHE-controller-dir-sync"
title = "A power loss after the Cache controller created its metadata directory could drop the WAL with acknowledged decisions"
