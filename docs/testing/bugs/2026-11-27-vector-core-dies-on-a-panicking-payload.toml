# Found by task fix-dense (2026-11-27) while adding the test the rv-dense review asked for: no test
# covered a core that dies after it started (since 8c074ad3). run_core contained a task's panic with
# catch_unwind and then dropped its payload outside it (cores.rs, `.is_err()` on the result). A
# payload whose drop panics unwinds the core's thread, and every later call to that core waits for
# ever. Evidence: `cargo-slot test -p nabedra-vector --test adversarial_runtime -- nr22_` with the
# fix taken out: "a call after the bad job: no answer in 5 s", log
# /home/dev/logs/oltp-vector/w3/fix-dense/red.log.
