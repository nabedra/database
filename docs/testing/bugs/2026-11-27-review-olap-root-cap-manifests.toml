# Evidence: wave-rv findings OLAP-3 (rv-olap sizes measured with ClusterCatalog::encode). The whole catalog root is one
# JSON document capped at MAX_CATALOG_BYTES (1 MiB) and rewritten on every commit: about 1,900 tables of 10 columns,
# 370 of 128 columns or 5,000 partition files fill it. fx-olap 2831c46d makes the cap a definite, replayable 413
# decision with unchanged tables (regression below), so the outcome is no longer unknown, but the database still
# cannot grow past the cap. The redesign (per-table manifests referenced from the root, loaded lazily) is deferred:
# plans/olap-commit.md, "Capacity plan".
