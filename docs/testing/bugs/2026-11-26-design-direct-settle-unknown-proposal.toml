# Design review 2026-11-26 (wave-rv, rv-oltp-direct, finding OD-1). Found in TLC: specs/oltp/direct, mutant
# prefix_settle_unknown, 6 states, no fault. The shipped executor removes a commit from the RangeClock after any
# proposal error (direct/executor.rs, the Err arm after propose: clock.settle(commit_ts)), including the `by` deadline,
# whose outcome is unknown: the entry is in the leader's log and can still commit under the same leader. A snapshot read
# at a later timestamp then passes rule 2 (observe_snapshot) without it, and the entry commits below that snapshot.
# Plan section 5 rule 1 says a commit leaves pending on apply or rejection only. Not reproduced in the simulator yet.
id = "OLTP-design-settle-unknown-proposal"
