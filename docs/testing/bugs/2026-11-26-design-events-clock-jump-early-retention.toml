# Fixed in fx-events for the stated bound (one wrong clock in RF3): guarded stamps from raft::clock. The
# activation fence is the open record EVENTS-GUARDED-ACTIVATION-FENCE.
# Design review rv-events, finding EVENTS-2 (wave-rv/findings/events.md). The plan states no clock bound ("monitor
# clock skew"). The retention cutoff is the leader's wall clock minus the retention (control/operate.rs:474), and
# events::retain and publish keep the maximum of every cutoff and publish time (partition/events.rs:56-58, 240), so a
# leader clock that jumps ahead removes retained events early and the jump stays in replicated time.
# TLC (local, unattested): specs/events-delivery/EventsDelivery.strict.cfg breaks G08_RetentionByPublishTime in 8
# states: publish e1 at true time 0, the leader's clock jumps one tick ahead, two ticks pass, the retention loop
# proposes cutoff 1 and removes e1 at true age 2 with a retention of 2. The fix needs a user decision (a stated
# bound and EVT-G08's wording); EventsDelivery.cfg checks the proposed bound (Variant drift_bound_stated).
