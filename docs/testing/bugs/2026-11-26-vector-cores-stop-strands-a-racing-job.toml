# Found by the adversarial tests of task N (nabedra/oltp-vector-nvme-test). Inner::submit checks the stop flag before it takes the queue lock, so a job can be queued after stop drained that queue. The core thread then sees the flag and returns without running it, the job stays in the queue until the Cores value is dropped, and Cores::call, which waits for the answer, never returns. Found with three callers against stop in a loop: a hang in about one iteration in a hundred.
