invariant_added = "Fault model, NABEDRA_SIM_WORKLOAD=mixed, default profile, seeds 5, 20 and 23 of 1 to 720 (move): survivors drop a lost worker and a cold start converges. The lost worker owned the move. Control answers Busy to BeginOwnerFence and BeginColdFence while the move record is active, and the move can be ended only by the owner incarnation that began it. The operator asks every worker for the move throughout. A harness that stopped asking showed this also for lost workers that were not the owner (nine seeds, such as 128). With the operator asking, 128 retires, and no survivor of 1 to 720 answers and keeps a lost worker that never owned the move. At c2aad866, where every run installs the probes and has another schedule: 65 move seeds of 1 to 720 report survivors that never dropped a lost worker, 5 (f4dab89f758328cd), 20 (9ae6dd196298491e) and 23 (fed0a04a96d0cf02) among them, each with the lost n1 as the only owner the operator saw (Actions run 45687381596, each replayed equal). In 338 (d5789e537ea645c5) both survivors answer ready and keep n3, while the operator saw only n1 as the owner, so the last sentence above does not hold for that schedule: undiagnosed. In 395, 494 and 590, whose lost worker was not a seen owner either, a survivor exited during startup."
