invariant_added = "Fault model, NABEDRA_SIM_WORKLOAD=mixed, default profile, seeds 5, 20 and 23 of 1 to 720 (move): survivors drop a lost worker and a cold start converges. The lost worker owned the move. Control answers Busy to BeginOwnerFence and BeginColdFence while the move record is active, and the move can be ended only by the owner incarnation that began it. The operator asks every worker for the move throughout. A harness that stopped asking showed this also for lost workers that were not the owner (nine seeds, such as 128). With the operator asking, 128 retires, and no survivor of 1 to 720 answers and keeps a lost worker that never owned the move."
