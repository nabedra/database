invariant_added = "Fault model, NABEDRA_SIM_WORKLOAD=mixed, default profile, seeds 11, 41, 149, 170 and 281 of 1 to 720: a stopped worker restarts after the heal. Control answers Busy to worker.restart.prepare while an earlier preparation of that worker is enrolled, and the process that enrolled it has exited. Why that first start failed is not established. At c2aad866, where every run installs the probes and has another schedule: 31 move seeds of 1 to 720 (32 if the cold-start exit of seed 584 counts) report a worker that exited during startup and then Control answering Busy to its preparation, 11 (afa80e93e4a5ba88), 41 (cf88a35a19f9581e) and 44 (37b7f06e22b6ba52) the first (Actions run 45687381596, each replayed equal). 149 does not show it. 170 and 281 get the Busy with no failed start of that worker reported before it. That the earlier preparation had enrolled was not instrumented at this code, and a replica move was unfinished in some of them."
