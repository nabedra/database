# Found by the adversarial tests of task N (nabedra/oltp-vector-nvme-test). RecordFile::read_round asks the disk for every page of a record, also for the pages that are only in RAM and not in the file yet, so the request ends beyond the file and fails as a short read, although the record is whole in memory. The first auto flush leaves one such record per batch for every record size that does not divide 61,440 bytes (dimension 100, 1,000, 2,048, 4,096), and any size after reuse of released places. In an index the failed read is logged as damage and takes a healthy range out of service (nt26); extensions on NVMe share the code (nt25).
