# Evidence: wave-rv findings OLAP-8 (code reading). The ObjectStore trait has only a whole-object get, and every get,
# collect and count downloads and decodes whole partition objects (server/src/engine/partition.rs), with no ranged
# reads, row-group pruning or footer cache. A point get on a one-partition 64 MiB table reads 64 MiB. Deferred by
# fx-olap: ranged reads need a range call on the trait and every backend plus Parquet reader changes in the engine
# (vector paths). Plan: plans/olap-commit.md, "Capacity plan".
