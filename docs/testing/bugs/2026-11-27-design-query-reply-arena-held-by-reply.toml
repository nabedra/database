# Phase 2 of the 2026-11-26 review (fx-direct-fix, after the land-oltp-direct diagnosis of the OD-1 fixture).
# Confirmed in a test fixture, production exposure by code reading. The worker's Query reply arena is 8 MiB
# (resources/src/memory.rs SharedResourceConfig::default, query_reply_bytes; registered_process.rs native_resources
# keeps it), and every Query-class read reserves the whole 8 MiB first: ParticipantMachine::read_at
# (oltp-storage mvcc/store.rs, output_bytes 8 << 20) and ParticipantHandle::direct_latest (store/handle/direct.rs) go
# through GroupStore::read_namespace -> reply_budget(Query, 8 MiB) -> ByteArena::reserve_wait, which has no deadline.
# The returned ChargedBytes keeps its share of the arena until it is dropped. So while any read_at reply is alive,
# every later Query read on that worker waits, on every group. The fixture fixa.rs
# d05_unknown_proposal_keeps_range_clock_pending_until_apply held its snapshot reply: the next direct_latest did not
# return within 80 s (land-oltp-direct) or 15 s (fx-direct-fix, local, without the drop(seen) fix). In production the
# remote read_at server (oltp-replication service_rpc/participant_full.rs, ParticipantRead) returns the ChargedBytes as
# its RPC reply, and charged bytes share their lifetime with transport frames, so a slow or stalled peer connection
# can hold the arena; a caller that keeps a raw reply while it awaits something else does the same. The same sizing
# also caps a worker at one Query read in native execution at a time, whatever query_threads is.
id = "design-query-reply-arena-held-by-reply"
title = "A live point-read reply holds the worker's whole Query reply arena, so every later Query read on the worker waits for it"
