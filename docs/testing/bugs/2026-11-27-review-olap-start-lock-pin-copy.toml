# Evidence: wave-rv findings OLAP-6 (code reading). Starting a request holds the queue-wide change lock across a
# control-root read, the encoding of the full catalog pin and its copy to every member in turn
# (server/src/node/queue_runtime.rs, replicate_record). Replicated bytes per read request are the root size times
# (W - 1): with a 1 MiB root on 8 workers, 7 MiB per point get, and starts serialize at about 20 to 30 per second.
# Deferred: the start lock and the serial copy are SCHED-7 (fx-sched, #174); pins by reference need an immutable
# per-revision root object (plans/olap-commit.md, "Capacity plan").
