# Found by the adversarial tests of task N (nabedra/oltp-vector-nvme-test). Cores::start takes the state from a closure that returns the value, so a state that cannot be made (a file that does not open) can only panic. The thread dies after it reported its CPU, start returns Ok, panics() stays 0, and every call to that core waits for ever; submit keeps accepting work until the queue limit and then refuses it as overload.
