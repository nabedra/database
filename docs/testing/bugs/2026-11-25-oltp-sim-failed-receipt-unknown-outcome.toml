invariant_added = "Fault model, unattested, NABEDRA_SIM_WORKLOAD=queued, profile mixed,process,network,pause. Seed 6 (625d1236edd4d068 at 6b20e211, repeated by an independent reviewer): four accepted requests (81cc1997, 14233eaf, 17ec56e2, 43697d02) read failed, 'no registered group leader completed the strong service call', outcome unknown, through both gateways. Mutations also in seeds 2, 7, 11, 12 and 16 there, where no rule reported it. AcceptedSettlesInRun reports it at bff842ef in seeds 2 (02ab95159065980b, two identities), 3, 4, 5, 10, 11 and 12 of 1 to 16, and not in seed 6, whose schedule differs there. Suspected product fault. The product path that makes the record terminal was not traced. At c2aad866, where every run installs the probes and has another schedule: AcceptedSettlesInRun reports such receipts in seeds 2 (4bb876cbc0a2277e), 4, 6, 10 and 11 of 1 to 16, not in 3, 5 and 12 (Actions run 45687457689, unattested scratch check on the same code, each replayed equal). In seed 2 it also reports another symptom, not this one and undiagnosed: a query.collect answered 202 at 61.7 s, after many submissions of its ID with an unknown outcome, and not found 10.3 s later, before its 15 s retention from that answer."
