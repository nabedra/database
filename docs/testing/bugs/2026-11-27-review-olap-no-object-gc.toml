# Evidence: wave-rv findings OLAP-4 (code reading). Every mutation rewrites whole partitions under new keys
# (server/src/node/coordinator.rs, payload_owner.rs) and no production path deletes an object: superseded partitions,
# CAS-loser uploads, decisions, index pages of losing attempts and dropped tables stay in the bucket. Steady one-row
# inserts into a 10 MiB table leave a 10 MiB orphan per commit. Deferred by fx-olap: a reclaimer needs a listing call
# on the ObjectStore trait and every backend, a process in the scheduler runtime and the cluster's live pins, and the
# OlapCommit gc baseline does not yet finish within T1. Plan: plans/olap-commit.md, "Capacity plan".
