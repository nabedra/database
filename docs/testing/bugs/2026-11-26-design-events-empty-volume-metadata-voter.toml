# Fixed in fx-events: Control::reopen applies the empty-volume rule (raft::rejoin); regressions in
# control::tests::events_1_*, sim wipe_tests and sim::tests::wipe_sweep (wave-rv/reports/fx-events.md).
# Design review rv-events, finding EVENTS-1 (wave-rv/findings/events.md). The plan allowed it ("Provision stable
# broker IDs"; "joins with an empty volume and catches up from survivors") and the shipped code follows it for the
# metadata group: Control::reopen (server/events/src/control/operate.rs:795) opens METADATA on an empty volume with
# no election floor, so the replica votes with no log and no vote record (raft/mod.rs:409-465).
# TLC (local, unattested): specs/events/mutants/prefix_empty_disk_rejoins_voter.cfg breaks G01_CommittedPrefixesAgree
# in 5 states. Simulator (local scratch test rv_events_wipe_sweep, SimConfig.wipes = true, the harness reopens p0 on
# start like reopen does METADATA): seeds 18 and 26 of 1..40 lose acknowledged publishes (EVT-G01 lost-write), 8 seeds
# break MajorityReachedHighWatermark, AppliedPrefixesAgree or ConsistentCommittedData. Seed field: the server/events sim
# seed (also 18), wipes = true, scratch patch in wave-rv/reports/rv-events.md.
id = "EVENTS-EMPTY-VOLUME-METADATA-VOTER"
title = "A metadata voter restarted on an empty volume rejoins as a voter under its stable ID and votes with no log"
class = "membership-replacement-trust"
module = "events"
guarantees = ["EVT-G01", "EVT-G09", "EVT-G14"]
scenarios = ["EV06", "EV07", "EV08"]
