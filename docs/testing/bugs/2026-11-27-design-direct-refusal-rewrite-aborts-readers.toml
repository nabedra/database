# Phase 2 of the 2026-11-26 review (fx-direct-fix), side effect of the OD-2 fix 37139fd9, candidate by code reading.
# To keep its answer on retry, a direct row conflict (insert of a present row) commits every key it read unchanged,
# each as a new version at its own commit timestamp, and a missed update or delete commits a tombstone over the head it
# read (direct/executor.rs compute; plan section 4). The row's value does not change, but its head does. A queued
# transaction whose snapshot read that key before the rewrite then fails PreparePage with Fault::Conflict ("transaction
# preparation conflicted with an existing version", oltp_runtime/transaction.rs) and must recompute or answer 409. So a
# loop of refused inserts or missed deletes on a hot key, which before OD-2 wrote nothing, now aborts the concurrent
# queued writers of that key, and adds versions that are never reclaimed (design-data-no-version-gc).
id = "design-direct-refusal-rewrite-aborts-readers"
title = "A refused direct insert or a missed delete writes a new version of an unchanged key, which aborts concurrent queued transactions that read it"
