why_not_caught = "The OD-2 tests check the answer and the entry count of a refusal, not its effect on other transactions; D08 mixes direct and queued writers but has no refused insert or missed delete on a key a queued transaction reads."
invariant_added = "Recording a definite no-op or refusal never changes the version a reader of the key validates against: the record is kept in the dedup entry under the key's latch with the head it read as a precondition, and the row's head and versions stay as they were."
