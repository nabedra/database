invariant_added = "Fault model, NABEDRA_SIM_WORKLOAD=topology, default profile, instrumented at 9a6bc79e with unchanged trace hashes (review-136). Seed 4: declaration 96dc193f took the guard and its fence call returned, then its commit answered `commit permit: worker outgoing lane full (Authority)` not_applied. 1,071 later exclusive acquisitions of that table were rejected, and the final writes were refused with 409. Seed 24: declaration 95f75d2b took the guard and its fence call never returned. 998 later acquisitions were rejected, and 267 s after the heal direct mutations still fall back for the schema. Whether that fence reached Data is not known. That these declarations are the holders is inferred from the order. Read in the code: IndexService::declare returns a commit error without settling the attempt. Seed 9 ends with the same refusals and was not instrumented. Review-136: a product behaviour, supported by the instrumented runs and the code."
