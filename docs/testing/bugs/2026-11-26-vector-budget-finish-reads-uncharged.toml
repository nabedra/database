# Found by the adversarial tests of task N (nabedra/oltp-vector-nvme-test). Index::finish builds each hit's row with Rows::full_row, which reads the vector from the store. The scan charged every vector it scored, and finish adds up to limit more reads (1,000 reads of 16 KiB at most) that no budget counts, so a query that ends Ok has read more than its I/O budget. The memory of those rows is not charged either.
