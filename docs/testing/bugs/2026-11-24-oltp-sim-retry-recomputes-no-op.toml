invariant_added = "DR-1. Fault model, scripted schedules with production direct limits, seed 1, run with --ignored: a retry of a mutation with the same request ID and body returns the first definite result of that identity (O08, oltp-contract.md Direct-path retry results). dr1_sequential_retry, no fault: an update of a missing row answers false, another client inserts the row, and the same ID and body then answers true and applies (trace 389ba38e121e19e1). dr1_update and dr1_insert_refused: a first attempt held on a link applies after a retry through the other gateway answered false, or 409 not_applied (traces 7197b0a3958f674d, ae0ebd96f7aaf4df); their lost and not-sent controls stay clean. The history checker reports unstable-result on all three."
