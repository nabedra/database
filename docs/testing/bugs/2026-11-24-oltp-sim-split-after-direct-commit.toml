why_not_caught = "No runner splits a range that has taken direct commits while the direct path stays on, or asks for a second plan after a refused freeze."
invariant_added = "Fault model, NABEDRA_SIM_WORKLOAD=direct NABEDRA_SIM_PROFILE=split, seeds 1 and 2: a requested split publishes within 60 s of the heal, if the operator replaces a refused plan. The source refuses the first plan with DirectCommitAboveCut, and every new ID is then refused with captured schema or lifecycle changed, because the refused plan keeps the exclusive lifecycle guard (traced). An exact retry is refused again, because it keeps its cut. Splits do publish after direct commits: in a mixed sweep of seeds 1 to 720, 42 published with no refusal, 5 after no other refusal than manual split interrupted by worker recovery, and seed 171 after that and one ValidationError (invalid hosted group placement or identity). Of 90 with a refused freeze 21 published, each after the scheduler owner changed and a retry settled the refused plan, and 69 did not. An earlier form of this record said that such a split never publishes, which was wrong."
