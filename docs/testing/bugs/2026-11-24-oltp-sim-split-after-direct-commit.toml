invariant_added = "Fault model, NABEDRA_SIM_WORKLOAD=direct NABEDRA_SIM_PROFILE=split, seeds 1 and 2: a requested split publishes within 60 s of the heal, if the operator replaces a refused plan. The source refuses the first plan with DirectCommitAboveCut, and every new ID is then refused with captured schema or lifecycle changed, because the refused plan keeps the exclusive lifecycle guard (traced). An exact retry is refused again, because it keeps its cut. Splits do publish after direct commits: in a mixed sweep of seeds 1 to 720, 42 published with no refusal, 5 after no other refusal than manual split interrupted by worker recovery, and seed 171 after that and one ValidationError (invalid hosted group placement or identity). Of 90 with a refused freeze 21 published, each after the scheduler owner changed and a retry settled the refused plan, and 69 did not. An earlier form of this record said that such a split never publishes, which was wrong. Also NABEDRA_SIM_WORKLOAD=topology NABEDRA_SIM_PROFILE=none NABEDRA_SIM_TOPOLOGY=no-move,split-under-load, seeds 6, 7, 9 and 11 at d8d58e23: index declarations of the table are refused with captured schema or lifecycle changed for 180 s after the heal. Seed 6, instrumented with an unchanged trace hash (review-136): the refused split's guard is the last exclusive grant on the table, and 1,079 later acquisitions are rejected. At 9a6bc79e a scratch build that asks with new split IDs gets that conflict for them too (seeds 6 and 9). At c2aad866, where every run installs the probes and has another schedule: direct split seeds 1 (5ac4b751e9dd82c3) and 2 (122e6a497a57a399) (local, unattested, replayed equal). Of 154 requested splits in the mixed range 1 to 720, 94 met a refused freeze and 15 of those published; 38 published with no refusal, 6 after only manual split interrupted by worker recovery (2, 24, 203, 215, 243, 437), and 171 after that and one ValidationError (Actions run 45687381596, each replayed equal). Topology split-under-load seeds 6 (fa25d6cde0bf483a), 7, 9 and 11 refuse the index declaration (Actions run 45687381596, each replayed equal)."
