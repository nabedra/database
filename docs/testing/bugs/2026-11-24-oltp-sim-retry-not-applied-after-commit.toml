why_not_caught = "The history checker reads not_applied as a statement about one attempt, and runners retry until a success."
invariant_added = "Fault model, NABEDRA_SIM_WORKLOAD=direct NABEDRA_SIM_PROFILE=crash-leader, seed 2 (NotAppliedNeverCommitted): an identity answered not_applied has no committed entry. Here request 347456a2: unknown outcome, then a retry answered storage_unavailable with not_applied, and its value is in the row. In a mixed sweep of seeds 1 to 720, 56 seeds show the kind. With the probes of #116, all 3 such refusals in 12 seeds were answered to a retry sent after the commit. Also NABEDRA_SIM_WORKLOAD=topology, default profile, seeds 1, 19, 20 and 24 at 9a6bc79e (RefusedWriteInIndex): the identity is answered outcome_unknown, then not_applied, and the row is in a later scan."
