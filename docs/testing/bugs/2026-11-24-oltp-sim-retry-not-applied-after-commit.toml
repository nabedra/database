invariant_added = "Fault model, NABEDRA_SIM_WORKLOAD=direct NABEDRA_SIM_PROFILE=crash-leader, seed 2 (NotAppliedNeverCommitted): an identity answered not_applied has no committed entry. Here request 347456a2: unknown outcome, then a retry answered storage_unavailable with not_applied, and its value is in the row. In a mixed sweep of seeds 1 to 720, 56 seeds show the kind. With the probes of #116, all 3 such refusals in 12 seeds were answered to a retry sent after the commit. Also NABEDRA_SIM_WORKLOAD=topology, default profile, seeds 15, 17 and 19 at 715e062f (RefusedWriteInIndex): the identity is answered outcome_unknown, then not_applied, and its effect is in a later scan. At c2aad866, where every run installs the probes and has another schedule: direct crash-leader seed 2 (8ce84a87f1b65f0a) shows request 347456a2 (local, unattested, replayed equal), and 101 seeds of the mixed range 1 to 720 report the kind, judged by identity and body (decision 12.1). In topology RefusedWriteInIndex is in default seeds 6 (94fbf2b353c0e2f9), 17 (492eb4bb7dfb032b) and 19 (72fbb7f33837b7dc), not in 15 (Actions run 45687381596, each replayed equal)."
