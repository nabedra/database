# Found by the rv-dense review (2026-11-27). RecordFile::put takes released records last in,
# first out (file.rs:194). Reusing one reads its page from disk to keep the neighbours (file.rs:125,
# dirty); if that page is damaged the put fails and pushes the record back on top of the free list
# (file.rs:198-213), so every later put of the file takes the same record and fails, although an
# appended record would work. In an index each failed put is Error::Store and fails the range
# (index/mod.rs:631), so after one damaged page a resync of any range of that core fails as soon
# as its puts reach the record, contrary to plan section 5 (damaged NVMe recovers). Evidence:
# `cargo-slot test -p nabedra-vector --lib -- --ignored vs52_` on 267e55dc + the test, both backends:
# "10 of 10 later puts failed on the one damaged free record", log
# /home/dev/logs/oltp-vector/w3/rv-dense/b/t1.log.
id = "VECTOR-nvme-damaged-free-record-blocks-puts"
title = "A released record on a damaged NVMe page refuses every later put of its file"
class = "resource-release-order"
module = "vector"
guarantees = ["VEC-G10", "VEC-G11"]
