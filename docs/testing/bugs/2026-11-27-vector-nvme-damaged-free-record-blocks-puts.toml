lowest_regression = "server/vector/src/store/tests.rs::vs52_a_damaged_free_record_does_not_refuse_every_later_put_pread"
seed = "unknown"
why_not_caught = "The damage tests read damaged records or fail a range once; none puts again after a damaged record was released."
invariant_added = "After damage, a put that cannot read a record page fails once and marks the page: no later put takes a released record of it or appends a record onto it, and later puts of other versions succeed and read back exactly (store/tests.rs vs52_a_damaged_page_costs_one_failed_put_whatever_its_records)."
