# Deterministic in shape; the RSS figure varies a little by allocator. Ignored opt-in lib test, release
# build; fails on 5df7214f and cef218b9 with 89 MB for 15 MB of vectors (w4/idx3/ignored-tenant.log).
# Diagnosis (from code, not measured per structure): each one-row tenant keeps the raw vector in the
# row store, an f32 copy of its direction in the ExactCodec block (server/vector/src/index/codec.rs:142)
# and a dim-sized centroid for its own new partition (server/vector/src/index/mod.rs:383), so about three
# copies before tree, summary and allocator overhead. A one-row partition could share the row direction
# as its centroid, or the bound could be stated for the quantized codec.
