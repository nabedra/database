invariant_added = "Fault model, NABEDRA_SIM_WORKLOAD=membership, NABEDRA_SIM_MEMBERSHIP=wipe, NABEDRA_SIM_PROFILE=none, seeds 1, 6, 9, 20 and 22 of 1 to 24 at d63ba0dc (check oltp-sim-membership-wipe, Actions run 45648985850, kind StepReplacement, each after a preparation and replayed equal; seed 1 is trace 005718128f1200ee), and seeds 6, 15 and 28 of the default profile in the same run: after worker.restart.prepare, worker.system_replacement.check for that worker answers could not verify a surviving RF3 quorum on both survivors. The survivor refuses its own probe of the lost worker, target incarnation differs from cached enrollment, so the probe is indeterminate. By reading, the next check refuses while a preparation exists, and only the worker's join or a cold fence clears one. No contract gives a bound. Distinct from OLTP-sim-enrolled-restart-blocks-prepare, where the preparation had enrolled. At c2aad866, where every run installs the probes and has another schedule: the same seeds, wipe 1 (825b89cc0828b774), 6, 9, 20 and 22 and default 6 (0f31523169b6822c), 15 and 28 (Actions run 45687381596, each replayed equal)."
