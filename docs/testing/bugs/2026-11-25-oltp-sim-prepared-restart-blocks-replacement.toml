invariant_added = "Fault model, NABEDRA_SIM_WORKLOAD=membership, NABEDRA_SIM_MEMBERSHIP=wipe, NABEDRA_SIM_PROFILE=none, seeds 1, 6, 7, 9, 20 and 22 of 1 to 24 at 98c86c41 and at 21108812 (local and unattested, kind StepReplacement, each after a preparation and replayed equal; seed 6 is trace 41f02c456a770ed0): after worker.restart.prepare, worker.system_replacement.check for that worker answers could not verify a surviving RF3 quorum on both survivors. The survivor refuses its own probe of the lost worker, target incarnation differs from cached enrollment, so the probe is indeterminate. By reading, the next check refuses while a preparation exists, and only the worker's join or a cold fence clears one. No contract gives a bound. Distinct from OLTP-sim-enrolled-restart-blocks-prepare, where the preparation had enrolled."
