# Found by the bench agent on main 2cbfb7f4 (Actions runs 45972521812, 45976460728, 45979286742: dense
# streaming setup collect gets no reply within the ORM's 40 s; 45986355076: a sparse_wide 202 table.get or
# query.count does not settle in 20 s, about 1 in 47). Reproduced by fx-sched with release builds: the
# dense_fast setup plus its first collect fails 6 of 30 on main 12b4f011 (server code identical to 2cbfb7f4).
# Instrumented main builds trace it. (1) A remote worker answers one partition job of the read with 503
# storage_unavailable: prepare_captured fails with LimitExceeded (payload_owner.rs maps it to
# OwnerError::Invalid, runtime.rs to unavailable). (2) The coordinator maps the job 503 to outcome Unknown
# for the whole read. (3) The pump skipped any record with three failed attempts forever (SCHED-3);
# takeovers reset the counter, so each stalled read shows exactly six failed attempts and then never runs
# again. Neither the trace TCP forwarder nor keep-alive is involved: the client pools no idle connections,
# and the remote's own job handler returns the 503.
# Root of the job failure: engine/partition.rs download_file reserved the whole task_memory_limit_bytes
# (256 MiB) for every partition read, even a 10 KB file, while the coordinator's ledger charges the job
# estimate. A second concurrent read on a 1-thread bench worker was refused at once ("worker resource limit
# exceeded", or "bounded operator cannot retain output while awaiting more memory" from
# check_buffered_growth). No object read failed.
# Fixes: 923d68b7 (capped backoff, no permanent skip) cures the wedge: 0 of 30 failures at c857dd78, but
# collects needed retries and took up to 10 s. bc797570 sizes read reservations by the job estimate and
# answers a memory refusal as a definite, retryable 429 instead of an unknown outcome: 0 of 30 failures at
# 139e8ce9, first collect 0.82 to 2.48 s (median about 0.93 s), whole invocation 5 to 10 s.
id = "REVIEW-olap-read-wedge-after-job-503"
title = "An OLAP read whose partition job hits a transient LimitExceeded on a worker turns unknown and, after three attempts, is never dispatched again"
