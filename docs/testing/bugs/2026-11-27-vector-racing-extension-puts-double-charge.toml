# Suspected by the rv-dense review (2026-11-27), confirmed by task fix-dense. Extensions::put checks
# the key and inserts it under separate holds of the RAM map, so racing puts of one key both pass
# the check: both take RAM and charge the code memory twice for one entry (one release gives half
# back), or one takes RAM and one NVMe and the key is held twice. Evidence: `cargo-slot test -p
# nabedra-vector --lib -- --ignored vs17_racing_puts` fails with "room ..., key ...: N puts
# succeeded" (store/tests.rs), log /home/dev/logs/oltp-vector/w3/fix-dense/red.log. store/ext.rs
# belongs to perf1; the proposed fix is /home/dev/logs/oltp-vector/w3/fix-dense/perf1-ext.diff,
# with which the test passed (green.log) and the double-charge mutant was killed (red.log).
