why_not_caught = "RecallEstimate is documented as a heuristic that the recall gates measure; no test compared an approximate scan with brute force on unequal lengths. Its estimate moves in steps of 1/limit, so at limit 10 every target above 0.9 is the same rule (no top-10 hit in the last window), and the window does not see the length bands that dot and l2 read last."
invariant_added = "An approximate scan that asks for recall 0.99 reaches recall@10 >= 0.95 against brute force in f64, for cosine, dot and l2, on clustered vectors with log-normal lengths."
