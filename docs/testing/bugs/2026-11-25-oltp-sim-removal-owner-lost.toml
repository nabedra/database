invariant_added = "Fault model, NABEDRA_SIM_WORKLOAD=membership, NABEDRA_SIM_MEMBERSHIP=thaw-kill, NABEDRA_SIM_PROFILE=none, seeds 3, 19, 20 and 21 of 1 to 24 at 635f32ef (check oltp-sim-membership-thaw, Actions run 45656130632, kind LostWorkerListed, each replayed equal; seed 3 is trace bc7331fc5a85a610), and seeds 7 and 18 of oltp-sim-membership-wipe in the same run: the owner freezes for 20 s, another worker takes the ownership over and begins to remove it, the old owner thaws, and the new owner is killed. Both survivors run and exchange frames, still list three ready workers, and at most 2 writes commit. A diagnostic build (local, unattested, same traces) shows a pending removal of the thawed worker and the killed owner on both survivors in all six seeds. By reading, supervise_membership in worker_runtime/recovery.rs returns while a transition is pending unless the local worker is the owner or the next owner, so nobody replaces a dead owner. Seed 3 was unchanged after 900 virtual seconds. Seeds 3 and 21 recover when the kill is left out. No text bounds this. At c2aad866, where every run installs the probes and has another schedule: LostWorkerListed in the same seeds, thaw-kill 3 (6a29b0753d3d3007), 19, 20 and 21 and wipe 7 (a0d018f88d5eaa73) and 18 (d62d03a0c831fb3f) (Actions run 45687381596, each replayed equal). The diagnostic build was not repeated."
