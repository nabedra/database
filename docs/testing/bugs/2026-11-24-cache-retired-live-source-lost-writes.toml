lowest_regression = "server/src/cache/cluster/sim/mutants.rs::planted_retired_promotion_commits_early_scripted"
seed = 1
why_not_caught = "The relaxed Cache checker has no time window in simulation, so it allows any acknowledged write above the retained prefix, and the committed schedules neither kept the peer link open during such a retirement nor asserted the surviving value."
invariant_added = "A copy keeps applying its retired source's deltas until it installs a newer epoch, and apply refuses a staged promotion before the controller's lower bound reaches the prior grant's expiry; the sim flags any mutation published after a successor kept its prefix (AckAfterHandover)."
fix_commits = ["f1b392f7b35c7dfae6bab001dbaa1d4d7a3c2bd8", "7ed7f21bdc4ceb62253ebbe40f22c6ac6d40171a", "6d40164dc6679e39ca21b6302d3c18c4218adee7"]
