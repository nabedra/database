\* Tier T1. Two rows, a drain and a reassignment overlapping one scan.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    a = a
    b = b
    p1 = p1
    p2 = p2
    p3 = p3
    q1 = q1
    q2 = q2
    Slots <- MCSlots
    Parts <- MCParts3
    First <- MCFirst1
    Queries <- MCQueries
    MaxOps = 2
    MaxDrains = 1
    MaxMoves = 1
    MaxCheckpoints = 0
    MaxCrashes = 0
    MaxResyncs = 0
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK ExactScan NoStaleEntry NoDuplicate NoLostRow SingleGeneration
CHECK_DEADLOCK TRUE
SYMMETRY Symm
