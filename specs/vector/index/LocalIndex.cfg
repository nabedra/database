\* Tier T1. Two rows, three operations, one split or merge, one reassignment, two scans.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    a = a
    b = b
    p1 = p1
    p2 = p2
    p3 = p3
    p4 = p4
    q1 = q1
    q2 = q2
    Slots <- MCSlots
    Parts <- MCParts3
    First <- MCFirst1
    Queries <- MCQueries2
    MaxOps = 3
    MaxDrains = 1
    MaxMoves = 1
    MaxCheckpoints = 0
    MaxCrashes = 0
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK ExactScan NoStaleEntry NoDuplicate NoLostRow
CHECK_DEADLOCK FALSE
SYMMETRY Symm
