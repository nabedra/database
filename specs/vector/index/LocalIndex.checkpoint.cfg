\* Tier T1. Checkpoint and crash with and without the disk, with a split or merge and two
\* reassignments.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    a = a
    b = b
    p1 = p1
    p2 = p2
    p3 = p3
    p4 = p4
    q1 = q1
    q2 = q2
    Slots <- MCSlots
    Parts <- MCParts3
    First <- MCFirst1
    Queries <- MCNone
    MaxOps = 3
    MaxDrains = 1
    MaxMoves = 2
    MaxCheckpoints = 1
    MaxCrashes = 1
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK ExactScan NoStaleEntry NoDuplicate NoLostRow
CHECK_DEADLOCK FALSE
SYMMETRY Symm
