\* Tier T1. A resync or drop and back, with copies in flight, a crash and a scan.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    a = a
    b = b
    p1 = p1
    p2 = p2
    p3 = p3
    q1 = q1
    q2 = q2
    Slots <- MCOneSlot
    Parts <- MCParts2
    First <- MCFirst2
    Queries <- MCQueries
    QueriesOn = TRUE
    MaxOps = 2
    MaxFlight = 2
    MaxDrains = 0
    MaxMoves = 1
    MaxCheckpoints = 0
    MaxCrashes = 1
    MaxResyncs = 2
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK ExactScan NoStaleEntry NoDuplicate NoLostRow SingleGeneration
SYMMETRY Symm
CHECK_DEADLOCK TRUE
