\* Tier T1. A resync and a crash with copies in flight, and a scan.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    a = a
    b = b
    p1 = p1
    p2 = p2
    p3 = p3
    q1 = q1
    q2 = q2
    Slots <- MCOneSlot
    Parts <- MCParts2
    First <- MCFirst2
    Queries <- MCQueries
    MaxOps = 2
    MaxDrains = 1
    MaxMoves = 1
    MaxCheckpoints = 1
    MaxCrashes = 1
    MaxResyncs = 1
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK ExactScan NoStaleEntry NoDuplicate NoLostRow SingleGeneration
CHECK_DEADLOCK TRUE
SYMMETRY Symm
