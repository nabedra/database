\* Tier T1, liveness: two drains end, also when one is the target of the other.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    a = a
    b = b
    p1 = p1
    p2 = p2
    p3 = p3
    q1 = q1
    q2 = q2
    Slots <- MCOneSlot
    Parts <- MCParts3
    First <- MCFirst1
    Queries <- MCNone
    MaxOps = 1
    MaxFlight = 2
    MaxDrains = 2
    MaxMoves = 0
    MaxCheckpoints = 0
    MaxCrashes = 0
    MaxResyncs = 0
    None = None
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES DrainEnds
CHECK_DEADLOCK TRUE
