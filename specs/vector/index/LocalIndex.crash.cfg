\* Tier T1. Two checkpoints and two crashes of any kind over a drain and a move.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    a = a
    b = b
    p1 = p1
    p2 = p2
    p3 = p3
    q1 = q1
    q2 = q2
    Slots <- MCOneSlot
    Parts <- MCParts3
    First <- MCFirst1
    Queries <- MCNone
    MaxOps = 2
    MaxDrains = 1
    MaxMoves = 1
    MaxCheckpoints = 2
    MaxCrashes = 2
    MaxResyncs = 0
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK ExactScan NoStaleEntry NoDuplicate NoLostRow SingleGeneration
CHECK_DEADLOCK TRUE
SYMMETRY Symm
