\* Tier T1. Two workers, a move there and back, two queries, two writes, a lost disk and a lost message.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Workers <- MCWorkers
    Queries <- MCQueries2
    MaxWrites = 2
    MaxMoves = 2
    MaxCrashes = 1
    MaxLost = 1
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK LatestRealTime NeverServeEmpty PublishedCaughtUp
CHECK_DEADLOCK TRUE
