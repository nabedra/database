\* Tier T1, liveness: a floor does not starve a commit.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Ranges <- MCOneRange
    Directs <- MCDirects
    Home <- MCHome
    Batch <- MCNone
    Queries <- MCNone
    MaxAttempts = 5
    MaxElections = 1
    MaxCloses = 2
    MaxForgets = 0
    MaxUnknown = 1
    MaxTs = 6
    None = None
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES DirectCommits RangeCloses
CHECK_DEADLOCK TRUE
