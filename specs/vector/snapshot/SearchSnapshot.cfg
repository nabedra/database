\* Tier T1. Two ranges, a cross-range batch, a direct commit with a retry, a leader change, a
\* worker resync, one Closed per range and one query.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Ranges <- MCRanges
    Directs <- MCDirects
    Home <- MCHome
    Batch <- MCBatch
    Queries <- MCQueries
    MaxAttempts = 2
    MaxElections = 1
    MaxCloses = 1
    MaxForgets = 1
    MaxTs = 6
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK SnapshotExact ClosedIsFinal
CHECK_DEADLOCK FALSE
