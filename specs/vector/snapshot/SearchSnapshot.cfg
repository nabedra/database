\* Tier T1. Two ranges, a cross-range batch, a direct commit, a leader change, a worker resync, one Closed
\* per range and one query.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Ranges <- MCRanges
    Directs <- MCDirects
    Home <- MCHome
    Batch <- MCBatch
    Queries <- MCQueries
    QueriesOn = TRUE
    MaxAttempts = 1
    MaxElections = 1
    MaxCloses = 1
    MaxForgets = 1
    MaxUnknown = 1
    MaxTs = 3
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK SnapshotExact ClosedIsFinal
CHECK_DEADLOCK TRUE
