\* Tier T1. One range, two competing direct commits with retries, two Closed entries.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Ranges <- MCOneRange
    Directs <- MCDirects2
    Home <- MCHome
    Batch <- MCNone
    Queries <- MCQueries
    MaxAttempts = 2
    MaxElections = 2
    MaxCloses = 2
    MaxForgets = 2
    MaxTs = 6
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK SnapshotExact ClosedIsFinal
CHECK_DEADLOCK FALSE
