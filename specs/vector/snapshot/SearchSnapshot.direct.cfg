\* Tier T1. One range, two competing direct commits with retries, two Closed entries, two leader changes or
\* unknown outcomes.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Ranges <- MCOneRange
    Directs <- MCDirects2
    Home <- MCHome
    Batch <- MCNone
    Queries <- MCQueries
    QueriesOn = TRUE
    MaxAttempts = 2
    MaxElections = 1
    MaxCloses = 2
    MaxForgets = 1
    MaxUnknown = 1
    MaxTs = 5
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK SnapshotExact ClosedIsFinal
CHECK_DEADLOCK TRUE
