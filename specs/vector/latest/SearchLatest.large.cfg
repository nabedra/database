    q1 = q1
    q2 = q2
    Ranges <- MCRanges
    Workers <- MCWorkers2
    Queries <- MCQueries
    Singles <- MCSingles
    Batches <- MCBatches
    Parts <- MCPartsLarge
    Deletable <- MCSingles
    MaxElections = 2
    MaxCrashes = 2
    MaxLost = 2
    MaxDups = 2
    MaxPurges = 2
    MaxBarriers = 3
    MaxLog = 4
