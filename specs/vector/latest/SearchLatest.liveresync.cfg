\* Tier T1, liveness once the faults are spent, with a purge and a resync.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    q1 = q1
    q2 = q2
    Ranges <- MCOneRange
    Workers <- MCWorkers
    Queries <- MCOneQuery
    Singles <- MCSingles
    Batches <- MCBatches
    BatchesOn = FALSE
    Parts <- MCParts
    Deletable <- MCNone
    MaxElections = 0
    MaxCrashes = 1
    MaxLost = 0
    MaxDups = 0
    MaxPurges = 1
    MaxBarriers = 5
    MaxLog = 4
    None = None
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES QueryProgress
CHECK_DEADLOCK TRUE
