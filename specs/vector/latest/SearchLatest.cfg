\* Tier T1. One range against an arbitrary environment: two queries sharing barriers or in sequence, a write
\* and its delete, a leader change, a crash, a lost and a repeated message.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    q1 = q1
    q2 = q2
    Ranges <- MCOneRange
    Workers <- MCWorkers
    Queries <- MCQueries
    Singles <- MCSingles
    Batches <- MCNone
    Parts <- MCParts
    Deletable <- MCSingles
    MaxElections = 1
    MaxCrashes = 1
    MaxLost = 1
    MaxDups = 1
    MaxPurges = 0
    MaxBarriers = 2
    MaxLog = 4
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK LatestRealTime MonotoneLatest NoInvisibleRow
SYMMETRY Symm
CHECK_DEADLOCK TRUE
