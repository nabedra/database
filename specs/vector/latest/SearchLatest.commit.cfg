\* Tier T1, liveness with no fairness on any search action.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    q1 = q1
    q2 = q2
    Ranges <- MCOneRange
    Workers <- MCWorkers
    Queries <- MCOneQuery
    Singles <- MCSingles
    Batches <- MCNone
    Parts <- MCParts
    Deletable <- MCNone
    MaxElections = 1
    MaxCrashes = 1
    MaxLost = 0
    MaxDups = 0
    MaxPurges = 0
    MaxBarriers = 1
    None = None
    Mutant = "none"
SPECIFICATION CommitSpec
INVARIANTS TypeOK
PROPERTIES CommitIndependent
CHECK_DEADLOCK FALSE
