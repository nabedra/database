\* Tier T1. One range of a cross-range batch whose other participants are arbitrary, a single write, one
\* query, a leader change, a crash and a lost message.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    q1 = q1
    q2 = q2
    Ranges <- MCOneRange
    Workers <- MCWorkers
    Queries <- MCOneQuery
    Singles <- MCSingles
    Batches <- MCBatches
    BatchesOn = TRUE
    Parts <- MCParts
    Deletable <- MCNone
    MaxElections = 1
    MaxCrashes = 1
    MaxLost = 1
    MaxDups = 0
    MaxPurges = 0
    MaxBarriers = 2
    MaxLog = 4
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK LatestRealTime MonotoneLatest NoInvisibleRow
CHECK_DEADLOCK TRUE
