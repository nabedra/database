\* Tier T1. One range of a cross-range batch whose other participants are arbitrary, a single write,
\* one query, and every fault once, overlapping.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    q1 = q1
    q2 = q2
    Ranges <- MCOneRange
    Workers <- MCWorkers
    Queries <- MCOneQuery
    Singles <- MCSingles
    Batches <- MCBatches
    Parts <- MCParts
    Deletable <- MCNone
    MaxElections = 1
    MaxCrashes = 1
    MaxLost = 1
    MaxDups = 1
    MaxPurges = 1
    MaxBarriers = 2
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK LatestRealTime NoInvisibleRow
CHECK_DEADLOCK FALSE
