\* Tier T1, liveness once the faults are spent, with an open batch to resolve.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    q1 = q1
    q2 = q2
    Ranges <- MCOneRange
    Workers <- MCWorkers
    Queries <- MCOneQuery
    Singles <- MCNone
    Batches <- MCBatches
    BatchesOn = TRUE
    Parts <- MCParts
    Deletable <- MCNone
    MaxElections = 1
    MaxCrashes = 1
    MaxLost = 1
    MaxDups = 0
    MaxPurges = 0
    MaxBarriers = 5
    MaxLog = 4
    None = None
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES QueryProgress
CHECK_DEADLOCK TRUE
