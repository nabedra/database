\* Tier T1, liveness once the faults are spent. One barrier per fault that can consume one, plus one.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    q1 = q1
    q2 = q2
    Ranges <- MCOneRange
    Workers <- MCWorkers
    Queries <- MCOneQuery
    Singles <- MCSingles
    Batches <- MCNone
    Parts <- MCParts
    Deletable <- MCNone
    MaxElections = 1
    MaxCrashes = 1
    MaxLost = 1
    MaxDups = 0
    MaxPurges = 1
    MaxBarriers = 4
    None = None
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES QueryProgress
CHECK_DEADLOCK FALSE
