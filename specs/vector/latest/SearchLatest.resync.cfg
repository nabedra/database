\* Tier T1. One query, every fault once, overlapping.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    q1 = q1
    q2 = q2
    Ranges <- MCOneRange
    Workers <- MCWorkers
    Queries <- MCOneQuery
    Singles <- MCSingles
    Batches <- MCBatches
    BatchesOn = FALSE
    Parts <- MCParts
    Deletable <- MCSingles
    MaxElections = 1
    MaxCrashes = 1
    MaxLost = 1
    MaxDups = 1
    MaxPurges = 1
    MaxBarriers = 2
    MaxLog = 4
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK LatestRealTime MonotoneLatest NoInvisibleRow
CHECK_DEADLOCK TRUE
