\* Tier T1. Two texts, three writes, a metadata update, a leader change, a lost and a repeated message,
\* an embedder crash.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Texts <- MCTexts
    Embedders <- MCOne
    MaxWrites = 3
    MaxUpdates = 1
    MaxReAdds = 0
    MaxLeaders = 1
    MaxCrashes = 1
    MaxLost = 1
    MaxDups = 1
    MaxErrors = 0
    MaxRequeues = 0
    MaxAttempts = 2
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK VectorMatchesSource DeletedStaysDeleted PendingWhenNeeded CountedOnce
CHECK_DEADLOCK TRUE
