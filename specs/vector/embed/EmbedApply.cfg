\* Tier T1. Two texts, four writes, a column dropped and added again, two embedders, every fault once.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Texts <- MCTexts
    Embedders <- MCEmbedders
    MaxWrites = 4
    MaxReAdds = 1
    MaxLeaders = 1
    MaxCrashes = 1
    MaxLost = 1
    MaxDups = 1
    MaxErrors = 2
    MaxAttempts = 2
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK VectorMatchesSource DeletedStaysDeleted PendingWhenNeeded NoSpuriousFailure
CHECK_DEADLOCK FALSE
