\* Tier T1. Provider errors, repeated reports, requeue, a text change, two embedders, a leader change.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Texts <- MCTexts
    Embedders <- MCEmbedders
    MaxWrites = 2
    MaxUpdates = 0
    MaxReAdds = 0
    MaxLeaders = 1
    MaxCrashes = 0
    MaxLost = 0
    MaxDups = 1
    MaxErrors = 3
    MaxRequeues = 1
    MaxAttempts = 2
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK VectorMatchesSource DeletedStaysDeleted PendingWhenNeeded CountedOnce
CHECK_DEADLOCK TRUE
