\* Tier T1, liveness once writes and faults are spent.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Texts <- MCTexts
    Embedders <- MCOne
    MaxWrites = 3
    MaxReAdds = 1
    MaxLeaders = 1
    MaxCrashes = 1
    MaxLost = 1
    MaxDups = 0
    MaxErrors = 1
    MaxAttempts = 2
    None = None
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES EventuallyEmbedded
CHECK_DEADLOCK FALSE
