\* Tier T1, liveness with provider errors, a lost report and a requeue or restore.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Texts <- MCTexts
    Embedders <- MCOne
    MaxWrites = 1
    MaxUpdates = 0
    MaxReAdds = 0
    MaxLeaders = 0
    MaxCrashes = 0
    MaxLost = 1
    MaxDups = 0
    MaxErrors = 2
    MaxRequeues = 1
    MaxAttempts = 2
    None = None
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES EventuallyEmbedded
CHECK_DEADLOCK TRUE
