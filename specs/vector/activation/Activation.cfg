\* Tier T1. Four workers, six restarts with either build: a full upgrade and two downgrades.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Workers <- MCWorkers
    MaxRestarts = 6
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK EveryMemberDecodes
CHECK_DEADLOCK TRUE
