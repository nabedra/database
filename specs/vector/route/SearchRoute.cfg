\* Tier T1. A split at every step, two writes, a Closed entry, two worker crashes and a resync, one query of
\* either mode on any cached route, with partial answers.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Queries <- MCQueries
    MaxWrites = 2
    MaxCloses = 1
    MaxCrashes = 2
    MaxForgets = 1
    MaxTs = 3
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK ExactCoverage LatestRealTime SnapshotExact
CHECK_DEADLOCK TRUE
