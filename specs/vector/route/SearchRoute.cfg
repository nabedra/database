\* Tier T1. Three groups, a split at every step, three writes, two closes, a worker crash, one query of
\* either mode on any cached route.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Queries <- MCQueries
    MaxWrites = 3
    MaxCloses = 2
    MaxCrashes = 1
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK ExactCoverage LatestRealTime SnapshotExact
CHECK_DEADLOCK FALSE
