\* Tier T1. Two writes and two Closed entries across a split, with a resync.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Queries <- MCQueries
    MaxWrites = 2
    MaxCloses = 2
    MaxCrashes = 0
    MaxForgets = 1
    MaxTs = 3
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK ExactCoverage LatestRealTime SnapshotExact
CHECK_DEADLOCK TRUE
