\* Tier T1. Five writes, two copies, a crashed copy.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    MaxWrites = 5
    MaxCopies = 2
    MaxCrashes = 1
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK NoDanglingBlob CopyComplete CopyKeepsPending
CHECK_DEADLOCK FALSE
