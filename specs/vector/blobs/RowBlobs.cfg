\* Tier T1. Four writes, two copies of either kind, two crashed copies, an open transaction.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    MaxWrites = 4
    MaxCopies = 3
    MaxCrashes = 2
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK NoDanglingBlob CopyExact CopyComplete CopyKeepsRecord
CHECK_DEADLOCK TRUE
