\* Tier T1. One range with two search replicas.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Ranges <- MCOneRange
    Workers <- MCWorkers
    Queries <- MCQueries
    MaxCols = 2
    MaxFailovers = 1
    MaxLosses = 1
    MaxDrops = 1
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK NeverServeWrongColumn NeverServeUnready PublishedComplete
CHECK_DEADLOCK FALSE
