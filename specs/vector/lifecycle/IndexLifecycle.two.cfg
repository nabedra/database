\* Tier T1. Two ranges with two search replicas each.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Ranges <- MCRanges
    Workers <- MCWorkers
    Queries <- MCQueries
    QueriesOn = TRUE
    MaxCols = 2
    MaxFailovers = 1
    MaxLosses = 1
    MaxLostReports = 1
    MaxDrops = 2
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK NeverServeWrongColumn NeverServeUnready PublishedComplete
CHECK_DEADLOCK TRUE
