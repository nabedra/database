\* Tier T1. Two ranges, a column dropped and added again, two queries, late and repeated fences, a Control
\* failover, a lost disk and a lost report.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Ranges <- MCRanges
    Workers <- MCOneWorker
    Queries <- MCQueries2
    MaxCols = 2
    MaxFailovers = 1
    MaxLosses = 1
    MaxLostReports = 1
    MaxDrops = 2
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK NeverServeWrongColumn NeverServeUnready PublishedComplete
CHECK_DEADLOCK TRUE
