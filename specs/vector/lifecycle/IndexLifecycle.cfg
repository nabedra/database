\* Tier T1. Two ranges, one worker per range set, a column dropped and added again, a Control failover
\* and a lost disk or report.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Ranges <- MCRanges
    Workers <- MCOneWorker
    Queries <- MCQueries
    MaxCols = 2
    MaxFailovers = 1
    MaxLosses = 1
    MaxDrops = 1
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK NeverServeWrongColumn NeverServeUnready PublishedComplete
CHECK_DEADLOCK FALSE
