\* Tier T1, liveness once the faults are spent.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Ranges <- MCRanges
    Workers <- MCOneWorker
    Queries <- MCNone
    MaxCols = 2
    MaxFailovers = 1
    MaxLosses = 1
    MaxLostReports = 1
    MaxDrops = 2
    None = None
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES BuildTerminates
CHECK_DEADLOCK TRUE
