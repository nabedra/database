\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    p1 = p1
    p2 = p2
    Nodes = {n1, n2, n3}
    Producers = {p1, p2}
    MaxTerm = 5
    MaxCrashes = 2
    MaxStopAll = 1
    MaxWipes = 1
    MaxPartitions = 2
    MaxDrops = 2
    MaxDups = 1
    Mutant = "none"
    Items <- MCItems
INIT Init
NEXT Next
SYMMETRY MCSymmetry
INVARIANT TypeOK
INVARIANT G01_AckedPublishSurvives
INVARIANT G01_CommittedPrefixesAgree
INVARIANT G02_OffsetsStable
INVARIANT G02_Contiguous
INVARIANT G03_RetryReturnsOriginal
INVARIANT G04_BatchWhole
INVARIANT G06_ReadIndexSafe
CHECK_DEADLOCK TRUE
