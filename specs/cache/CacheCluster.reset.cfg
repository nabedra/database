\* Operator scoped and fleet cold reset with a SET and a delayed replication reply.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    w1 = w1  w2 = w2  w3 = w3  c1 = c1  c2 = c2
    Workers = {w1, w2, w3}
    Clients = {c1, c2}
    Slots = {s1}
    Keys = {k1}
    NoNode = NoNode
    Sys = Sys
    InitPlaces <- AllPlaces
    D = 1
    MaxDrift = 1
    L = 3
    RA = 3
    G = 3
    TTL = 1
    MaxLag = 0
    MaxTime = 4
    GST = 4
    MaxEpoch = 2
    MaxWrites = 1
    MaxCrashes = 0
    MaxRestarts = 0
    MaxReplaces = 0
    MaxCtrlCuts = 0
    MaxPeerCuts = 0
    MaxLoss = 0
    MaxDelays = 1
    MaxLeaderChanges = 0
    MaxDriftSteps = 0
    MaxResets = 1
    MaxMoves = 0
    InitSkew = 0
    Ops = {"set"}
    Mutant = "none"
    Variant = {}
SYMMETRY Sym
INVARIANTS
    TypeOK
    ClockAssumption
    G07_SlotOwnership
    G06_LeaseExclusive
    G06_ServedEpochOrder
    G05_ReplicaPrefix
    G05_PromotedPrefix
    G02_ExpiredNeverReturns
    G02_NoResurrection
    G09_ColdStartEmpty
    D6_LagBound
CHECK_DEADLOCK TRUE
