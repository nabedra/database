\* Liveness, no symmetry: one crash before GST, decision 6 repair under fairness.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION LiveSpec
CONSTANTS
    w1 = w1  w2 = w2  w3 = w3  c1 = c1  c2 = c2
    Workers = {w1, w2, w3}
    Clients = {c1, c2}
    Slots = {s1}
    Keys = {k1}
    NoNode = NoNode
    Sys = Sys
    InitPlaces <- OnePlace
    D = 1
    L = 3
    RA = 3
    G = 3
    TTL = 1
    MaxLag = 0
    MaxTime = 8
    GST = 2
    MaxEpoch = 3
    MaxWrites = 0
    MaxCrashes = 1
    MaxRestarts = 0
    MaxReplaces = 0
    MaxCuts = 0
    MaxLoss = 0
    MaxDelays = 0
    MaxLeaderChanges = 0
    MaxDriftSteps = 0
    MaxResets = 0
    InitSkew = 0
    Mutant = "none"
    Variant = "none"
INVARIANTS
    TypeOK
PROPERTIES
    D6_StagedRepair
CHECK_DEADLOCK TRUE
