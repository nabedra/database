\* Automatic staged cold reset with a crash and a leadership change.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    w1 = w1  w2 = w2  w3 = w3  c1 = c1  c2 = c2
    Workers = {w1, w2, w3}
    Clients = {c1, c2}
    Slots = {s1}
    Keys = {k1}
    NoNode = NoNode
    Sys = Sys
    InitPlaces <- AllPlaces
    D = 1
    L = 3
    RA = 3
    G = 3
    TTL = 1
    MaxLag = 0
    MaxTime = 7
    GST = 7
    MaxEpoch = 2
    MaxWrites = 0
    MaxCrashes = 1
    MaxRestarts = 0
    MaxReplaces = 0
    MaxCuts = 0
    MaxLoss = 0
    MaxDelays = 0
    MaxLeaderChanges = 1
    MaxDriftSteps = 0
    MaxResets = 0
    InitSkew = 0
    Mutant = "none"
    Variant = "none"
SYMMETRY Sym
INVARIANTS
    TypeOK
    ClockAssumption
    G07_SlotOwnership
    G06_LeaseExclusive
    G06_ServedEpochOrder
    G05_ReplicaPrefix
    G05_PromotedPrefix
    G02_ExpiredNeverReturns
    G09_ColdStartEmpty
    D6_LagBound
CHECK_DEADLOCK TRUE
