\* expect: G04_HoldersAgree
\* Mutant: a holder applies any install, with no term, identity or version check.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    c1 = c1
    c2 = c2
    Nil = Nil
    BatchRows = 2
    DropLast = FALSE
    MaxCrashes = 1
    MaxLoss = 0
    MaxDup = 0
    MaxDelay = 0
    MaxPartitions = 0
    MaxCommits = 0
    Mutant = "install_last_writer_wins"
    Nodes = {n1, n2, n3}
    Clients = {c1}
    OpenOnly = {c1}
    RowCount <- MCRowCount
SPECIFICATION Spec
INVARIANTS TypeOK G04_HoldersAgree
CHECK_DEADLOCK TRUE
