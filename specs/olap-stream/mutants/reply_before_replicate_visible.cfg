\* expect: G04_NoSpuriousFailure
\* Mutant: the same, checked on the client-visible property only.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    c1 = c1
    c2 = c2
    Nil = Nil
    BatchRows = 2
    DropLast = FALSE
    MaxCrashes = 1
    MaxLoss = 1
    MaxDup = 1
    MaxDelay = 1
    MaxPartitions = 1
    MaxCommits = 1
    Mutant = "reply_before_replicate"
    Nodes = {n1, n2}
    Clients = {c1}
    OpenOnly = {}
    RowCount <- MCRowCount
SPECIFICATION Spec
INVARIANTS TypeOK G04_NoSpuriousFailure
CHECK_DEADLOCK TRUE
