\* T1 liveness: no symmetry. Same bounds as the safety baseline.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    k1 = k1
    k2 = k2
    Nil = Nil
    Nodes = {n1, n2, n3}
    Keys = {k1, k2}
    MaxVer = 2
    MaxCrashes = 1
    MaxPartitions = 1
    MaxExpiries = 1
    MaxPartial = 1
    Mutant = "none"
    Variant = "plan"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES JoinProgress
CHECK_DEADLOCK TRUE
