\* T1 baseline: the plan's rule (publication needs the live seal). 3 workers, 2 request IDs,
\* one crash, partition, seal expiry and partial commit each.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    k1 = k1
    k2 = k2
    Nil = Nil
    Nodes = {n1, n2, n3}
    Keys = {k1, k2}
    MaxVer = 2
    MaxCrashes = 1
    MaxPartitions = 1
    MaxExpiries = 1
    MaxPartial = 1
    Mutant = "none"
    Variant = "plan"
SPECIFICATION Spec
SYMMETRY MCSymmetry
INVARIANTS TypeOK G04_ReadyHoldsReplied G04_ServingIsCurrent
CHECK_DEADLOCK TRUE
