\* T1 readiness CAS refinement. Two ready workers, one joiner, one of each fault.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Workers = {n1, n2, n3}
    Joiner = n3
    FirstOwner = n1
    Stream = stream
    Request = request
    MaxVersion = 2
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK G04_ReadyHoldsReplied G07_ReadyHoldsAccepted ReadyMatchStaysSealed
CHECK_DEADLOCK TRUE
