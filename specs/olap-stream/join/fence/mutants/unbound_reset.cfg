\* expect: G07_ReadyHoldsAccepted
\* The joiner applies a copy reset delayed from an earlier attempt after the
\* next attempt copied (the receiver before fx-sched).
CONSTANTS
    Workers = {n1, n2, n3}
    Joiner = n3
    FirstOwner = n1
    Stream = stream
    Request = request
    MaxVersion = 2
    Mutant = "unbound_reset"
SPECIFICATION Spec
INVARIANTS TypeOK G07_ReadyHoldsAccepted
CHECK_DEADLOCK TRUE
