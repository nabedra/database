\* No symmetry. The controller may stop before the store resolves a readiness CAS.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Workers = {n1, n2, n3}
    Joiner = n3
    FirstOwner = n1
    Stream = stream
    Request = request
    MaxVersion = 2
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES JoinResolves
CHECK_DEADLOCK TRUE
