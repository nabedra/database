\* expect: JoinProgress
\* Mutant: a dead joiner's seal is never released and never expires.
\* Deadlock checking is off: the stuck seal also deadlocks, and with several TLC workers the deadlock can be
\* reported before the liveness check runs. The control (this cfg with Mutant = "none") still passes.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    k1 = k1
    k2 = k2
    Nil = Nil
    Nodes = {n1, n2, n3}
    Keys = {k1, k2}
    MaxVer = 2
    MaxCrashes = 1
    MaxPartitions = 1
    MaxExpiries = 1
    MaxPartial = 1
    Mutant = "seal_never_released"
    Variant = "plan"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES JoinProgress
CHECK_DEADLOCK FALSE
