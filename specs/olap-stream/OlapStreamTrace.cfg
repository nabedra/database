\* Trace validation. scripts/testing/tla_trace.py runs it once per trace,
\* with TRACE_PATH naming the trace.
CONSTANTS
    Nil = Nil
    Nodes <- TraceNodes
    Clients <- TraceClients
    OpenOnly <- TraceOpenOnly
    BatchRows <- TraceBatchRows
    RowCount <- TraceRowCount
    DropLast <- TraceDropLast
    MaxCrashes <- TraceMaxCrashes
    MaxLoss <- TraceMaxLoss
    MaxDup <- TraceMaxDup
    MaxDelay <- TraceMaxDelay
    MaxPartitions <- TraceMaxPartitions
    MaxCommits <- TraceMaxCommits
    Mutant = "none"
INIT TraceInitState
NEXT TraceNext
INVARIANTS TypeOK G01_OracleOrder G01_FreshPin G02_OneHandle G03_ReplyMatchesOracle G04_ReplyImpliesReplicated G04_NoSpuriousFailure G04_HoldersAgree G05_OldRunNeverServed G06_NoRescan TraceIndexIsLevel
POSTCONDITION TraceAccepted
CHECK_DEADLOCK FALSE
