\* T2 only, run as a TLC simulation: two full client streams (no OpenOnly abstraction).
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    c1 = c1
    c2 = c2
    Nil = Nil
    BatchRows = 2
    DropLast = FALSE
    MaxCrashes = 1
    MaxLoss = 1
    MaxDup = 1
    MaxDelay = 1
    MaxPartitions = 1
    MaxCommits = 1
    Mutant = "none"
    Nodes = {n1, n2, n3}
    Clients = {c1, c2}
    OpenOnly = {}
    RowCount <- MCRowCount
SPECIFICATION Spec
SYMMETRY MCSymmetry
INVARIANTS TypeOK G01_OracleOrder G01_FreshPin G02_OneHandle G03_ReplyMatchesOracle G04_ReplyImpliesReplicated G04_NoSpuriousFailure G04_HoldersAgree G05_OldRunNeverServed G06_NoRescan
PROPERTIES G03_AckFence G04_HolderMonotone
CHECK_DEADLOCK TRUE
