\* T1 liveness: no symmetry. Reduced to 2 workers and 1 client so the temporal check
\* fits the 15-minute budget; safety runs at the L2 bounds.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    c1 = c1
    c2 = c2
    Nil = Nil
    BatchRows = 2
    DropLast = FALSE
    MaxCrashes = 1
    MaxLoss = 1
    MaxDup = 1
    MaxDelay = 1
    MaxPartitions = 1
    MaxCommits = 1
    Mutant = "none"
    Nodes = {n1, n2}
    Clients = {c1}
    OpenOnly = {}
    RowCount <- MCRowCount
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES Termination
CHECK_DEADLOCK TRUE
