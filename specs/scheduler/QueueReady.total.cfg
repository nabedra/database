\* T1 safety, every holder lost: 1 ready worker that owns the queue and 1 joiner. After the only holder's loss
\* the joiner may be published without a copy (the first enrollment rule of join_requirement).
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Nodes = {a, d}
    Initial = {a}
    Records = {r1, r2}
    MaxLosses = 1
    Mutant = "none"
    None = None
SPECIFICATION Spec
INVARIANTS
    TypeOK
    G07_ReadyHoldsAccepted
CHECK_DEADLOCK TRUE
