\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    p1 = p1
    c1 = c1
    c2 = c2
    Nodes = {n1, n2, n3}
    Producers = {p1}
    Consumers = {c1, c2}
    PageLimit = 1
    LeaseTtl = 1
    RetainAfter = 1
    MaxTime = 3
    MaxClaims = 3
    MaxFailovers = 1
    MaxPartitions = 1
    MaxDrops = 1
    MaxDups = 1
    MaxClockJumps = 1
    MaxConsumerCrashes = 1
    MaxDrift = 1
    MaxFaults = 6
    Variant = "none"
    Mutant = "none"
    Items <- MCItems
INIT Init
NEXT Next
SYMMETRY MCSymmetry
INVARIANT TypeOK
INVARIANT G02_OffsetsStable
INVARIANT G02_Contiguous
INVARIANT G03_RetryReturnsOriginal
INVARIANT G05_AckOnlyDelivered
INVARIANT G05_StaleGenerationFenced
INVARIANT G05_NoRevivedLease
INVARIANT G06_PollLinearizable
INVARIANT G08_RetentionByPublishTime
INVARIANT G08_PublishTimeMonotone
CHECK_DEADLOCK TRUE
