\* The EventsDelivery liveness baseline (L_Drain: every retained event is eventually acknowledged),
\* moved out of the T1 check because it stops at the 900 s T1 budget. Not registered: no run has completed within
\* a T2 budget (record EVENTS-DELIVERY-LIVENESS-BUDGET). Run it with tla_check.py specs/events-delivery/live
\* EventsDelivery --module events --tier T2 --budget-s <s>.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    p1 = p1
    c1 = c1
    c2 = c2
    Nodes = {n1, n2, n3}
    Producers = {p1}
    Consumers = {c1, c2}
    PageLimit = 1
    LeaseTtl = 1
    RetainAfter = 2
    MaxTime = 3
    MaxClaims = 2
    MaxFailovers = 0
    MaxPartitions = 0
    MaxDrops = 1
    MaxDups = 0
    MaxClockJumps = 0
    MaxConsumerCrashes = 0
    MaxDrift = 1
    Variant = "drift_bound_stated"
    Mutant = "none"
    Items <- MCItems
SPECIFICATION Spec
PROPERTY L_Drain
CHECK_DEADLOCK TRUE
