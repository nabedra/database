\* no-mutant: TypeOK -- the type invariant; every run checks it.
\* The strict EVT-G08 reading (no clock tolerance), finding EVENTS-2. Expected to fail until the user decides
\* the clock bound; EventsDelivery.cfg checks every property under the proposed bound (Variant drift_bound_stated).
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    p1 = p1
    c1 = c1
    c2 = c2
    Nodes = {n1, n2, n3}
    Producers = {p1}
    Consumers = {c1, c2}
    PageLimit = 1
    LeaseTtl = 1
    RetainAfter = 2
    MaxTime = 3
    MaxClaims = 3
    MaxFailovers = 1
    MaxPartitions = 1
    MaxDrops = 1
    MaxDups = 1
    MaxClockJumps = 1
    MaxConsumerCrashes = 1
    MaxDrift = 1
    Variant = "none"
    Mutant = "none"
    Items <- MCItems
INIT Init
NEXT Next
SYMMETRY MCSymmetry
INVARIANT TypeOK
INVARIANT G08_RetentionByPublishTime
CHECK_DEADLOCK TRUE
