\* T2 only: every fault kind in one run (two crashes, media damage, disk loss) with three
\* writes, journal values and early rolls. Exhaustive when it fits, else seeded simulation.
CONSTANTS
    k1 = k1
    k2 = k2
    w1 = w1
    w2 = w2
    NoKey = NoKey
    Keys <- MCKeys
    Writers <- MCWriters
    MaxSeq = 3
    SegCap = 2
    MaxSegs = 6
    MaxFile = 16
    MaxImm = 1
    MaxCrashes = 2
    MaxMedia = 1
    MaxDiskLoss = 1
    JournalValues = TRUE
    EarlyRoll = TRUE
    Reader = TRUE
    Mutant = "none"
SPECIFICATION Spec
SYMMETRY Sym
INVARIANTS
    TypeOK
    G01_AckedSurvive
    G02_ExactPrefix
    G02_RecoveryIdempotent
    G03_CertifiedLossDetected
    G03_NoFalseDamage
    NoResurrection
    NoDeletedFileRead
    NS03_SnapshotStable
