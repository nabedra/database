\* Liveness baseline (T1): weak fairness on the journal, flush, compaction-edit
\* and open steps, strong fairness on purge (see Fairness in Lsm.tla). No
\* SYMMETRY: TLC can miss liveness violations under symmetry. The fault budget
\* is finite, so each behavior has a last fault and the properties are checked
\* on what follows it.
CONSTANTS
    k1 = k1
    k2 = k2
    w1 = w1
    w2 = w2
    NoKey = NoKey
    Keys <- MCKeys
    Writers <- MCWriters
    MaxSeq = 2
    SegCap = 2
    MaxSegs = 6
    MaxFile = 16
    MaxImm = 1
    MaxCrashes = 1
    MaxMedia = 0
    MaxDiskLoss = 0
    JournalValues = FALSE
    EarlyRoll = FALSE
    Reader = TRUE
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
PROPERTIES
    L_CommitCompletes
    L_OpenTerminates
    L_FlushCompletes
    L_ObsoletePurged
