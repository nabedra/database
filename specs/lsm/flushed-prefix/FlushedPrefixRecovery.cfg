\* One crash from a durable manifest with one recorded locator and an optional fault.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANT Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK G03_RecordedLocatorPreserved G03_CoveredDamageCanOpen G03_RefusalBeforeRepair G03_UnflushedCertificateHonored
CHECK_DEADLOCK TRUE
