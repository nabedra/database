\* expect: G03_ReleaseClean
\* Independent read R-lsm-19: finish_release records the release before flushed_seq passes its range delete, so replay skips the delete after the old G1 record and the old state returns unquarantined.
CONSTANTS
    g1 = g1
    g2 = g2
    Groups <- MCGroups
    MaxSeq = 4
    MaxCrashes = 2
    MaxMedia = 2
    MaxEditFail = 1
    R6Max = 1
    Mutant = "release_without_flush"
SPECIFICATION Spec
SYMMETRY Sym
INVARIANTS
    TypeOK
    G03_QuarantineSticky
    G03_ServeOracle
    G03_ReleaseClean
    NS20_BackupExact
    R6_Bounded
CHECK_DEADLOCK TRUE
