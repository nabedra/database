\* T1 liveness baseline: no SYMMETRY (TLC can miss liveness violations under
\* symmetry), one crash and one media damage; the property holds after the
\* last fault.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    g1 = g1
    g2 = g2
    Groups <- MCGroups
    MaxSeq = 4
    MaxCrashes = 1
    MaxMedia = 1
    MaxEditFail = 1
    R6Max = 1
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
    G03_QuarantineSticky
    G03_ServeOracle
    G03_ReleaseClean
    NS20_BackupExact
    R6_Bounded
PROPERTIES
    L_QuarantineReleased
CHECK_DEADLOCK TRUE
