\* T1 baseline: two groups (scopes) on one pool, their Raft nodes, the
\* journal thread, the flusher, a damage-finding reader, a backup reader,
\* the release path and Control; two crashes, two media damages (a journal
\* record or a stored version) and one failed manifest edit, overlapping.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    g1 = g1
    g2 = g2
    Groups <- MCGroups
    MaxSeq = 4
    MaxCrashes = 2
    MaxMedia = 2
    MaxEditFail = 1
    R6Max = 1
    Mutant = "none"
SPECIFICATION Spec
SYMMETRY Sym
INVARIANTS
    TypeOK
    G03_QuarantineSticky
    G03_ServeOracle
    G03_ReleaseClean
    NS20_BackupExact
    R6_Bounded
CHECK_DEADLOCK TRUE
