\* T1 baseline, no faults and three writes: flush, compaction, deletion of obsolete
\* files, segment retirement, snapshots and journal values interleaved freely.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    k1 = k1
    k2 = k2
    w1 = w1
    w2 = w2
    NoKey = NoKey
    Keys <- MCKeys
    Writers <- MCWriters
    MaxSeq = 3
    SegCap = 2
    MaxSegs = 6
    MaxFile = 16
    MaxImm = 1
    MaxCrashes = 0
    MaxMedia = 0
    MaxDiskLoss = 0
    JournalValues = TRUE
    EarlyRoll = TRUE
    Reader = TRUE
    Mutant = "none"
SPECIFICATION Spec
SYMMETRY Sym
INVARIANTS
    TypeOK
    G01_AckedSurvive
    G02_ExactPrefix
    G02_RecoveryIdempotent
    G03_CertifiedLossDetected
    G03_NoFalseDamage
    NoResurrection
    NoDeletedFileRead
    NS03_SnapshotStable
