\* T1 baseline: two writers, two scopes, the journal thread, the flusher, the
\* compactor, journal GC and a snapshot reader; two crashes (Kill or
\* PowerLoss, in any order).
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    k1 = k1
    k2 = k2
    w1 = w1
    w2 = w2
    Keys <- MCKeys
    Writers <- MCWriters
    MaxSeq = 4
    SegCap = 1
    MaxSegs = 3
    MaxCrashes = 2
    Mutant = "none"
SPECIFICATION Spec
SYMMETRY Sym
INVARIANTS
    TypeOK
    G02_ExactPrefix
    NS03_SnapshotStable
    NS13_RetiredFlushed
CHECK_DEADLOCK TRUE
