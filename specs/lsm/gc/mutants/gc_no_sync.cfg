\* expect: L_ClearedRetires
\* journal_gc without its sync_journal: a relocation that is visible but not durable waits for a client's Sync forever.
CONSTANTS
    k1 = k1
    k2 = k2
    w1 = w1
    w2 = w2
    Keys <- MCKeys
    Writers <- MCWriters
    MaxSeq = 3
    SegCap = 1
    MaxSegs = 3
    MaxCrashes = 1
    Mutant = "gc_no_sync"
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
    G02_ExactPrefix
    NS03_SnapshotStable
    NS13_RetiredFlushed
PROPERTIES
    L_ClearedRetires
CHECK_DEADLOCK TRUE
