    MaxCrashes = 2
    Mutant = "gc_no_scan_floor"
SPECIFICATION Spec
SYMMETRY Sym
INVARIANTS
    TypeOK
    G02_ExactPrefix
    NS03_SnapshotStable
    NS13_RetiredFlushed
CHECK_DEADLOCK TRUE
