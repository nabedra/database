\* T1 liveness baseline: no SYMMETRY (TLC can miss liveness violations under
\* symmetry) and one crash; the property holds after the last fault.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    k1 = k1
    k2 = k2
    w1 = w1
    w2 = w2
    Keys <- MCKeys
    Writers <- MCWriters
    MaxSeq = 3
    SegCap = 1
    MaxSegs = 3
    MaxCrashes = 1
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
    G02_ExactPrefix
    NS03_SnapshotStable
    NS13_RetiredFlushed
PROPERTIES
    L_ClearedRetires
CHECK_DEADLOCK TRUE
