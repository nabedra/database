\* T1 liveness baseline: one crash, one redeploy, no restore or key damage; the upgrade completes once the new binary runs with auth.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Mutant = "none"
    MaxCrashes = 1
    MaxDeploys = 1
    MaxSegs = 2
    Faults = FALSE
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
    KeyCoversFrames
    FormatHasKey
PROPERTIES
    L_UpgradeCompletes
CHECK_DEADLOCK TRUE
