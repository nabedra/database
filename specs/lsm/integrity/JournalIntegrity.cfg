\* T1 baseline: two crashes (kill or power loss), two redeploys of either binary with either option, three segments, one restore or key damage.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Mutant = "none"
    MaxCrashes = 2
    MaxDeploys = 2
    MaxSegs = 3
    Faults = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    KeyCoversFrames
    FormatHasKey
    OldOpensOnlyV1
    NoMixedSegment
    UpgradeValidated
    RefusalLeavesDisk
CHECK_DEADLOCK TRUE
