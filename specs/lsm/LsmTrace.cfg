\* Trace validation. scripts/testing/tla_trace.py runs it once per trace,
\* with TRACE_PATH naming the trace. The constants the run does not reach
\* (crashes, media damage, disk loss, journal values, the reader) are off.
CONSTANTS
    NoKey <- TraceNoKey
    Keys <- TraceKeys
    Writers <- TraceWriters
    MaxSeq <- TraceMaxSeq
    SegCap <- TraceSegCap
    MaxSegs <- TraceMaxSegs
    MaxFile <- TraceMaxFile
    MaxImm <- TraceMaxImm
    MaxCrashes = 0
    MaxMedia = 0
    MaxDiskLoss = 0
    JournalValues = FALSE
    EarlyRoll = TRUE
    Reader = FALSE
    Mutant = "none"
INIT TraceInitState
NEXT TraceNext
INVARIANTS TraceIndexIsLevel G01_AckedSurvive G02_ExactPrefix NoResurrection
POSTCONDITION TraceAccepted
CHECK_DEADLOCK FALSE
