\* expect: L_ObsoletePurged
\* Obsolete runs are deleted only inside a compaction, not when the last snapshot that pins them is released.
CONSTANTS
    k1 = k1
    k2 = k2
    w1 = w1
    w2 = w2
    NoKey = NoKey
    Keys <- MCKeys
    Writers <- MCWriters
    MaxSeq = 2
    SegCap = 2
    MaxSegs = 6
    MaxFile = 16
    MaxImm = 1
    MaxCrashes = 1
    MaxMedia = 0
    MaxDiskLoss = 0
    JournalValues = FALSE
    EarlyRoll = FALSE
    Reader = TRUE
    Mutant = "purge_only_in_compaction"
SPECIFICATION LiveSpec
PROPERTIES
    L_ObsoletePurged
