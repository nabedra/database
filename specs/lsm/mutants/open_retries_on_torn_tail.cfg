\* expect: L_OpenTerminates
\* Open takes a torn tail for a transient read error and retries forever instead of truncating.
CONSTANTS
    k1 = k1
    k2 = k2
    w1 = w1
    w2 = w2
    NoKey = NoKey
    Keys <- MCKeys
    Writers <- MCWriters
    MaxSeq = 2
    SegCap = 2
    MaxSegs = 6
    MaxFile = 16
    MaxImm = 1
    MaxCrashes = 1
    MaxMedia = 0
    MaxDiskLoss = 0
    JournalValues = FALSE
    EarlyRoll = FALSE
    Reader = TRUE
    Mutant = "open_retries_on_torn_tail"
SPECIFICATION LiveSpec
PROPERTIES
    L_OpenTerminates
