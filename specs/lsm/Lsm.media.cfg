\* T1 baseline, media damage: one bit flip, zeroed sector or EIO region in a synced
\* journal record, overlapping one crash (Kill or PowerLoss). Exercises L1, L2, G1,
\* R1, R2 and the refused open.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    k1 = k1
    k2 = k2
    w1 = w1
    w2 = w2
    NoKey = NoKey
    Keys <- MCKeys
    Writers <- MCWriters
    MaxSeq = 2
    SegCap = 2
    MaxSegs = 6
    MaxFile = 16
    MaxImm = 1
    MaxCrashes = 1
    MaxMedia = 1
    MaxDiskLoss = 0
    JournalValues = TRUE
    EarlyRoll = FALSE
    Reader = TRUE
    Mutant = "none"
SPECIFICATION Spec
SYMMETRY Sym
INVARIANTS
    TypeOK
    G01_AckedSurvive
    G02_ExactPrefix
    G02_RecoveryIdempotent
    G03_CertifiedLossDetected
    G03_NoFalseDamage
    NoResurrection
    NoDeletedFileRead
    NS03_SnapshotStable
