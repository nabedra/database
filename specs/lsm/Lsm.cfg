\* T1 baseline, crash model: two writers, two scopes, the journal thread, the
\* flusher, the compactor and a snapshot reader; two crashes (Kill or
\* PowerLoss, any order, including during an open). See the plan's design
\* review section for how the L3 bound is split across the T1 baselines.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    k1 = k1
    k2 = k2
    w1 = w1
    w2 = w2
    NoKey = NoKey
    Keys <- MCKeys
    Writers <- MCWriters
    MaxSeq = 2
    SegCap = 2
    MaxSegs = 6
    MaxFile = 16
    MaxImm = 1
    MaxCrashes = 2
    MaxMedia = 0
    MaxDiskLoss = 0
    JournalValues = FALSE
    EarlyRoll = FALSE
    Reader = TRUE
    Mutant = "none"
SPECIFICATION Spec
SYMMETRY Sym
INVARIANTS
    TypeOK
    G01_AckedSurvive
    G02_ExactPrefix
    G02_RecoveryIdempotent
    G03_CertifiedLossDetected
    G03_NoFalseDamage
    NoResurrection
    NoDeletedFileRead
    NS03_SnapshotStable
