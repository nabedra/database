\* SimDisk T1, second baseline: disk loss and volume identity. L1 bounds declared in
\* specs/sim/README.md.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    Names = {a, b}
    MaxInodes = 1
    Vals = {1, 2}
    Cuts = {"kill", "crash", "power512", "power4k"}
    MaxWrites = 1
    MaxDirOps = 1
    MaxSyncErrors = 0
    MaxCrashes = 2
    MaxWipes = 2
    Bases = {0, 100, 200}
    Mutant = "none"
    Variant = "shipped"
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    NoDoubleLink
    OsIsDurablePlusPending
    NoWriteAfterCut
    IncarnationSeesOneVolume
    UuidAnchorRejectsWipe
    DevInoAnchorRejectsWipe
PROPERTIES
    SyncedSurvives
    SyncedSectorsSurvive
    CrashImageAllowed
CHECK_DEADLOCK TRUE
