\* SimDisk T1, third baseline: the 4 KiB destroying power loss, alone and after a kill.
\* L1 bounds declared in specs/sim/README.md.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    Names = {a, b}
    MaxInodes = 2
    Vals = {1, 2}
    Cuts = {"kill", "power4k"}
    MaxWrites = 2
    MaxDirOps = 2
    MaxSyncErrors = 1
    MaxCrashes = 2
    MaxWipes = 0
    Bases = {0, 100}
    Mutant = "none"
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    NoDoubleLink
    OsIsDurablePlusPending
    NoWriteAfterCut
    IncarnationSeesOneVolume
    UuidAnchorRejectsWipe
PROPERTIES
    SyncedSurvives
    SyncedSectorsSurvive
    CrashImageAllowed
    OnlyLatestOrOld
CHECK_DEADLOCK TRUE
