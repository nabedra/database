\* SimDisk T1: every cut, fault and workload bound of the other baselines together.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    Names = {a, b, c}
    MaxInodes = 2
    Vals = {1, 2}
    Cuts = {"kill", "crash", "power512", "power4k"}
    MaxWrites = 2
    MaxDirOps = 3
    MaxSyncErrors = 1
    MaxCrashes = 2
    MaxWipes = 1
    Bases = {0, 100}
    Mutant = "none"
    Variant = "shipped"
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    NoDoubleLink
    OsIsDurablePlusPending
    NoWriteAfterCut
    IncarnationSeesOneVolume
    UuidAnchorRejectsWipe
    DevInoAnchorRejectsWipe
PROPERTIES
    SyncedSurvives
    SyncedSectorsSurvive
    CrashImageAllowed
    OnlyLatestOrOld
CHECK_DEADLOCK TRUE
