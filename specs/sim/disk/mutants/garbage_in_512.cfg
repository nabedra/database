\* expect: CrashImageAllowed
\* mutant: a 512-byte power loss may leave garbage, which no write produced
\* baseline: SimDisk.cfg
SPECIFICATION Spec
CONSTANTS
    Names = {a, b, c}
    MaxInodes = 2
    Vals = {1, 2}
    Cuts = {"kill", "crash", "power512"}
    MaxWrites = 2
    MaxDirOps = 3
    MaxSyncErrors = 1
    MaxCrashes = 2
    MaxWipes = 0
    Bases = {0, 100}
    Mutant = "garbage_in_512"
SYMMETRY Symmetry
PROPERTY CrashImageAllowed
CHECK_DEADLOCK TRUE
