\* expect: SyncedSectorsSurvive
\* mutant: power loss tears sectors that were not written since the last sync
\* baseline: SimDisk.cfg
SPECIFICATION Spec
CONSTANTS
    Names = {a, b, c}
    MaxInodes = 2
    Vals = {1, 2}
    Cuts = {"kill", "crash", "power512"}
    MaxWrites = 2
    MaxDirOps = 3
    MaxSyncErrors = 1
    MaxCrashes = 2
    MaxWipes = 0
    Bases = {0, 100}
    Mutant = "tear_clean_sectors"
SYMMETRY Symmetry
PROPERTY SyncedSectorsSurvive
CHECK_DEADLOCK TRUE
