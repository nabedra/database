\* expect: SyncedSurvives
\* mutant: a successful sync leaves the dirty sectors off the device
\* baseline: SimDisk.cfg
SPECIFICATION Spec
CONSTANTS
    Names = {a, b, c}
    MaxInodes = 2
    Vals = {1, 2}
    Cuts = {"kill", "crash", "power512"}
    MaxWrites = 2
    MaxDirOps = 3
    MaxSyncErrors = 1
    MaxCrashes = 2
    MaxWipes = 0
    Bases = {0, 100}
    Mutant = "sync_skips_dirty"
SYMMETRY Symmetry
PROPERTY SyncedSurvives
CHECK_DEADLOCK TRUE
