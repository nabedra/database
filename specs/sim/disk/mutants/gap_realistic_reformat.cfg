    MaxWrites = 2
    MaxDirOps = 2
    MaxSyncErrors = 1
    MaxCrashes = 1
    MaxWipes = 1
    Bases = {0, 100}
    Mutant = "none"
    Variant = "realistic_reformat"
SYMMETRY Symmetry
INVARIANT DevInoAnchorRejectsWipe
CHECK_DEADLOCK TRUE
