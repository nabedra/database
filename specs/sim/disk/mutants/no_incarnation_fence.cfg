\* expect: NoWriteAfterCut
\* mutant: a late destructor of a crashed incarnation resolves its path on the replacement image (R-sim-11)
\* baseline: SimDisk.cfg
SPECIFICATION Spec
CONSTANTS
    Names = {a, b, c}
    MaxInodes = 2
    Vals = {1, 2}
    Cuts = {"kill", "crash", "power512"}
    MaxWrites = 2
    MaxDirOps = 3
    MaxSyncErrors = 1
    MaxCrashes = 2
    MaxWipes = 0
    Bases = {0, 100}
    Mutant = "no_incarnation_fence"
SYMMETRY Symmetry
INVARIANT NoWriteAfterCut
CHECK_DEADLOCK TRUE
