\* expect: OnlyLatestOrOld
\* gap: real writeback can persist an intermediate unsynced version; FaultFs keeps only the durable and the latest value
\* baseline: SimDisk.cfg
SPECIFICATION Spec
CONSTANTS
    Names = {a, b, c}
    MaxInodes = 2
    Vals = {1, 2}
    Cuts = {"kill", "crash", "power512"}
    MaxWrites = 2
    MaxDirOps = 3
    MaxSyncErrors = 1
    MaxCrashes = 2
    MaxWipes = 0
    Bases = {0, 100}
    Mutant = "gap_writeback"
SYMMETRY Symmetry
PROPERTY OnlyLatestOrOld
CHECK_DEADLOCK TRUE
