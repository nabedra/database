\* expect: NoDoubleLink
\* mutant: power loss decides the unlink and the link of a rename separately
\* baseline: SimDisk.cfg
SPECIFICATION Spec
CONSTANTS
    Names = {a, b, c}
    MaxInodes = 2
    Vals = {1, 2}
    Cuts = {"kill", "crash", "power512"}
    MaxWrites = 2
    MaxDirOps = 3
    MaxSyncErrors = 1
    MaxCrashes = 2
    MaxWipes = 0
    Bases = {0, 100}
    Mutant = "rename_not_atomic"
SYMMETRY Symmetry
INVARIANT NoDoubleLink
CHECK_DEADLOCK TRUE
