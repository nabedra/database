\* SimDisk T1: exhaustive, L1 bounds declared in specs/sim/README.md. Disk loss runs in
\* SimDisk.wipe.cfg and the 4 KiB destroying power loss in SimDisk.p4k.cfg.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    Names = {a, b, c}
    MaxInodes = 2
    Vals = {1, 2}
    Cuts = {"kill", "crash", "power512"}
    MaxWrites = 2
    MaxDirOps = 3
    MaxSyncErrors = 1
    MaxCrashes = 2
    MaxWipes = 0
    Bases = {0, 100}
    Mutant = "none"
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    NoDoubleLink
    OsIsDurablePlusPending
    NoWriteAfterCut
    IncarnationSeesOneVolume
    UuidAnchorRejectsWipe
PROPERTIES
    SyncedSurvives
    SyncedSectorsSurvive
    CrashImageAllowed
    OnlyLatestOrOld
CHECK_DEADLOCK TRUE
