\* SimNetRpc T1: exhaustive, L1 bounds declared in specs/sim/README.md. The baseline
\* rechecks the link before a duplicate copy runs; the router without the check is
\* mutants/prefix_dup_crosses_block.cfg.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    MaxCalls = 3
    MaxDrops = 1
    MaxDups = 1
    MaxBlocks = 1
    MaxPauses = 1
    MaxCrashes = 1
    Mutant = "none"
INVARIANTS
    TypeOK
    NothingCrossesBlockedLink
    PausedRunsNothing
CHECK_DEADLOCK TRUE
