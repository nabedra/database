\* SimClock T1, the error-age baseline: one ClockBound node with a declared drift of 2 in 4
\* and a long horizon, so a slow clock's understated age exceeds the base error
\* (mutant error_ages_on_local). One drift change, no other fault.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    Nodes = {c1}
    BoundNodes = {c1}
    Scale = 4
    DeclaredDrift = 2
    Drifts <- Drifts2
    BaseError = 1
    MaxTime = 16
    MaxDriftChanges = 1
    MaxResyncs = 0
    MaxPauses = 0
    MaxWallJumps = 0
    MaxMonoSteps = 0
    MaxTimers = 0
    Mutant = "none"
INVARIANTS
    TypeOK
    ClockAssumption
PROPERTIES
    MonoNeverBackward
    SampleFreshAtServe
CHECK_DEADLOCK TRUE
