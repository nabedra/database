\* SimClock T1: ClockBound faults and timers together on one node.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    Nodes = {c1}
    BoundNodes = {c1}
    Scale = 4
    DeclaredDrift = 1
    Drifts <- Drifts1
    BaseError = 1
    MaxTime = 9
    MaxDriftChanges = 3
    MaxResyncs = 1
    MaxPauses = 1
    MaxWallJumps = 0
    MaxMonoSteps = 0
    MaxTimers = 1
    Mutant = "none"
INVARIANTS
    TypeOK
    ClockAssumption
PROPERTIES
    MonoNeverBackward
    SampleFreshAtServe
    TimerNeverEarly
CHECK_DEADLOCK TRUE
