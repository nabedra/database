\* SimClock T1: exhaustive, L1 bounds declared in specs/sim/README.md. The baseline
\* carries the proposed timer fix (Variant rearm_on_wake); the shipped mapping is
\* mutants/prefix_early_timer.cfg, an open bug record.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    Nodes = {c1, c2, o1}
    BoundNodes = {c1, c2}
    Scale = 4
    DeclaredDrift = 1
    Drifts <- Drifts1
    BaseError = 1
    MaxTime = 9
    MaxDriftChanges = 2
    MaxResyncs = 1
    MaxPauses = 1
    MaxWallJumps = 1
    MaxMonoSteps = 1
    MaxTimers = 2
    Mutant = "none"
    Variant = "rearm_on_wake"
INVARIANTS
    TypeOK
    ClockAssumption
PROPERTIES
    MonoNeverBackward
    TimerNeverEarly
CHECK_DEADLOCK TRUE
