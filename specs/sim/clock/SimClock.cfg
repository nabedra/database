\* SimClock T1, the ClockBound baseline: one node with a SimClockBound. Nodes never read
\* each other's clocks, so a per-node property holds for any number of nodes iff it holds
\* for one. The timer, wall-jump and stall actions run in SimClock.timers.cfg.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    Nodes = {c1}
    BoundNodes = {c1}
    Scale = 4
    DeclaredDrift = 1
    Drifts <- Drifts1
    BaseError = 1
    MaxTime = 9
    MaxDriftChanges = 5
    MaxResyncs = 1
    MaxPauses = 1
    MaxWallJumps = 0
    MaxMonoSteps = 0
    MaxTimers = 0
    Mutant = "none"
    Variant = "rearm_on_wake"
INVARIANTS
    TypeOK
    ClockAssumption
PROPERTIES
    MonoNeverBackward
CHECK_DEADLOCK TRUE
