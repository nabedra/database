\* expect: ClockAssumption
\* mutant: the bound omits the one-tick allowance per drift reanchor (clock_bound.rs)
\* baseline: SimClock.cfg
SPECIFICATION Spec
CONSTANTS
    Nodes = {c1}
    BoundNodes = {c1}
    Scale = 4
    DeclaredDrift = 1
    Drifts <- Drifts1
    BaseError = 1
    MaxTime = 9
    MaxDriftChanges = 5
    MaxResyncs = 1
    MaxPauses = 1
    MaxWallJumps = 0
    MaxMonoSteps = 0
    MaxTimers = 0
    Mutant = "no_reanchor_budget"
INVARIANT ClockAssumption
CHECK_DEADLOCK TRUE
