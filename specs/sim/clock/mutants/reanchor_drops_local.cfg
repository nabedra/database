\* expect: MonoNeverBackward
\* mutant: a drift change re-anchors at the current true time but keeps the old local anchor
\* baseline: SimClock.cfg
SPECIFICATION Spec
CONSTANTS
    Nodes = {c1}
    BoundNodes = {c1}
    Scale = 4
    DeclaredDrift = 1
    Drifts <- Drifts1
    BaseError = 1
    MaxTime = 9
    MaxDriftChanges = 5
    MaxResyncs = 1
    MaxPauses = 1
    MaxWallJumps = 0
    MaxMonoSteps = 0
    MaxTimers = 0
    Mutant = "reanchor_drops_local"
PROPERTY MonoNeverBackward
CHECK_DEADLOCK TRUE
