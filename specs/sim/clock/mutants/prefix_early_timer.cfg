\* expect: TimerNeverEarly
\* reverted fix: a timer keeps the runtime deadline it was first mapped to; a later slowdown fires it before the node clock reaches it
\* baseline: SimClock.timers.cfg
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1}
    BoundNodes = {}
    Scale = 4
    DeclaredDrift = 1
    Drifts <- Drifts1
    BaseError = 1
    MaxTime = 8
    MaxDriftChanges = 2
    MaxResyncs = 0
    MaxPauses = 1
    MaxWallJumps = 1
    MaxMonoSteps = 1
    MaxTimers = 2
    Mutant = "prefix_early_timer"
PROPERTY TimerNeverEarly
CHECK_DEADLOCK TRUE
