\* expect: SampleFreshAtServe
\* gap: a real process can stop between the lease check's clock sample and the serve; the simulator cannot (R-sim-19, H-04)
\* baseline: SimClock.cfg
SPECIFICATION Spec
CONSTANTS
    Nodes = {c1}
    BoundNodes = {c1}
    Scale = 4
    DeclaredDrift = 1
    Drifts <- Drifts1
    BaseError = 1
    MaxTime = 9
    MaxDriftChanges = 5
    MaxResyncs = 1
    MaxPauses = 1
    MaxWallJumps = 0
    MaxMonoSteps = 0
    MaxTimers = 0
    Mutant = "gap_pause_after_sample"
PROPERTY SampleFreshAtServe
CHECK_DEADLOCK TRUE
