\* SimClock T1, the timer baseline: one node without a ClockBound, timers armed across
\* drift changes, pauses, wall jumps and monotonic stalls. The baseline carries the
\* proposed timer fix (Variant rearm_on_wake); the shipped mapping is
\* mutants/prefix_early_timer.cfg, an open bug record.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1}
    BoundNodes = {}
    Scale = 4
    DeclaredDrift = 1
    Drifts <- Drifts1
    BaseError = 1
    MaxTime = 8
    MaxDriftChanges = 2
    MaxResyncs = 0
    MaxPauses = 1
    MaxWallJumps = 1
    MaxMonoSteps = 1
    MaxTimers = 2
    Mutant = "none"
    Variant = "rearm_on_wake"
INVARIANTS
    TypeOK
PROPERTIES
    MonoNeverBackward
    TimerNeverEarly
CHECK_DEADLOCK TRUE
