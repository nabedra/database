\* expect: ConnectionFifo
\* witness (baseline, stronger than TCP): frames of different streams overtake each other on one connection (Fate::Frame, one-stream delay)
SPECIFICATION Spec
CONSTANTS
    Router = "oltp"
    Streams = {1, 2}
    MaxSends = 3
    MaxDrops = 1
    MaxDups = 1
    MaxHoles = 1
    MaxResets = 1
    MaxCrashes = 1
    MaxFreezes = 0
    Mutant = "none"
    Variant = "shipped"
INVARIANT ConnectionFifo
CHECK_DEADLOCK TRUE
