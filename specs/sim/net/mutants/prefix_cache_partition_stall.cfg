\* expect: HeldNotLost
\* shipped (finding): the Cache planner maps the Drop a blocked link plans to Fate::Drop, so a message sent during a partition stalls its direction for good
\* baseline: SimNet.cfg
SPECIFICATION Spec
CONSTANTS
    Streams = {1, 2}
    MaxSends = 3
    MaxDrops = 1
    MaxDups = 1
    MaxHoles = 1
    MaxResets = 1
    MaxCrashes = 1
    MaxFreezes = 1
    Mutant = "prefix_cache_partition_stall"
INVARIANT HeldNotLost
CHECK_DEADLOCK TRUE
