\* expect: HeldNotLost
\* finding (shipped Cache planner): the Cache harness maps the Drop a blocked link plans to Fate::Drop, so a message sent during a partition stalls its connection for good
SPECIFICATION Spec
CONSTANTS
    Router = "cache"
    Streams = {1, 2}
    MaxSends = 3
    MaxDrops = 1
    MaxDups = 1
    MaxHoles = 1
    MaxResets = 1
    MaxCrashes = 1
    MaxFreezes = 0
    Mutant = "none"
    Variant = "shipped"
INVARIANT HeldNotLost
CHECK_DEADLOCK TRUE
