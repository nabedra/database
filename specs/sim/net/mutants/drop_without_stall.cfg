\* expect: ReceivedIsPrefix
\* mutant: a dropped message loses only itself; later messages on the direction still arrive (a gap TCP never shows)
\* baseline: SimNet.cfg
SPECIFICATION Spec
CONSTANTS
    Streams = {1, 2}
    MaxSends = 3
    MaxDrops = 1
    MaxDups = 1
    MaxHoles = 1
    MaxResets = 1
    MaxCrashes = 1
    MaxFreezes = 1
    Mutant = "drop_without_stall"
INVARIANT ReceivedIsPrefix
CHECK_DEADLOCK TRUE
