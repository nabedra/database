\* expect: HoleHoldsInFlight
\* mutant: a held link still delivers messages that were in flight when it was cut
\* baseline: SimNet.cfg
SPECIFICATION Spec
CONSTANTS
    Streams = {1, 2}
    MaxSends = 3
    MaxDrops = 1
    MaxDups = 1
    MaxHoles = 1
    MaxResets = 1
    MaxCrashes = 1
    MaxFreezes = 1
    Mutant = "hole_ignores_in_flight"
INVARIANT HoleHoldsInFlight
CHECK_DEADLOCK TRUE
