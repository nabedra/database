\* expect: NoStaleFromCrashed
\* gap: a real kernel delivers what a killed process sent, then EOF; the sim resets and discards it
\* baseline: SimNet.cfg
SPECIFICATION Spec
CONSTANTS
    Streams = {1, 2}
    MaxSends = 3
    MaxDrops = 1
    MaxDups = 1
    MaxHoles = 1
    MaxResets = 1
    MaxCrashes = 1
    MaxFreezes = 1
    Mutant = "gap_crash_sends_fin"
PROPERTY NoStaleFromCrashed
CHECK_DEADLOCK TRUE
