\* expect: NoStaleFromCrashed
\* gap (variant): a real kernel delivers what a killed process sent, then EOF; the sim resets and discards it
SPECIFICATION Spec
CONSTANTS
    Router = "oltp"
    Streams = {1, 2}
    MaxSends = 3
    MaxDrops = 1
    MaxDups = 1
    MaxHoles = 1
    MaxResets = 1
    MaxCrashes = 1
    MaxFreezes = 0
    Mutant = "none"
    Variant = "crash_sends_fin"
PROPERTY NoStaleFromCrashed
CHECK_DEADLOCK TRUE
