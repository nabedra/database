\* expect: ConnectionFifo
\* shipped (finding): Fate::Frame keeps one barrier per stream, so frames of different streams on one session overtake each other
\* baseline: SimNet.cfg
SPECIFICATION Spec
CONSTANTS
    Streams = {1, 2}
    MaxSends = 3
    MaxDrops = 1
    MaxDups = 1
    MaxHoles = 1
    MaxResets = 1
    MaxCrashes = 1
    MaxFreezes = 1
    Mutant = "prefix_frames_overtake"
INVARIANT ConnectionFifo
CHECK_DEADLOCK TRUE
