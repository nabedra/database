\* expect: NoDuplicateDelivery
\* mutant: a NetPlan duplicate reaches the reader twice instead of being absorbed by TCP
SPECIFICATION Spec
CONSTANTS
    Router = "oltp"
    Streams = {1, 2}
    MaxSends = 3
    MaxDrops = 1
    MaxDups = 1
    MaxHoles = 1
    MaxResets = 1
    MaxCrashes = 1
    MaxFreezes = 0
    Mutant = "deliver_duplicates"
    Variant = "shipped"
INVARIANT NoDuplicateDelivery
CHECK_DEADLOCK TRUE
