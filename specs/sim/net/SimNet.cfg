\* SimNet T1: exhaustive, L1 bounds declared in specs/sim/README.md. The planner is
\* the OLTP Router; the shipped Cache planner is mutants/prefix_cache_partition_stall.cfg.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    Router = "oltp"
    Streams = {1, 2}
    MaxSends = 3
    MaxDrops = 1
    MaxDups = 1
    MaxHoles = 1
    MaxResets = 1
    MaxCrashes = 1
    MaxFreezes = 1
    Mutant = "none"
    Variant = "shipped"
INVARIANTS
    TypeOK
    ReceivedIsPrefix
    NoDuplicateDelivery
    HoleHoldsInFlight
    HeldNotLost
PROPERTIES
    NoDeliveryAfterReset
    NoStaleFromCrashed
CHECK_DEADLOCK TRUE
