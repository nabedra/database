\* SimNet T1: exhaustive, L1 bounds declared in specs/sim/README.md. The baseline is the
\* TCP-faithful seam: one barrier per connection, and a held link holds what the planner
\* drops for it. The shipped differences are mutants: prefix_frames_overtake (Fate::Frame)
\* and prefix_cache_partition_stall (the Cache planner).
\* no-mutant: TypeOK -- the type invariant; every run checks it.
SPECIFICATION Spec
CONSTANTS
    Streams = {1, 2}
    MaxSends = 3
    MaxDrops = 1
    MaxDups = 1
    MaxHoles = 1
    MaxResets = 1
    MaxCrashes = 1
    MaxFreezes = 1
    Mutant = "none"
INVARIANTS
    TypeOK
    ReceivedIsPrefix
    ConnectionFifo
    NoDuplicateDelivery
    HoleHoldsInFlight
    HeldNotLost
PROPERTIES
    NoDeliveryAfterReset
    NoStaleFromCrashed
CHECK_DEADLOCK TRUE
