\* T1 liveness, no symmetry. Every fault has a budget, so the faults stop. The lookup is the candidate
\* bounded window (Variant "window"); the shipped chain walk is the mutant prefix_history_budget.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Writers = {w1, w2, w3}
    Requests = {r1, r2}
    Readers = {}
    NumParts = 2
    MaxId = 8
    MaxCrashes = 1
    MaxLostReplies = 1
    MaxDelays = 1
    MaxTakeovers = 1
    MaxColdStarts = 1
    MaxReplays = 1
    HistoryBudget = 1
    Window = 2
    RetryLimit = 3
    Variant = "window"
    Gc = "none"
    Mutant = "none"
    NoCid = NoCid
    NoObj = NoObj
    NotRead = NotRead
    Missing = Missing
    Expired = Expired
    Unknown = Unknown
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
PROPERTIES
    G05_Progress
CHECK_DEADLOCK TRUE
