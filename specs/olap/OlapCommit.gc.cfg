\* T1 safety with a reader and the candidate collection rule (the shipped design deletes nothing).
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Writers = {w1, w2, w3}
    Requests = {r1, r2}
    Readers = {rd1}
    NumParts = 2
    MaxId = 8
    MaxCrashes = 1
    MaxLostReplies = 1
    MaxDelays = 1
    MaxTakeovers = 1
    MaxColdStarts = 1
    MaxReplays = 1
    HistoryBudget = 2
    Window = 2
    RetryLimit = 3
    Variant = "chain"
    Gc = "safe"
    Mutant = "none"
    NoCid = NoCid
    NoObj = NoObj
    NotRead = NotRead
    Missing = Missing
    Expired = Expired
    Unknown = Unknown
SPECIFICATION Spec
INVARIANTS
    TypeOK
    G01_NoTornCommit
    G02_NoLostUpdate
    G03_NoFalseNotApplied
    G03_TerminalIsCommitted
    G05_OncePerRequest
    G05_SameResult
    G01_ReaderSnapshot
    GC_NeverDeletesReferenced
PROPERTIES
    G02_LinearHistory
    G04_FenceMonotonic
    G04_NoStaleCommit
    G04_CommitStaysVisible
SYMMETRY Sym
CHECK_DEADLOCK TRUE
