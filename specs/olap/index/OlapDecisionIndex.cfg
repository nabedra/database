\* T1 safety, chain within the request budget: inline migration by the first commit.
\* One old writer, two new writers and three full request identities.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    LegacyWriter = legacy
    Writers = {legacy, replacement, peer}
    Old = old
    FreshA = freshA
    FreshB = freshB
    Nil = nil
    Mutant = "none"
    ChainFits = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK PublishedIndexIsExact LegacyWritersFenced OneDecisionPerUuid ExactLookup TimeoutRemainsUnknown ReplayIsExact
CHECK_DEADLOCK TRUE
