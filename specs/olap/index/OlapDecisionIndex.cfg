\* T1 safety: three writers, one prior and two fresh request identities.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    Writers = {replacement, peer, third}
    Old = old
    FreshA = freshA
    FreshB = freshB
    Nil = nil
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK PublishedIndexIsExact OneDecisionPerUuid ExactLookup TimeoutRemainsUnknown ReplayIsExact
CHECK_DEADLOCK TRUE
