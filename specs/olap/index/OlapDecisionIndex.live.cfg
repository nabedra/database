\* Liveness at the same bounds and without symmetry.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    LegacyWriter = legacy
    Writers = {legacy, replacement, peer}
    Old = old
    FreshA = freshA
    FreshB = freshB
    Nil = nil
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES MigrationCompletes
CHECK_DEADLOCK TRUE
