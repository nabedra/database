\* expect: LegacyWritersFenced
\* A delayed legacy write overwrites the indexed root after migration.
CONSTANTS
    LegacyWriter = legacy
    Writers = {legacy, replacement, peer}
    Old = old
    FreshA = freshA
    FreshB = freshB
    Nil = nil
    Mutant = "ignore_match"
