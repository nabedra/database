\* expect: LegacyWritersFenced
\* A delayed legacy write overwrites the migration fence after it took effect.
CONSTANTS
    LegacyWriter = legacy
    Writers = {legacy, replacement, peer}
    Old = old
    FreshA = freshA
    FreshB = freshB
    Nil = nil
    Mutant = "ignore_match"
SPECIFICATION Spec
INVARIANTS TypeOK LegacyWritersFenced
CHECK_DEADLOCK TRUE
