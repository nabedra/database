\* no-mutant: TypeOK -- the type invariant; every run checks it.
\* The plan's barrier with both candidate fixes. The plan has not been changed.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3  c1 = c1  c2 = c2
    Node = {n1, n2, n3}
    Client = {c1, c2}
    Left = {c1}
    Barrier = "written"
    Fixes = {"release_unbound", "pause_checks_receipt"}
    Mutant = "none"
    MaxAttempts = 3
    MaxCrash = 1
    MaxPart = 1
    MaxCoord = 1
    MaxGiveUp = 1
    MaxLead = 1
    MaxDup = 1
INIT Init
NEXT Next
SYMMETRY MCSymmetry
INVARIANTS TypeOK G06_SplitNotExhausted G06_NoWriteLostAcrossSplit G06_NoWriteAtOldOwner G06_BarrierPreventsRefusal
CHECK_DEADLOCK TRUE
