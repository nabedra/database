\* T1 baseline: safety of the fixed design (an owner fence resolves the active move by its
\* phase and carries the pending removal). Two worker losses can overlap with a move and a removal.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    w1 = w1  w2 = w2  w3 = w3  w4 = w4
    Worker = {w1, w2, w3, w4}
    Mutant = "none"
    MaxLoss = 2
    MaxMoves = 1
    MaxRemoves = 1
INIT Init
NEXT Next
SYMMETRY MCSymmetry
INVARIANTS TypeOK G07_NoStaleOwnerStep
CHECK_DEADLOCK TRUE
