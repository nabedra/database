\* expect: G08_RetireEnds
\* The fence releases a published move's slot, but the retirement still requires the move to hold it (shipped machine/placement.rs retire), so the removed replica is never retired.
CONSTANTS
    w1 = w1  w2 = w2  w3 = w3  w4 = w4
    Worker = {w1, w2, w3, w4}
    Mutant = "retire_requires_slot"
    MaxLoss = 2
    MaxMoves = 1
    MaxRemoves = 1
SPECIFICATION LiveSpec
PROPERTIES G08_RetireEnds
CHECK_DEADLOCK TRUE
