\* expect: G02_LeaseReadFresh
\* Shipped openraft lease: no clock margin, so a drifting deposed leader serves a stale lease read.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3  n4 = n4  c1 = c1  c2 = c2
    Node = {n1, n2, n3, n4}
    Spare = n4
    Zone <- MCZone
    Client = {c1, c2}
    Mutant = "prefix_no_lease_margin"
    Ops = {"lease"}
    MaxTerm = 3
    MaxCrash = 1
    MaxWipe = 0
    MaxStale = 0
    MaxPart = 1
    MaxDrift = 1
    MaxDriftSteps = 4
    MaxTime = 5
    Lease = 5
    LeaseMargin = 2
INIT Init
NEXT Next
SYMMETRY MCSymVoters
INVARIANTS G02_LeaseReadFresh
CHECK_DEADLOCK TRUE
