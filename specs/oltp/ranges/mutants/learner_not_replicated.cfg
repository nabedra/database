\* expect: G08_MoveTerminates
\* The leader does not replicate to a learner, so it never catches up and the replacement never ends.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3  n4 = n4  c1 = c1  c2 = c2
    Node = {n1, n2, n3, n4}
    Spare = n4
    Zone <- MCZone
    Client = {c1, c2}
    Mutant = "learner_not_replicated"
    Ops = {"move"}
    MaxTerm = 5
    MaxCrash = 1
    MaxWipe = 1
    MaxStale = 0
    MaxPart = 1
    MaxDrift = 0
    MaxDriftSteps = 0
    MaxTime = 0
    Lease = 2
    LeaseMargin = 0
SPECIFICATION LiveSpec
PROPERTIES G08_MoveTerminates
\* The blocked protocol can stutter. Collect its temporal counterexample.
CHECK_DEADLOCK FALSE
