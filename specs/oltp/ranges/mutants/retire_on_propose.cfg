\* expect: G01_AckedDurable
\* The replaced voter is retired when the plan starts, before the new configuration commits.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3  n4 = n4  c1 = c1  c2 = c2
    Node = {n1, n2, n3, n4}
    Spare = n4
    Zone <- MCZone
    Client = {c1, c2}
    Mutant = "retire_on_propose"
    Ops = {"move"}
    MaxTerm = 3
    MaxCrash = 1
    MaxWipe = 1
    MaxStale = 0
    MaxPart = 1
    MaxDrift = 0
    MaxDriftSteps = 0
    MaxTime = 0
    Lease = 2
    LeaseMargin = 0
INIT Init
NEXT Next
SYMMETRY MCSymMove
INVARIANTS G01_AckedDurable
CHECK_DEADLOCK TRUE
