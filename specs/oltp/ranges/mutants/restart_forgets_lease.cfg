\* expect: G02_LeaseReadFresh
\* A restarted follower forgets the lease it granted.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3  n4 = n4  c1 = c1  c2 = c2
    Node = {n1, n2, n3, n4}
    Spare = n4
    Zone <- MCZone
    Client = {c1, c2}
    Mutant = "restart_forgets_lease"
    Ops = {"lease"}
    MaxTerm = 2
    MaxCrash = 1
    MaxWipe = 0
    MaxStale = 0
    MaxPart = 1
    MaxDrift = 1
    MaxDriftSteps = 3
    MaxTime = 3
    Lease = 3
    LeaseMargin = 1
INIT Init
NEXT Next
SYMMETRY MCSymVoters
INVARIANTS G02_LeaseReadFresh
CHECK_DEADLOCK TRUE
