\* T1 baseline, leases: clock drift within the bound, crash and partition; margin 2 x MaxDrift ticks.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3  n4 = n4  c1 = c1  c2 = c2
    Node = {n1, n2, n3, n4}
    Spare = n4
    Zone <- MCZone
    Client = {c1, c2}
    Mutant = "none"
    Ops = {"lease"}
    MaxTerm = 3
    MaxCrash = 1
    MaxWipe = 0
    MaxStale = 0
    MaxPart = 1
    MaxDrift = 1
    MaxDriftSteps = 4
    MaxTime = 5
    Lease = 5
    LeaseMargin = 2
INIT Init
NEXT Next
SYMMETRY MCSymVoters
INVARIANTS TypeOK G08_OneLeaderPerTerm G08_NoRevote G01_CommittedNeverLost G01_AckedDurable G02_LeaseReadFresh G08_ZonePlacement
CHECK_DEADLOCK TRUE
