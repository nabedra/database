\* T1 baseline: liveness after the fault budgets are spent, with a replacement.
\* No symmetry: TLC can miss liveness violations under it.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3  n4 = n4  c1 = c1  c2 = c2
    Node = {n1, n2, n3, n4}
    Spare = n4
    Zone <- MCZone
    Client = {c1, c2}
    Mutant = "none"
    Ops = {"move"}
    MaxTerm = 3
    MaxCrash = 1
    MaxWipe = 1
    MaxStale = 0
    MaxPart = 1
    MaxDrift = 0
    MaxDriftSteps = 0
    MaxTime = 0
    Lease = 2
    LeaseMargin = 0
SPECIFICATION LiveSpec
PROPERTIES G10_WritesComplete G08_MoveTerminates
CHECK_DEADLOCK TRUE
