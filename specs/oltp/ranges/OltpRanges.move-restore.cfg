\* T1 baseline, replacement of a voter with crash, pool loss, stale restore and partition, overlapping.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3  n4 = n4  c1 = c1  c2 = c2
    Node = {n1, n2, n3, n4}
    Spare = n4
    Zone <- MCZone
    Client = {c1, c2}
    Mutant = "none"
    Ops = {"move"}
    MaxTerm = 3
    MaxCrash = 1
    MaxWipe = 1
    MaxStale = 1
    MaxPart = 1
    MaxDrift = 0
    MaxDriftSteps = 0
    MaxTime = 0
    Lease = 2
    LeaseMargin = 0
INIT Init
NEXT Next
SYMMETRY MCSymMove
INVARIANTS TypeOK G08_OneLeaderPerTerm G08_NoRevote G01_CommittedNeverLost G01_AckedDurable G02_LeaseReadFresh G08_ZonePlacement
CHECK_DEADLOCK TRUE
