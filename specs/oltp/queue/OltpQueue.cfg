\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    w1 = w1
    w2 = w2
    w3 = w3
    w4 = w4
    r1 = r1
    r2 = r2
    NoW = NoW
    Workers <- MCWorkers4
    Reqs <- MCReqs2
    Mutant = "none"
    MaxCrash = 1
    MaxPartition = 1
    MaxStop = 1
    MaxLane = 1
    MaxReceiptFault = 1
    MaxLostAck = 1
    MaxFaults = 2
SPECIFICATION Spec
SYMMETRY Symmetry4
INVARIANTS
    TypeOK
    G07_ReadyHoldAccepted
    G07_NoStaleRecord
    G07_NoAbandonWhileHeld
    Q03_ExecuteOnlyAccepted
    G03_OnceExecution
    R04_NoOldRunExecution
    G04_AbandonedNeverCommits
    G04_NotAppliedHasProof
    G09_SettleOnce
    QueueRetention
    O14_RetryAttaches
    Receipt_Monotone
CHECK_DEADLOCK TRUE
