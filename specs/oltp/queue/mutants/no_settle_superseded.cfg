\* expect: L_ReservationsSettle
\* A superseded attempt that never settles also blocks Quiescent, so deadlock checking is off here and only
\* L_ReservationsSettle is checked: with several TLC workers the deadlock was otherwise found first (run 45805091930).
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    w1 = w1
    w2 = w2
    w3 = w3
    w4 = w4
    r1 = r1
    r2 = r2
    NoW = NoW
    Workers <- MCWorkers3
    Reqs <- MCReqs1
    Mutant = "no_settle_superseded"
    MaxCrash = 1
    MaxPartition = 1
    MaxStop = 0
    MaxLane = 0
    MaxReceiptFault = 0
    MaxLostAck = 1
    MaxFaults = 2
SPECIFICATION LiveSpec
PROPERTIES
    L_ReservationsSettle
INVARIANTS
    TypeOK
    G07_ReadyHoldAccepted
    G07_NoStaleRecord
    G07_NoAbandonWhileHeld
    Q03_ExecuteOnlyAccepted
    G03_OnceExecution
    R04_NoOldRunExecution
    G04_AbandonedNeverCommits
    G04_NotAppliedHasProof
    G09_SettleOnce
    QueueRetention
    O14_RetryAttaches
CHECK_DEADLOCK FALSE
