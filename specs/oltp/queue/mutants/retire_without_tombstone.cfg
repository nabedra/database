\* expect: G03_OnceExecution
\* Retirement drops the durable identity with the RAM copy, so a same-ID retry after retirement runs the mutation again.
\* Only G03 is checked: the dropped identity also breaks G07_ReadyHoldAccepted first.
CONSTANTS
    w1 = w1
    w2 = w2
    w3 = w3
    w4 = w4
    r1 = r1
    r2 = r2
    NoW = NoW
    Workers <- MCWorkers3
    Reqs <- MCReqs1
    Mutant = "retire_without_tombstone"
    MaxCrash = 1
    MaxPartition = 1
    MaxStop = 1
    MaxLane = 1
    MaxReceiptFault = 1
    MaxLostAck = 1
    MaxFaults = 2
SPECIFICATION Spec
SYMMETRY Symmetry3
INVARIANTS
    TypeOK
    G03_OnceExecution
CHECK_DEADLOCK TRUE
