\* Fixed design: read-only outcomes recorded (lead decision 2026-11-24), outcome_unknown for an unsettled
\* mutation (section 6), pending kept after an unknown proposal. The shipped design fails: mutants/prefix_*.cfg.
\* L3 bounds: 3 nodes, 2 ranges, 2 clients; every fault kind once, at most 2 per behavior (they may overlap).
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    Nodes <- MCNodes
    Ranges <- MCRanges
    Keys <- MCKeys
    RangeOf <- MCRangeOf
    Clients <- MCClients
    InitLeader <- MCInitLeader
    Scenarios <- MC1
    FaultKinds <- MCSafetyFaults
    MaxFaults = 2
    MaxAtt <- MCAtt
    MaxRetry <- MCRetry
    MaxRepeat <- MCZero
    MaxExecRetry = 1
    MaxReads = 1
    Mutant = "none"
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    G01_AckedDurable
    G02_SnapshotStable
    G03_OncePerKey
    G03_SameResult
    G03_RecordedPrecondition
    G03_DigestConflict
    G04_NotAppliedHasProof
SYMMETRY Sym
