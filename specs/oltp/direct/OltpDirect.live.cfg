\* Liveness after the faults stop (S1), without symmetry. Faults: each kind once, at most 2.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    Nodes <- MCNodes
    Ranges <- MCRanges
    Keys <- MCKeys
    RangeOf <- MCRangeOf
    Clients <- MCClients
    InitLeader <- MCInitLeader
    Scenarios <- MC1
    FaultKinds <- MCAllFaults
    MaxFaults = 2
    MaxAtt <- MCAtt
    MaxRetry <- MCRetry
    MaxRepeat <- MCZero
    MaxExecRetry = 1
    MaxReads = 0
    Mutant = "none"
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
PROPERTIES
    G10_ProposalsResolve
    G10_CallsAnswered
