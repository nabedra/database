\* no-mutant: TypeOK -- the type invariant; every safety run checks it.
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    Node = {n1, n2, n3}
    Range = {"r1", "r2"}
    Client = {"c1", "c2"}
    ClientRange <- MCClientRange
    ClientResult <- MCClientResult
    MaxResets = 2
    Mutant = "none"
INIT Init
NEXT Next
SYMMETRY MCSymmetry
INVARIANTS TypeOK G03_EnabledMembersUnderstand G03_ProposalHasFeature G03_FeatureStaysEnabled G03_RecordedOutcomeStable
CHECK_DEADLOCK TRUE
