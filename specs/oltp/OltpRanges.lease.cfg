\* T1 baseline, profile lease
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3  n4 = n4
    k1 = k1  k2 = k2  c1 = c1  c2 = c2
    g0 = g0  g1 = g1  g2 = g2
    Node <- MCNode
    Spare = n4
    Zone <- MCZone
    Key <- MCKey
    Client <- MCClient
    WKey <- MCWKey
    G0 = g0
    Children <- MCChildren
    ChildSpan <- MCChildSpan
    Mutant = "none"
    MaxTerm = 2
    MaxCrash = 1
    MaxWipe = 0
    MaxStale = 0
    MaxPart = 1
    MaxLoss = 1
    MaxDup = 0
    MaxRefuse = 0
    MaxDrift = 1
    MaxDriftSteps = 2
    MaxTime = 3
    Lease = 1
    MaxTs = 3
    MaxLog = 5
    Fixes = {}
    InitSplit = FALSE
    Ops = {"lease"}
INIT Init
NEXT Next
CONSTRAINT MCConstraint
INVARIANTS TypeOK G08_OneLeaderPerTerm G08_OneVotePerTerm G01_CommittedNeverLost G06_AckedAtOwner G06_NoStaleApply G02_LeaseReadFresh G08_PlacementMatchesData G08_ZonePlacement G08_SerialTopologyOps G08_EnrolledIdentity
SYMMETRY MCSymmetry
CHECK_DEADLOCK TRUE
