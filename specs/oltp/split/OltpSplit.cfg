\* T1 baseline: safety of the fixed design (barrier, release of an unbound abort,
\* receipt check, resume sweep). Every fault kind of the spec has budget 1.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3
    Node = {n1, n2, n3}
    Client = {"c1", "c2"}
    Left = {"c1"}
    Mutant = "none"
    MaxAttempts = 3
    MaxCrash = 1
    MaxPart = 1
    MaxCoord = 1
    MaxGiveUp = 1
    MaxLead = 1
    MaxDup = 1
    MaxFence = 1
INIT Init
NEXT Next
SYMMETRY MCSymmetry
INVARIANTS TypeOK G06_NoWriteLostAcrossSplit G06_NoWriteAtOldOwner G06_PublishUnderOwner G06_NoRefusalForLoad G06_SplitNotExhausted
CHECK_DEADLOCK TRUE
