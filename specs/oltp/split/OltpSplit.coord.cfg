\* T1 baseline, coordinator faults: coordinator crash, aborts after transient failures, a run-owner
\* fence and late copies, overlapping.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3
    Node = {n1, n2, n3}
    Client = {"c1", "c2"}
    Left = {"c1"}
    Mutant = "none"
    MaxAttempts = 3
    MaxCrash = 0
    MaxPart = 0
    MaxCoord = 1
    MaxGiveUp = 1
    MaxLead = 0
    MaxDup = 1
    MaxFence = 1
INIT Init
NEXT Next
SYMMETRY MCSymmetry
INVARIANTS TypeOK G06_NoWriteLostAcrossSplit G06_NoWriteAtOldOwner G06_PublishUnderOwner G06_NoRefusalForLoad G06_SplitNotExhausted
CHECK_DEADLOCK TRUE
