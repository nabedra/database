\* T1 baseline: liveness after the fault budgets are spent (coordinator crash, an abort, late copies).
\* No symmetry: TLC can miss liveness violations under it.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3
    Node = {n1, n2, n3}
    Client = {"c1", "c2"}
    Left = {"c1"}
    Mutant = "none"
    MaxAttempts = 3
    MaxCrash = 0
    MaxPart = 0
    MaxCoord = 1
    MaxGiveUp = 1
    MaxLead = 0
    MaxDup = 1
    MaxFence = 0
SPECIFICATION LiveSpec
PROPERTIES G06_SplitPublishes G06_PauseEnds G06_FreezeEnds G06_RoutesConverge
CHECK_DEADLOCK TRUE
