\* no-mutant: TypeOK -- the type invariant; every run checks it.
\* Safety of the shipped split: no barrier proposer.
\* Its liveness is not claimed here: see mutants/prefix_split_slots_exhausted.cfg.
CONSTANTS
    n1 = n1  n2 = n2  n3 = n3  c1 = c1  c2 = c2
    Node = {n1, n2, n3}
    Client = {c1, c2}
    Left = {c1}
    Barrier = "shipped"
    Fixes = {}
    Mutant = "none"
    MaxAttempts = 3
    MaxCrash = 1
    MaxPart = 1
    MaxCoord = 1
    MaxGiveUp = 1
    MaxLead = 1
    MaxDup = 1
INIT Init
NEXT Next
SYMMETRY MCSymmetry
INVARIANTS TypeOK G06_NoWriteLostAcrossSplit G06_NoWriteAtOldOwner G06_BarrierPreventsRefusal
CHECK_DEADLOCK TRUE
