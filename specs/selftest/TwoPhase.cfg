\* Tier T1: the exhaustive run. Three RMs, one TM crash and one lost message.
\* no-mutant: TypeOK -- the type invariant; every run checks it.
CONSTANTS
    RM <- MCRM
    MaxCrashes = 1
    MaxDrops = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK Consistent
PROPERTIES Termination
CHECK_DEADLOCK TRUE
