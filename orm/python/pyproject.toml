[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nabedra"
version = "0.2.2"
description = "Synchronous Python client for Nabedra Database and Cache"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Database",
]

[project.urls]
Repository = "https://github.com/nabedra/database"
Documentation = "https://github.com/nabedra/database/blob/main/orm/python/README.md"
Issues = "https://github.com/nabedra/database/issues"

[project.optional-dependencies]
arrow = ["pyarrow>=14"]
database = []
gateway = ["httpx>=0.27,<1"]
aws = ["boto3>=1.34,<2"]
eks-replacement = ["boto3>=1.34,<2", "cryptography>=40"]

[project.scripts]
nabedra = "nabedra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nabedra", "nabedra.*"]
namespaces = false
