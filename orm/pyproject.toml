[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshdb"
version = "0.1.0"
description = "Pure Python client for the MeshDB HTTP API"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
meshdb = "meshdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
